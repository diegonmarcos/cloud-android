plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// keyboard_media config → base64 → BuildConfig (mirrors superapp pattern).
// GIF API keys come from env (exported by build.sh _resolve_gif_keys via vault/sops).
def buildJson        = new groovy.json.JsonSlurper().parse(file("${rootDir}/build.json"))
def keyboardMediaB64 = groovy.json.JsonOutput.toJson(buildJson.keyboard_media ?: [:]).bytes.encodeBase64().toString()
def giphyApiKey      = (System.getenv('GIPHY_API_KEY') ?: '').toString()
def defaultLocales   = (buildJson.default_locales ?: []).join(',')

android {
    namespace 'com.diegonmarcos.cloudkeyboardlibs'
    compileSdk 36

    defaultConfig {
        applicationId 'com.diegonmarcos.cloudkeyboardlibs'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        // Native-library ABI filter — declared in build.json::android.abi_filters
        // so the choice stays data-driven (mirrors superapp + vault). Vosk/JNA
        // ship ~25MB of .so per ABI; unfiltered AGP bundled all 7 the deps carry
        // (incl. dead mips/mips64) = 99.5MB of a 129.7MB APK.
        ndk {
            abiFilters.addAll((buildJson.android?.abi_filters ?: ['arm64-v8a']) as List)
        }
        buildConfigField "String", "MEDIA_CONFIG_B64", "\"${keyboardMediaB64}\""
        buildConfigField "String", "GIPHY_API_KEY",   "\"${giphyApiKey}\""
        buildConfigField "String", "DEFAULT_LOCALES", "\"${defaultLocales}\""
    }

    signingConfigs {
        // Shared Cloud-constellation signing key (vault). build.sh::_resolve_signing
        // exports ANDROID_KEYSTORE_FILE/PASS/ALIAS/KEY_PASS after sops-decrypting
        // .vault/A0_keys/providers/android/signing.secrets.yaml.
        release {
            storeFile     = System.getenv("ANDROID_KEYSTORE_FILE") ? file(System.getenv("ANDROID_KEYSTORE_FILE")) : null
            storePassword = System.getenv("ANDROID_KEYSTORE_PASS") ?: ""
            keyAlias      = System.getenv("ANDROID_KEY_ALIAS")     ?: ""
            keyPassword   = System.getenv("ANDROID_KEY_PASS")      ?: ""
        }
    }

    buildTypes {
        debug { }
        release {
            minifyEnabled false
            def sc = signingConfigs.release
            signingConfig = (sc.storeFile != null) ? sc : signingConfigs.debug
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        buildConfig = true
        aidl true
    }

    // Bundle the keyboard dicts (word-suggestion + emoji .dict files) from
    // libs:keyboard's assets/dicts/ folder. No binary duplication — the same
    // directory that sync-keyboard-dicts populates. Files land at the root of
    // this APK's assets/ (not under "dicts/"), so CompanionDictExtractor in
    // cloud-keyboard opens them as assets.open(filename) without a subdir prefix.
    sourceSets {
        main {
            assets.srcDirs += [file("$rootDir/../ea_cloud-superapp/libs/keyboard/dicts-data")]
        }
    }
}

dependencies {
    implementation project(':libs:media')
    implementation project(':libs:translate')
    // ML Kit engine (LocalTranslateEngineClient) — registered in App.onCreate
    // so TranslateEngineService.translateBlocking can be called in-process.
    implementation project(':libs:translate-mlkit')
    implementation project(':libs:voice')
    // Vosk engine (LocalVoiceEngineClient) — registered in VoiceEngineService so
    // cross-process callers (cloud-keyboard) get in-process Vosk recognition.
    implementation project(':libs:voice-vosk')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
