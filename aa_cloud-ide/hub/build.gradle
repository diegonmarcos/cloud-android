plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ── Data-driven config bake ─────────────────────────────────────────────
// Everything the hub needs at runtime is read from the repo's source-of-truth
// JSON at config time and baked into BuildConfig — no parallel hardcoded list
// in Kotlin (FIRE rule 4). Bump a value in build.json / contract / data, get a
// rebuilt BuildConfig on the next gradle run.
def repoRoot   = rootDir                       // ea_cloud-ide/
def buildJson  = new groovy.json.JsonSlurper().parse(file("$repoRoot/build.json"))
def contract   = new groovy.json.JsonSlurper().parse(file("$repoRoot/contract/ide-ipc-v1.json"))
def endpoints  = new groovy.json.JsonSlurper().parse(file("$repoRoot/data/ide-endpoints.json"))

def runNumber  = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()
def codeBase   = (buildJson.android.version_code as Number).intValue()
def codeFinal  = codeBase + runNumber
def shortSha   = (System.getenv('GITHUB_SHA')
                  ?: providers.exec {
                         commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
                         ignoreExitValue = true
                     }.standardOutput.asText.get().trim()).take(8)
// Build timestamp (UTC) — mirrors ea_cloud-superapp; shown in the About popup.
def buildTimestamp = new java.text.SimpleDateFormat("yyyy-MM-dd HH:mm:ss 'UTC'").with {
    setTimeZone(java.util.TimeZone.getTimeZone('UTC'))
    format(new java.util.Date())
}

// IPC contract constants — single source of truth = contract/ide-ipc-v1.json.
def ipcAuthority  = contract.authority
def ipcPermission = contract.permission
def ipcVersion    = (contract.version as Number).intValue()

// Navigation: one-icon model (open_fork_action) + the wrapper-chrome parent
// chain. Both hub and (future) forks render their consistency top bar + launch
// each other from this — data-driven, never hardcoded.
def nav = contract.navigation
def navParentsB64 = groovy.json.JsonOutput.toJson(nav.parent_chain).bytes.encodeBase64().toString()

// Fork registry (app ids + tracker dirs + blocked state) baked as base64-JSON
// so the switcher UI renders its tiles from build.json::forks, not a hardcoded
// list. Base64 sidesteps Java-string-literal escaping.
def forksJson = groovy.json.JsonOutput.toJson(buildJson.forks.findAll { k, v -> !k.startsWith('_') })
def forksB64  = forksJson.bytes.encodeBase64().toString()
// Endpoints baked for the workspace root + 'open in app' deep-link fallbacks.
def endpointsB64 = groovy.json.JsonOutput.toJson(endpoints).bytes.encodeBase64().toString()

// GHCR + in-app updater config — same source of truth (build.json::release) the
// build.sh oras-push / oras-pull / gh-release steps read. The hub's
// com.diegonmarcos.ide.update package self-updates the hub APK from here; no
// hardcoded URLs in Kotlin (FIRE rule 4). Mirrors ea_cloud-superapp/libs:updater.
def ghcr = buildJson.release.ghcr
def au   = buildJson.release.auto_update

// ── About stack-scan (ported from ea_cloud-superapp via ea_cloud-comms) ──
// Compute "what's in this project" at config time so About → Stack ships no
// static manifest to drift: languages {label:{files,loc}} + framework deps +
// CI build-time history. Degrades gracefully offline (gh missing → "—").
def stackExtMap = [ "kt":"Kotlin", "java":"Java", "json":"JSON (config)",
    "gradle":"Gradle (Groovy)", "xml":"XML (manifest/res)", "aidl":"AIDL",
    "nix":"Nix", "sh":"Shell", "md":"Markdown", "pro":"ProGuard" ]
def stackSkip = ["build", ".gradle", "dist", ".result", ".git", "assets"]
def stackStats = [:]
repoRoot.eachFileRecurse { f ->
    if (!f.isFile()) return
    def rel = f.absolutePath.replace(repoRoot.absolutePath + "/", "")
    if (stackSkip.any { rel.startsWith(it + "/") || rel.contains("/" + it + "/") }) return
    def ext = f.name.tokenize(".").last().toLowerCase()
    def label = stackExtMap[ext]; if (label == null) return
    def loc = 0; try { loc = f.readLines("UTF-8").size() } catch (Throwable t) { return }
    def b = stackStats[label] ?: [files: 0, loc: 0]; b.files += 1; b.loc += loc; stackStats[label] = b
}
def stackLanguagesB64 = groovy.json.JsonOutput.toJson(stackStats).bytes.encodeBase64().toString()

def stackDeps = new TreeSet()
def depPattern = ~/\b(implementation|api|androidTestImplementation|testImplementation)\s*[\(\s]\s*['"]([^'":]+:[^'":]+:[^'"]+)['"]/
repoRoot.eachFileRecurse { f ->
    if (!f.isFile() || !f.name.endsWith(".gradle")) return
    def text = ""; try { text = f.text } catch (Throwable t) { return }
    depPattern.matcher(text).each { m -> stackDeps.add(m[2]) }
}
def stackFrameworksB64 = groovy.json.JsonOutput.toJson(stackDeps.toList()).bytes.encodeBase64().toString()

def buildHistorySecs = []
try {
    def ghOut = providers.exec {
        commandLine 'gh', 'run', 'list', '--workflow=ship-cloud-ide.yml',
            '--limit', '10', '--status', 'success', '--json', 'startedAt,updatedAt'
        ignoreExitValue = true
    }.standardOutput.asText.get().trim()
    if (ghOut.startsWith('[')) {
        new groovy.json.JsonSlurper().parseText(ghOut).each { r ->
            try {
                def s = java.time.Instant.parse(r.startedAt).epochSecond
                def e = java.time.Instant.parse(r.updatedAt).epochSecond
                if (e > s) buildHistorySecs << (e - s)
            } catch (Throwable t) { }
        }
    }
} catch (Throwable t) { }
def buildAvgSecs    = buildHistorySecs.isEmpty() ? -1L : (buildHistorySecs.sum() / buildHistorySecs.size()).longValue()
def buildLastSecs   = buildHistorySecs.isEmpty() ? -1L : (buildHistorySecs[0] as long)
def buildSampleSize = buildHistorySecs.size()

android {
    namespace 'com.diegonmarcos.ide'
    compileSdk 35

    defaultConfig {
        applicationId 'com.diegonmarcos.ide'
        minSdk 26
        targetSdk 34
        versionCode codeFinal
        versionName "${buildJson.android.version_name} (sha-${shortSha})"

        buildConfigField "int",    "IPC_VERSION",      "${ipcVersion}"
        buildConfigField "String", "IPC_AUTHORITY",    "\"${ipcAuthority}\""
        buildConfigField "String", "IPC_PERMISSION",   "\"${ipcPermission}\""
        buildConfigField "String", "FORKS_JSON_B64",   "\"${forksB64}\""
        buildConfigField "String", "ENDPOINTS_JSON_B64","\"${endpointsB64}\""
        buildConfigField "String", "GIT_SHORT_SHA",    "\"${shortSha}\""

        // UI defaults (build.json::ui). Floating wrapper bar off by default —
        // Cloud-SuperApp owns the system bar; Configs toggle re-enables it.
        buildConfigField "boolean", "OVERLAY_NAVBAR_DEFAULT", "${buildJson.ui.overlay_nav_bar_default}"

        // ABI map (build.json::release.abis) — the ABI-aware updater picks the
        // GHCR tag matching the device's ABI (default abi → no suffix).
        buildConfigField "String", "ABIS_JSON_B64", "\"${groovy.json.JsonOutput.toJson(buildJson.release.abis.findAll { k, v -> !k.startsWith('_') }).bytes.encodeBase64().toString()}\""
        buildConfigField "String", "BUILD_TIMESTAMP",  "\"${buildTimestamp}\""

        // Navigation (one-icon + wrapper chrome) — data-driven from contract.
        buildConfigField "String", "OPEN_FORK_ACTION",    "\"${nav.open_fork_action}\""
        buildConfigField "String", "ICON_MODEL",          "\"${nav.icon_model}\""
        buildConfigField "String", "NAV_PARENTS_JSON_B64","\"${navParentsB64}\""

        // GHCR + auto-update (com.diegonmarcos.ide.update) — data-driven.
        buildConfigField "String",  "GHCR_REGISTRY",   "\"${ghcr.registry}\""
        buildConfigField "String",  "GHCR_NAMESPACE",  "\"${ghcr.namespace}\""
        buildConfigField "String",  "GHCR_IMAGE",      "\"${ghcr.image}\""
        buildConfigField "String",  "GHCR_MEDIA_TYPE", "\"${ghcr.media_type}\""
        buildConfigField "String",  "AUTO_UPDATE_TAG", "\"${au.tag}\""
        buildConfigField "long",    "AUTO_UPDATE_INTERVAL_HOURS", "${au.interval_hours}L"
        buildConfigField "boolean", "AUTO_UPDATE_ENABLED",        "${au.enabled}"
        buildConfigField "boolean", "AU_REQUIRE_UNMETERED",       "${au.require_unmetered_network}"
        buildConfigField "boolean", "AU_REQUIRE_CHARGING",        "${au.require_charging}"
        buildConfigField "String",  "AU_INSTALL_MODE",            "\"${au.install_mode}\""

        // About → Stack (scanned at config time, never hardcoded).
        buildConfigField "String", "STACK_LANGUAGES_JSON_B64",  "\"${stackLanguagesB64}\""
        buildConfigField "String", "STACK_FRAMEWORKS_JSON_B64", "\"${stackFrameworksB64}\""
        buildConfigField "long",   "STACK_BUILD_AVG_SECS",      "${buildAvgSecs}L"
        buildConfigField "long",   "STACK_BUILD_LAST_SECS",     "${buildLastSecs}L"
        buildConfigField "int",    "STACK_BUILD_SAMPLE",        "${buildSampleSize}"

        // Resolve the IPC permission name into the manifest placeholder so the
        // <permission>/<provider>/<service> declarations stay data-driven too.
        manifestPlaceholders = [ ipcPermission: ipcPermission, ipcAuthority: ipcAuthority ]

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig = true
        aidl = true
    }

    // Stable signing — the WHOLE constellation (this hub + 3 forks + cloud-comms
    // + SuperApp) must share ONE key: the IPC permission is
    // protectionLevel=signature, so a mismatched signature means the forks /
    // SuperApp can't talk to the hub. The keystore at hub/keystores/ide.keystore
    // MUST contain the SAME keypair as cloud-comms' keystore (one constellation
    // signing identity) — generated once, stored in vault, wired via CI sops.
    // Local fallback to the framework default keystore keeps dev builds working
    // (they just can't cross-talk with CI-signed APKs).
    signingConfigs {
        debug {
            def ks = file('keystores/ide.keystore')
            if (ks.exists()) {
                storeFile     ks
                storePassword 'android'
                keyAlias      'idekey'
                keyPassword   'android'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // In-app updater (com.diegonmarcos.ide.update): WorkManager periodic check +
    // CoroutineWorker. GhcrClient uses built-in org.json (no extra dep).
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
