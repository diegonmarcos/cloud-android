<!DOCTYPE html>
<!--
  3D navigable Milky Way / solar system view, via the AAS WorldWide
  Telescope (WWT) "research app" -- a real, open-source (MIT, .NET
  Foundation), professionally-built WebGL engine, not something built here.
  github.com/WorldWideTelescope/wwt-web-client, embedded per its own
  documented pattern (docs.worldwidetelescope.org/research-app/latest/embedding).
  Sky/Milky Way imagery and the underlying sky-survey data are WWT's own
  (see worldwidetelescope.org for imagery credits) -- this file just embeds
  their hosted app, unlike the separately-credited local celestial/ dataset
  used by the older AR ConstellationsActivity (celestial/CREDITS.md).

  WHY EMBED INSTEAD OF BUILDING FROM SCRATCH: this covers three of the four
  requested layers for real, out of the box, via its own on-screen UI (not
  reimplemented here) --
    - "star dust" / Milky Way background: WWT's default sky background
      imagery + galacticMode/showGalacticGrid settings.
    - constellations: showConstellationFigures / showConstellationBoundries
      (real engine setting name, note the upstream spelling) /
      showConstellationLabels / showConstellationPictures -- all toggleable
      in its own settings panel.
    - dynamic vs static: WWT's own time control (play/pause, rate) drives
      real planetary motion via its own ephemeris; pausing freezes it.
    - "our solar system": WWT has a real, accurate solar-system view mode
      you can fly through (Sun/planets at true relative positions/motion).

  HONEST GAP, not silently glossed over: WWT is NOT built to fly between
  individual OTHER real star systems (e.g. Alpha Centauri) at correct
  relative 3D positions the way a catalog like HYG would support -- its
  "beyond the solar system" views are sky-imagery and cosmological-context
  zooms (Milky Way, nearby galaxies), not exocartography between named
  stars. If literal "visit other star systems in 3D" is required later,
  that's a separate build on top of the HYG star catalog (CC BY-SA 4.0,
  119k stars with parallax-derived 3D positions -- see the research notes
  in this session), not something WWT itself provides.

  This screen intentionally does NOT hide WWT's own UI chrome (no
  hideAllChrome setting) -- its built-in panels are the actual, tested
  controls for all of the above, rather than a thinner reimplementation
  here that could drift from what the engine really supports.
-->
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <style>
    html, body { height: 100%; margin: 0; padding: 0; background: #000; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <iframe
    id="wwtResearch"
    src="https://web.wwtassets.org/research/latest/"
    allow="accelerometer; clipboard-write; gyroscope"
    allowfullscreen
  ><p>ERROR: cannot display WorldWide Telescope research app!</p></iframe>
</body>
</html>
