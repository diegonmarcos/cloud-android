<!DOCTYPE html>
<!--
  Real 3D terrain (mountains that rise on tilt) AND globe view — MapLibre
  Native (the app's main renderer) has neither: no setTerrain/raster-dem tilt
  support, and globe projection is GL-JS-only (added in v5) with zero Android
  Native support even on the latest release (confirmed against
  github.com/maplibre/maplibre-native issue #3161 — still open/roadmap, not
  shipped). This screen uses MapLibre GL JS v5 in a WebView for both.
  maplibre-gl.js/css are bundled locally (assets/maplibre-gl.js, exact 5.24.0 --
  5.0.0 introduced globe support but GlobeControl had a UI-sync bug against
  setProjection() until 5.18.0 per the maplibre-gl-js changelog, so pinning
  below that would've silently regressed) instead of fetched from a CDN --
  the map ENGINE now loads with no network at all. The map TILES themselves
  (OpenFreeMap vector tiles, AWS Terrarium elevation) still need network,
  same as every other basemap in this app; true airplane-mode offline maps
  would mean bundling/caching tile data too, a separate, much larger feature
  not attempted here.
-->
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link href="maplibre-gl.css" rel="stylesheet" />
  <script src="maplibre-gl.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; background: #0d1117; }
    /* Vertically center the WHOLE top-right control stack (zoom, compass,
       globe, terrain, pitch-toggle, satellite -- all of them, added via
       real map.addControl(..., 'top-right') calls below) on the right
       edge, instead of MapLibre's default top-anchored placement. */
    .maplibregl-ctrl-top-right {
      top: 50%; bottom: auto; transform: translateY(-50%);
    }
    /* Our custom buttons (pitch-toggle, satellite) use MapLibre's own
       maplibregl-ctrl/maplibregl-ctrl-group classes so they're pixel-
       consistent with the built-in zoom/compass/globe/terrain buttons --
       just an emoji glyph instead of MapLibre's own icon sprite, since
       there's no custom icon in its spritesheet for either of these. */
    .cloudnav-ctrl-btn { font-size: 16px; }
    .cloudnav-ctrl-btn.active { background: #2b6cb0; }
    #cloudnav-exag-panel {
      position: absolute; left: 10px; top: 10px; z-index: 2;
      background: #1a1d24cc; color: #eee; border: 1px solid #ffffff33;
      border-radius: 6px; padding: 8px 12px; font: 12px sans-serif; width: 190px;
    }
    #cloudnav-exag-panel input[type=range] { width: 100%; }

    /* Flying-mode dual joysticks -- Mode 2 RC/flight-sim convention
       (verified real-world standard, not invented): left stick =
       throttle (Y) + rudder/yaw (X), right stick = pitch/climb (Y) +
       roll/bank-turn (X). Hidden until Flying Mode is toggled on. */
    .cloudnav-joystick {
      display: none; position: absolute; bottom: 24px; z-index: 3;
      width: 120px; height: 120px; border-radius: 50%;
      background: #ffffff14; border: 1px solid #ffffff33;
      touch-action: none; -webkit-tap-highlight-color: transparent;
    }
    .cloudnav-joystick.visible { display: block; }
    #cloudnav-stick-left { left: 20px; }
    #cloudnav-stick-right { right: 20px; }
    .cloudnav-joystick-knob {
      position: absolute; left: 50%; top: 50%; width: 48px; height: 48px;
      margin: -24px 0 0 -24px; border-radius: 50%;
      background: #2b6cb0cc; border: 1px solid #6fb1ff;
    }
    #cloudnav-flight-hud {
      display: none; position: absolute; left: 50%; top: 10px; z-index: 3;
      transform: translateX(-50%); color: #eee; font: 12px monospace;
      background: #1a1d24cc; padding: 4px 10px; border-radius: 6px;
      text-align: center; white-space: nowrap;
    }
    #cloudnav-flight-hud.visible { display: block; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="cloudnav-stick-left" class="cloudnav-joystick"><div class="cloudnav-joystick-knob"></div></div>
  <div id="cloudnav-stick-right" class="cloudnav-joystick"><div class="cloudnav-joystick-knob"></div></div>
  <div id="cloudnav-flight-hud"></div>
  <div id="cloudnav-exag-panel">
    Exaggeration: <span id="cloudnav-exag-value"></span>x
    <input type="range" id="cloudnav-exag-slider" min="1" max="100" step="1" />
  </div>
  <script>
    // Tweak these by hand and reload — no rebuild needed, this file loads
    // straight from assets. exaggeration/hillshadeExaggeration/shadowColor
    // are the knobs that most affect how "mountain-y" this looks. Editing
    // this SOURCE constant only takes effect on the next build though --
    // exaggeration specifically also has a REAL in-app slider (below,
    // #cloudnav-exag-slider) that changes it live and persists the choice
    // via localStorage, since editing a bundled asset file isn't something
    // an installed app can actually do.
    // Rounded + clamped so a leftover decimal/out-of-range value saved
    // before the range was widened to 1x-100x doesn't render oddly.
    const savedExaggeration = Math.round(parseFloat(localStorage.getItem('cloudnav_exaggeration')));
    const TERRAIN_CONFIG = {
      center: [7.6586, 45.9763], // Matterhorn — real named peak, not a generic town
      zoom: 12.2,
      pitch: 70,
      maxPitch: 85,
      // 1.4 (real terrain, no exaggeration) was visually indistinguishable
      // from flat ground next to Liberty's building extrusions. Slider
      // range is 1x-100x, whole steps only (per request), default 3x.
      exaggeration: Number.isFinite(savedExaggeration) ? Math.min(100, Math.max(1, savedExaggeration)) : 3,
      hillshadeExaggeration: 0.5,
      // Default MapLibre hillshade shadow is flat gray-blue; MapLibre's own
      // official 3D-terrain example (maplibre.org/maplibre-gl-js/docs/examples/3d-terrain)
      // uses this warm brown instead, which reads more like real rock/soil
      // shadow than a generic render — verified against their published code.
      hillshadeShadowColor: '#473B24',
      skySunIntensity: 8,
      // Mapterhorn, not the old AWS elevation-tiles-prod (Terrarium/Joerd)
      // bucket -- MapLibre's own official "3D Terrain" example switched to
      // this source. Verified live (curl: HTTP 200 real webp tiles) and
      // verified real coverage up to z17 right at the Matterhorn (z18
      // 404s, so maxzoom below is measured, not guessed). Same 'terrarium'
      // pixel encoding as before, so no decode-side code changes needed --
      // only the source URL/tileSize/maxzoom differ. Requires attribution
      // per mapterhorn.com/attribution; see the addSource call below.
      demSource: {
        tiles: ['https://tiles.mapterhorn.com/{z}/{x}/{y}.webp'],
        tileSize: 512,
        maxzoom: 17,
        attribution: '© Mapterhorn',
      },
    };

    // Photorealistic satellite drape over the same 3D terrain mesh, toggled
    // by the on-screen button -- technique verified against MapLibre's own
    // "Display a hybrid satellite map with terrain elevation" example
    // (insert the raster layer directly below the hillshade layer so it's
    // still shaded, with vector roads/labels drawn above it, instead of
    // replacing the whole style). Tiles verified live (curl: HTTP 200 real
    // jpeg). LICENSE NOTE: EOX's Sentinel-2 cloudless 2018-2024 layers are
    // CC BY-NC-SA 4.0 -- non-commercial use only. Fine for this personal
    // app; do NOT ship this in anything commercial without EOX's paid
    // Commercial Attribution-RestrictedUse license instead.
    const SATELLITE_CONFIG = {
      tiles: ['https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg'],
      tileSize: 256,
      maxzoom: 14,
      attribution: 'Sentinel-2 cloudless — s2maps.eu by EOX IT Services GmbH (CC BY-NC-SA 4.0, contains modified Copernicus Sentinel data 2020)',
    };
    let satelliteOn = false;
    function toggleSatelliteDrape(btn) {
      if (satelliteOn) {
        if (map.getLayer('cloudnav-satellite')) map.removeLayer('cloudnav-satellite');
        if (map.getSource('cloudnav-satellite')) map.removeSource('cloudnav-satellite');
        satelliteOn = false;
      } else {
        map.addSource('cloudnav-satellite', {
          type: 'raster',
          tiles: SATELLITE_CONFIG.tiles,
          tileSize: SATELLITE_CONFIG.tileSize,
          maxzoom: SATELLITE_CONFIG.maxzoom,
          attribution: SATELLITE_CONFIG.attribution,
        });
        // Inserted directly below the hillshade layer so hillshade still
        // shades the satellite imagery (matches how real terrain photos
        // look under raking light), while vector roads/labels above the
        // hillshade layer stay on top and readable.
        map.addLayer({ id: 'cloudnav-satellite', type: 'raster', source: 'cloudnav-satellite' },
          map.getLayer('cloudnav-terrain-hillshade') ? 'cloudnav-terrain-hillshade' : firstSymbolLayerId());
        satelliteOn = true;
      }
      // Icon-only FAB now -- on/off state shown via the .active background
      // color (set below) plus this title tooltip, not button text.
      btn.title = satelliteOn ? 'Satellite drape: on' : 'Satellite drape: off';
      btn.classList.toggle('active', satelliteOn);
    }

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: TERRAIN_CONFIG.center,
      zoom: TERRAIN_CONFIG.zoom,
      pitch: TERRAIN_CONFIG.pitch,
      maxPitch: TERRAIN_CONFIG.maxPitch,
      hash: false,
    });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
    map.addControl(new maplibregl.GlobeControl(), 'top-right');
    // Built-in MapLibre control (maplibregl.TerrainControl, same one used in
    // MapLibre's own official 3D-terrain example) -- a real on-map button to
    // toggle terrain on/off, not a custom hack.
    map.addControl(new maplibregl.TerrainControl({
      source: 'cloudnav-terrain-dem',
      exaggeration: TERRAIN_CONFIG.exaggeration,
    }), 'top-right');

    // Minimal custom-control factory, using MapLibre's own documented
    // pattern (container class 'maplibregl-ctrl maplibregl-ctrl-group',
    // real IControl onAdd/onRemove interface -- verified against
    // TerrainControl's own source) so our buttons stack and look exactly
    // like the built-in ones instead of a separately-floating overlay.
    function makeButtonControl(iconText, initialTitle, onClick) {
      let container, btn;
      return {
        onAdd() {
          container = document.createElement('div');
          container.className = 'maplibregl-ctrl maplibregl-ctrl-group';
          btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'cloudnav-ctrl-btn';
          btn.textContent = iconText;
          btn.title = initialTitle;
          btn.addEventListener('click', () => onClick(btn));
          container.appendChild(btn);
          return container;
        },
        onRemove() { container.remove(); },
      };
    }

    // Real two-way pitch toggle. MapLibre's own compass button (above,
    // NavigationControl with visualizePitch:true) only resets to flat --
    // confirmed against its actual source (navigation_control.ts calls
    // map.resetNorthPitch(), which always goes to pitch 0, never back to
    // a tilted view). This button fills that gap: flat <-> the terrain
    // view's original isometric pitch, both ways.
    map.addControl(makeButtonControl('⛰️', 'Tilt to isometric view', (btn) => {
      const goingIsometric = map.getPitch() < 5;
      map.easeTo({ pitch: goingIsometric ? TERRAIN_CONFIG.pitch : 0 });
      btn.title = goingIsometric ? 'Flatten to top-down view' : 'Tilt to isometric view';
    }), 'top-right');

    map.addControl(makeButtonControl('🛰️', 'Satellite drape: off', (btn) => {
      toggleSatelliteDrape(btn);
    }), 'top-right');

    // ---- Flying mode: dual virtual joysticks + simplified arcade flight
    // physics, camera-driven over the same 3D terrain. ----
    //
    // Stick convention: real-world Mode 2 (the RC/mobile-flight-sim
    // standard, verified, not invented) -- left stick Y = throttle, left
    // stick X = rudder/yaw; right stick Y = pitch/climb, right stick X =
    // roll/bank.
    //
    // HONEST LIMITATION: MapLibre's camera has yaw (bearing) and pitch,
    // but no roll/bank axis -- there's no way to visually tilt the
    // horizon like a banking aircraft. Bank input is used the way real
    // aerodynamics actually uses it functionally (bank angle drives turn
    // rate), just without the visual roll MapLibre can't render. This is
    // a simplified arcade flight model (throttle->speed via lerp,
    // stick->target angular rate), the same real technique documented in
    // Godot's own "Arcade-style Airplane" recipe -- not full 6DOF
    // aerodynamics.
    const FLIGHT = {
      active: false,
      headingDeg: 0,      // current bearing, 0-360
      speed: 0,            // 0..1 fraction of max speed
      zoom: TERRAIN_CONFIG.zoom, // used as a proxy for altitude (standard
                                  // web-map convention: higher zoom = lower altitude)
      maxSpeedMps: 220,    // fast jet, arcade scale
      maxTurnRateDegPerSec: 45,
      maxClimbZoomPerSec: 0.6,
      throttleRate: 0.6,   // how fast throttle input reaches target speed (per second)
    };
    const EARTH_RADIUS_M = 6371000;

    function makeJoystick(el) {
      const knob = el.querySelector('.cloudnav-joystick-knob');
      let active = false;
      const state = { x: 0, y: 0 }; // normalized -1..1, y: -1 = up/forward
      function setFromEvent(ev) {
        const rect = el.getBoundingClientRect();
        const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
        const r = rect.width / 2;
        let dx = (ev.clientX - cx) / r, dy = (ev.clientY - cy) / r;
        const mag = Math.hypot(dx, dy);
        if (mag > 1) { dx /= mag; dy /= mag; }
        state.x = dx; state.y = dy;
        knob.style.transform = `translate(${dx * r * 0.6}px, ${dy * r * 0.6}px)`;
      }
      function reset() {
        active = false; state.x = 0; state.y = 0;
        knob.style.transform = 'translate(0,0)';
      }
      el.addEventListener('pointerdown', (ev) => { active = true; el.setPointerCapture(ev.pointerId); setFromEvent(ev); });
      el.addEventListener('pointermove', (ev) => { if (active) setFromEvent(ev); });
      el.addEventListener('pointerup', reset);
      el.addEventListener('pointercancel', reset);
      return state;
    }

    const stickLeft = makeJoystick(document.getElementById('cloudnav-stick-left'));
    const stickRight = makeJoystick(document.getElementById('cloudnav-stick-right'));

    // Real destination-point-given-bearing-and-distance formula (spherical
    // navigation, the standard used across aviation/marine software --
    // https://www.movable-type.co.uk/scripts/latlong.html's formulary),
    // not an approximation invented for this file.
    function destinationPoint(lat, lon, bearingDeg, distanceM) {
      const dR = distanceM / EARTH_RADIUS_M;
      const lat1 = lat * Math.PI / 180, lon1 = lon * Math.PI / 180;
      const brng = bearingDeg * Math.PI / 180;
      const lat2 = Math.asin(Math.sin(lat1) * Math.cos(dR) + Math.cos(lat1) * Math.sin(dR) * Math.cos(brng));
      const lon2 = lon1 + Math.atan2(
        Math.sin(brng) * Math.sin(dR) * Math.cos(lat1),
        Math.cos(dR) - Math.sin(lat1) * Math.sin(lat2)
      );
      return [lat2 * 180 / Math.PI, ((lon2 * 180 / Math.PI) + 540) % 360 - 180];
    }

    let flightLastFrame = null;
    function flightStep(now) {
      if (!FLIGHT.active) { flightLastFrame = null; return; }
      if (flightLastFrame == null) flightLastFrame = now;
      const dt = Math.min(0.1, (now - flightLastFrame) / 1000);
      flightLastFrame = now;

      // Throttle (left stick Y, up = -1 = full throttle) -> target speed,
      // approached via lerp (real arcade-flight-model technique).
      const throttleInput = Math.max(0, -stickLeft.y);
      const targetSpeed = throttleInput;
      FLIGHT.speed += (targetSpeed - FLIGHT.speed) * Math.min(1, FLIGHT.throttleRate * dt * 4);

      // Rudder/yaw (left stick X) + roll/bank (right stick X, functional
      // only -- see the honest-limitation note above) both contribute to
      // turn rate, banking scaled by current speed like a real aircraft
      // (banking at a standstill doesn't turn you).
      const yawRate = stickLeft.x * FLIGHT.maxTurnRateDegPerSec;
      const bankRate = stickRight.x * FLIGHT.maxTurnRateDegPerSec * FLIGHT.speed;
      FLIGHT.headingDeg = (FLIGHT.headingDeg + (yawRate + bankRate) * dt + 360) % 360;

      // Pitch/climb (right stick Y, up = -1 = climb) -> zoom-as-altitude.
      // Zoom DECREASES as you "climb" (standard web-map convention: lower
      // zoom = wider view = higher altitude).
      const climbInput = -stickRight.y;
      FLIGHT.zoom = Math.min(TERRAIN_CONFIG.zoom + 2, Math.max(9,
        FLIGHT.zoom - climbInput * FLIGHT.maxClimbZoomPerSec * dt));

      const distanceM = FLIGHT.speed * FLIGHT.maxSpeedMps * dt;
      const [lat2, lon2] = destinationPoint(map.getCenter().lat, map.getCenter().lng, FLIGHT.headingDeg, distanceM);

      map.jumpTo({ center: [lon2, lat2], bearing: FLIGHT.headingDeg, zoom: FLIGHT.zoom });

      const hud = document.getElementById('cloudnav-flight-hud');
      hud.textContent = `HDG ${Math.round(FLIGHT.headingDeg).toString().padStart(3, '0')}°  `
        + `SPD ${Math.round(FLIGHT.speed * 100)}%  ALT z${FLIGHT.zoom.toFixed(1)}`;

      requestAnimationFrame(flightStep);
    }

    map.addControl(makeButtonControl('✈️', 'Flying mode: off', (btn) => {
      FLIGHT.active = !FLIGHT.active;
      document.getElementById('cloudnav-stick-left').classList.toggle('visible', FLIGHT.active);
      document.getElementById('cloudnav-stick-right').classList.toggle('visible', FLIGHT.active);
      document.getElementById('cloudnav-flight-hud').classList.toggle('visible', FLIGHT.active);
      btn.classList.toggle('active', FLIGHT.active);
      btn.title = FLIGHT.active ? 'Flying mode: on' : 'Flying mode: off';
      // Hand off between the native map gestures and the joystick-driven
      // camera -- both fighting for the same touch input would be
      // unusable, so one is always fully off. All five are real MapLibre
      // GL JS interaction-handler methods (documented API, not invented).
      const handlers = [map.dragPan, map.dragRotate, map.scrollZoom, map.touchZoomRotate, map.touchPitch];
      if (FLIGHT.active) {
        handlers.forEach(h => h.disable());
        FLIGHT.headingDeg = map.getBearing();
        FLIGHT.zoom = map.getZoom();
        flightLastFrame = null;
        requestAnimationFrame(flightStep);
      } else {
        handlers.forEach(h => h.enable());
      }
    }), 'top-right');

    map.on('load', () => {
      // Globe at extreme zoom-out, morphing to flat Mercator as you zoom in —
      // GL JS v5's built-in globe/mercator behavior. MUST be called after the
      // style has loaded (MapLibre's own globe example calls this inside
      // 'style.load'/'load', not right after the Map constructor) — calling
      // it earlier is documented to silently fail. An earlier version of
      // this file called it synchronously right after construction, which
      // would have meant the globe projection never actually applied; moved
      // here after verifying the correct order against MapLibre's own
      // published example.
      map.setProjection({ type: 'globe' });

      map.addSource('cloudnav-terrain-dem', {
        type: 'raster-dem',
        tiles: TERRAIN_CONFIG.demSource.tiles,
        tileSize: TERRAIN_CONFIG.demSource.tileSize,
        encoding: 'terrarium',
        maxzoom: TERRAIN_CONFIG.demSource.maxzoom,
        attribution: TERRAIN_CONFIG.demSource.attribution,
      });
      map.setTerrain({ source: 'cloudnav-terrain-dem', exaggeration: TERRAIN_CONFIG.exaggeration });

      map.addLayer({
        id: 'cloudnav-terrain-hillshade',
        type: 'hillshade',
        source: 'cloudnav-terrain-dem',
        paint: {
          'hillshade-exaggeration': TERRAIN_CONFIG.hillshadeExaggeration,
          'hillshade-shadow-color': TERRAIN_CONFIG.hillshadeShadowColor,
        },
      }, firstSymbolLayerId());

      // Sky + atmosphere layer (GL JS 'sky' layer type, supported since v3,
      // real MapLibre API — not a mock) so the 3D relief reads unambiguously
      // as terrain against open sky, instead of looking like a building-only
      // scene with nothing behind it.
      map.addLayer({
        id: 'cloudnav-sky',
        type: 'sky',
        paint: {
          'sky-type': 'atmosphere',
          'sky-atmosphere-sun-intensity': TERRAIN_CONFIG.skySunIntensity,
        },
      });

      // This is a dedicated terrain view, not the main building-focused map —
      // 3D building extrusions here just compete visually with the mountain
      // relief they're meant to showcase, so hide them here specifically.
      for (const l of map.getStyle().layers || []) {
        if (l.type === 'fill-extrusion') map.setLayoutProperty(l.id, 'visibility', 'none');
      }

      // Forest/vegetation tint on top of the vector landcover layer, if present.
      if (map.getLayer('landcover_wood') || map.getLayer('landcover-wood')) {
        // style already has a wood layer — leave as-is, don't fight the base style.
      } else if (map.getLayer('landcover')) {
        map.setPaintProperty('landcover', 'fill-color', '#2f6b3a');
      }
    });

    function firstSymbolLayerId() {
      const layers = map.getStyle().layers || [];
      for (const l of layers) if (l.type === 'symbol') return l.id;
      return undefined;
    }

    // Kotlin -> JS bridge: CloudNavTerrain.recenter(lat, lon, zoom)
    window.cloudNavRecenter = function (lat, lon, zoom) {
      map.flyTo({ center: [lon, lat], zoom: zoom || map.getZoom(), essential: true });
    };

    // Live-editable exaggeration slider -- calls map.setTerrain() directly
    // (real MapLibre API, can be re-called any time to change an already-
    // active terrain's exaggeration). Configs > Layers (native, MapsLayerPrefs)
    // is the authoritative source now -- every change here is pushed back
    // through window.AndroidBridge (TerrainActivity's JS interface) so the
    // native tab and this in-page slider never drift out of sync. localStorage
    // is kept only as a fallback for the rare case this page is opened
    // without that bridge present (e.g. a future non-Android host).
    const exagSlider = document.getElementById('cloudnav-exag-slider');
    const exagValueLabel = document.getElementById('cloudnav-exag-value');
    exagSlider.value = TERRAIN_CONFIG.exaggeration;
    exagValueLabel.textContent = String(TERRAIN_CONFIG.exaggeration);
    exagSlider.addEventListener('input', () => {
      const v = parseInt(exagSlider.value, 10);
      applyExaggeration(v);
      if (window.AndroidBridge) window.AndroidBridge.setExaggeration(v);
      else localStorage.setItem('cloudnav_exaggeration', String(v));
    });

    function applyExaggeration(v) {
      TERRAIN_CONFIG.exaggeration = v;
      exagSlider.value = v;
      exagValueLabel.textContent = String(v);
      if (map.getSource('cloudnav-terrain-dem')) {
        map.setTerrain({ source: 'cloudnav-terrain-dem', exaggeration: v });
      }
    }

    // Called by TerrainActivity.onPageFinished with the current value from
    // Configs > Layers -- authoritative over whatever TERRAIN_CONFIG/
    // localStorage had, since the native tab is meant to be the one place
    // this setting actually lives.
    window.cloudNavSetExaggeration = function (v) {
      applyExaggeration(v);
    };
  </script>
</body>
</html>
