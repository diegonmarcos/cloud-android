<!DOCTYPE html>
<!--
  Real 3D terrain (mountains that rise on tilt) AND globe view — MapLibre
  Native (the app's main renderer) has neither: no setTerrain/raster-dem tilt
  support, and globe projection is GL-JS-only (added in v5) with zero Android
  Native support even on the latest release (confirmed against
  github.com/maplibre/maplibre-native issue #3161 — still open/roadmap, not
  shipped). This screen uses MapLibre GL JS v5 in a WebView for both.
  maplibre-gl.js/css are bundled locally (assets/maplibre-gl.js, exact 5.24.0 --
  5.0.0 introduced globe support but GlobeControl had a UI-sync bug against
  setProjection() until 5.18.0 per the maplibre-gl-js changelog, so pinning
  below that would've silently regressed) instead of fetched from a CDN --
  the map ENGINE now loads with no network at all. The map TILES themselves
  (OpenFreeMap vector tiles, AWS Terrarium elevation) still need network,
  same as every other basemap in this app; true airplane-mode offline maps
  would mean bundling/caching tile data too, a separate, much larger feature
  not attempted here.
-->
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link href="maplibre-gl.css" rel="stylesheet" />
  <script src="maplibre-gl.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; background: #0d1117; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      // Matterhorn (7.6586, 45.9763) — real named peak, not a generic town center.
      // The old center [8.5, 46.8] sat in a populated valley where Liberty's
      // fill-extrusion buildings visually swamped the (real but subtle) DEM
      // relief at exaggeration 1.4, reading as "just buildings" — not fake
      // terrain, just terrain nobody could actually see. Kotlin side
      // re-centers via flyTo/cloudNavRecenter regardless.
      center: [7.6586, 45.9763],
      zoom: 12.2,
      pitch: 70,
      maxPitch: 85,
      hash: false,
    });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));
    map.addControl(new maplibregl.GlobeControl());

    // Globe at extreme zoom-out, morphing to flat Mercator as you zoom in —
    // this is GL JS v5's built-in globe/mercator projection behavior.
    map.setProjection({ type: 'globe' });

    map.on('load', () => {
      map.addSource('cloudnav-terrain-dem', {
        type: 'raster-dem',
        tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
        tileSize: 256,
        encoding: 'terrarium',
        maxzoom: 15,
      });
      // 1.4 was numerically real terrain but visually indistinguishable from
      // flat ground next to Liberty's building extrusions — bumped to 1.8,
      // a value commonly used by terrain-demo maps specifically so alpine
      // relief reads clearly at typical mobile pitch/zoom.
      map.setTerrain({ source: 'cloudnav-terrain-dem', exaggeration: 1.8 });

      map.addLayer({
        id: 'cloudnav-terrain-hillshade',
        type: 'hillshade',
        source: 'cloudnav-terrain-dem',
        paint: { 'hillshade-exaggeration': 0.5 },
      }, firstSymbolLayerId());

      // Sky + atmosphere layer (GL JS 'sky' layer type, supported since v3,
      // real MapLibre API — not a mock) so the 3D relief reads unambiguously
      // as terrain against open sky, instead of looking like a building-only
      // scene with nothing behind it.
      map.addLayer({
        id: 'cloudnav-sky',
        type: 'sky',
        paint: {
          'sky-type': 'atmosphere',
          'sky-atmosphere-sun-intensity': 8,
        },
      });

      // This is a dedicated terrain view, not the main building-focused map —
      // 3D building extrusions here just compete visually with the mountain
      // relief they're meant to showcase, so hide them here specifically.
      for (const l of map.getStyle().layers || []) {
        if (l.type === 'fill-extrusion') map.setLayoutProperty(l.id, 'visibility', 'none');
      }

      // Forest/vegetation tint on top of the vector landcover layer, if present.
      if (map.getLayer('landcover_wood') || map.getLayer('landcover-wood')) {
        // style already has a wood layer — leave as-is, don't fight the base style.
      } else if (map.getLayer('landcover')) {
        map.setPaintProperty('landcover', 'fill-color', '#2f6b3a');
      }
    });

    function firstSymbolLayerId() {
      const layers = map.getStyle().layers || [];
      for (const l of layers) if (l.type === 'symbol') return l.id;
      return undefined;
    }

    // Kotlin -> JS bridge: CloudNavTerrain.recenter(lat, lon, zoom)
    window.cloudNavRecenter = function (lat, lon, zoom) {
      map.flyTo({ center: [lon, lat], zoom: zoom || map.getZoom(), essential: true });
    };
  </script>
</body>
</html>
