//
// libs:updater — in-app GHCR self-updater for Cloud Nav. Shared design with
// the other ea_cloud-* constellation apps (same signing key → no signature
// mismatch on update). Polls GHCR for an APK whose sha256 differs from the
// installed one, downloads it, and hands it to PackageInstaller (user prompts
// to confirm). All registry/tag/cadence config is data-driven from
// build.json::release — zero hardcoded URLs.
//
// JSON parsing uses org.json (bundled in Android) instead of
// kotlinx-serialization, so this module needs no extra gradle plugin.

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

def buildJson = new groovy.json.JsonSlurper().parse(file('../../build.json'))
def ghcr = buildJson.release.ghcr
def au   = buildJson.release.auto_update
// Short git sha = code-identity stamp. Matches the manifest revision annotation
// set by build.sh oras-push, so UpdateChecker can skip an identical-code rebuild.
def shortSha = (System.getenv('GITHUB_SHA')
                ?: providers.exec {
                       commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
                       ignoreExitValue = true
                   }.standardOutput.asText.get().trim())
                .take(8)
// ABI→update-tag map for the ABI-aware updater. Flattened from
// release.variants[]: each variant's supported_abis all point at its
// update_tag. Format: "abi=tag;abi=tag;…".
def auTagMap = (buildJson.release.variants ?: []).collectMany { v ->
    (v.supported_abis ?: []).collect { abi -> "${abi}=${v.update_tag}" }
}.join(';')

android {
    namespace 'com.diegonmarcos.cloudnav.updater'
    compileSdk 35

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'

        buildConfigField "String",  "GHCR_REGISTRY",        "\"${ghcr.registry}\""
        buildConfigField "String",  "GHCR_NAMESPACE",       "\"${ghcr.namespace}\""
        buildConfigField "String",  "GHCR_IMAGE",           "\"${ghcr.image}\""
        buildConfigField "String",  "GHCR_MEDIA_TYPE",      "\"${ghcr.media_type}\""
        buildConfigField "String",  "AUTO_UPDATE_TAG",      "\"${au.tag}\""
        buildConfigField "String",  "AUTO_UPDATE_TAG_MAP",  "\"${auTagMap}\""
        buildConfigField "long",    "AUTO_UPDATE_INTERVAL_HOURS",  "${au.interval_hours}L"
        buildConfigField "boolean", "AUTO_UPDATE_ENABLED",         "${au.enabled}"
        buildConfigField "boolean", "AU_REQUIRE_UNMETERED",        "${au.require_unmetered_network}"
        buildConfigField "boolean", "AU_REQUIRE_CHARGING",         "${au.require_charging}"
        buildConfigField "String",  "AU_INSTALL_MODE",             "\"${au.install_mode}\""
        buildConfigField "String",  "GIT_SHORT_SHA",               "\"${shortSha}\""
    }

    buildFeatures { buildConfig = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:core')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
