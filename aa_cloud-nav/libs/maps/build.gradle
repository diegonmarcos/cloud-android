//
// libs:maps — Cloud SuperApp's GPS tracker + MapLibre Native renderer
// + SQLite Stop store + MyTrips dashboards. All Maps* / Mytrips* /
// LocationTrackerService / StopsEnricher / MapsProviderClient sources
// live here; app/ only retains the SectionPages dispatch that imports
// these fragments.
//
// Native deps (MapLibre + Play Services Location) live in this module
// so they only build / ship when libs:maps is on the classpath.
// abiFilters declared in build.json::android.abi_filters apply to this
// module's native .so payload as well.

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// Same gradle-time bake pattern as app/build.gradle — read build.json
// once, emit BuildConfig fields the Kotlin sources reference at runtime.
// Library modules get their OWN BuildConfig namespaced to
// `android.namespace` below, so MapsProviders / MapsTrackingPrefs all
// resolve `BuildConfig.UI_MAPS_*` from THIS module's generated class.
def buildJson = new groovy.json.JsonSlurper().parse(file('../../build.json'))
def mapsProvidersJson = groovy.json.JsonOutput.toJson(buildJson.ui.maps_providers ?: [])
def mapsProvidersB64  = mapsProvidersJson.bytes.encodeBase64().toString()
def mapsActive        = buildJson.ui.maps_active   ?: [:]
def mapsActiveReverse = (mapsActive.reverse ?: 'nominatim_public').toString()
def mapsActivePoi     = (mapsActive.poi     ?: 'overpass_public').toString()
def mapsActiveSearch  = (mapsActive.search  ?: 'nominatim_public').toString()
def mapsTracking      = buildJson.ui.maps_tracking ?: [:]
def mapsIntervalMoving  = (mapsTracking.interval_moving_ms   as Number)?.intValue() ?: 30000
def mapsIntervalStopped = (mapsTracking.interval_stopped_ms  as Number)?.intValue() ?: 300000
def mapsMovingMps       = (mapsTracking.moving_threshold_mps as Number)?.doubleValue() ?: 2.0d
def mapsStopsRadiusM    = (mapsTracking.stops_radius_m       as Number)?.intValue() ?: 50
def mapsStopsDwellMin   = (mapsTracking.stops_dwell_min      as Number)?.intValue() ?: 5
def mapsVersionName     = (buildJson.android.version_name ?: '0.0.0').toString()
def mapStylesB64        = groovy.json.JsonOutput.toJson(buildJson.ui.map_styles ?: [:]).bytes.encodeBase64().toString()
def demoStopsB64        = groovy.json.JsonOutput.toJson(buildJson.ui.demo_stops ?: [:]).bytes.encodeBase64().toString()

android {
    namespace 'com.diegonmarcos.cloudnav.maps'
    compileSdk 35
    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
        // Mirror app/'s ABI filter — keeps the native .so payload to
        // arm64-v8a only when this module is compiled standalone.
        ndk {
            def abis = buildJson.android.abi_filters ?: ['arm64-v8a']
            abiFilters.addAll(abis as List)
        }
        buildConfigField "String", "UI_MAPS_PROVIDERS_B64",        "\"${mapsProvidersB64}\""
        buildConfigField "String", "UI_MAPS_ACTIVE_REVERSE",       "\"${mapsActiveReverse}\""
        buildConfigField "String", "UI_MAPS_ACTIVE_POI",           "\"${mapsActivePoi}\""
        buildConfigField "String", "UI_MAPS_ACTIVE_SEARCH",        "\"${mapsActiveSearch}\""
        buildConfigField "int",    "UI_MAPS_INTERVAL_MOVING_MS",   "${mapsIntervalMoving}"
        buildConfigField "int",    "UI_MAPS_INTERVAL_STOPPED_MS",  "${mapsIntervalStopped}"
        buildConfigField "double", "UI_MAPS_MOVING_THRESHOLD_MPS", "${mapsMovingMps}"
        buildConfigField "int",    "UI_MAPS_STOPS_RADIUS_M",       "${mapsStopsRadiusM}"
        buildConfigField "int",    "UI_MAPS_STOPS_DWELL_MIN",      "${mapsStopsDwellMin}"
        buildConfigField "String", "VERSION_NAME",                 "\"${mapsVersionName}\""
        buildConfigField "String", "UI_MAP_STYLES_B64",            "\"${mapStylesB64}\""
        buildConfigField "String", "UI_DEMO_STOPS_B64",            "\"${demoStopsB64}\""
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:core')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'

    // Material — pulled in for com.google.android.material.tabs.TabLayout
    // used by MapsTimelineTabsFragment (Daily | Stops tab host). Matches
    // app/'s Material pin so version skew is impossible.
    implementation 'com.google.android.material:material:1.12.0'

    // Fused Location Provider — battery-efficient GPS via Play Services
    // sensor-fusion + activity-recognition.
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    // WorkManager — drives TrackerWatchdog (PeriodicWorkRequest, ~15 min
    // cadence) that re-spawns LocationTrackerService when Samsung's
    // aggressive "Put apps to sleep" or memory-pressure killer takes
    // the foreground service down even with Battery Optimization off.
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    // MapLibre Native Android SDK — OSS map renderer using OSM tiles +
    // vector styles. Same family as `maplibre-gl` (JS) that
    // front/c-Suite/mymaps-navigation uses for visual consistency.
    implementation 'org.maplibre.gl:android-sdk:11.7.0'
}
