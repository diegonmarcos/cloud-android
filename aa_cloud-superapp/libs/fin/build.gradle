//
// libs:fin — Cloud SuperApp's MyFin section. Beta dashboard rendered
// from build.json::ui.myfin_mock; will swap to a real bank/account
// aggregator (Plaid / GoCardless / SaltEdge / manual import) later.
//
// Same data-bake pattern as libs:maps — read build.json once at
// gradle config time, emit UI_MYFIN_MOCK_B64 into THIS module's
// BuildConfig so the Kotlin sources resolve it from
// com.diegonmarcos.superapp.fin.BuildConfig.

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// Consumer-wins-with-fallback. This module is shared BY REFERENCE into other
// repos (ea_cloud-libs ships it as its own APK), so it must read the CONSUMING
// app's build.json first - a module-relative path always resolves to superapp's
// and the consumer's config would be silently ignored. The `ui` block is
// superapp-owned content that a wrapper repo has no reason to redeclare, so when
// the consumer does not define it we fall back to this module's home repo (same
// pattern as libs/voice).
def buildJson = new groovy.json.JsonSlurper().parse(file("${rootDir}/build.json"))
if (buildJson.ui == null) buildJson = new groovy.json.JsonSlurper().parse(file('../../build.json'))
def myfinMockJson = groovy.json.JsonOutput.toJson(buildJson.ui.myfin_mock ?: [:])
def myfinMockB64  = myfinMockJson.bytes.encodeBase64().toString()

android {
    namespace 'com.diegonmarcos.superapp.fin'
    compileSdk 36
    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
        ndk {
            def abis = buildJson.android.abi_filters ?: ['arm64-v8a']
            abiFilters.addAll(abis as List)
        }
        buildConfigField "String", "UI_MYFIN_MOCK_B64", "\"${myfinMockB64}\""
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:core')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
