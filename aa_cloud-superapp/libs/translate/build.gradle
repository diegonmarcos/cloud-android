// libs:translate — on-device translation engine for the vendored
// keyboard's TRANSLATE toolbar key. Self-contained ML Kit wrapper that
// lives OUTSIDE libs/keyboard/src/main so `build.sh sync-heliboard`
// (rsync --delete mirror of upstream HeliBoard) never clobbers it.
//
// ML Kit on-device translation: fully offline after the per-language
// model is fetched once (~30 MB/pair). No API key, no server, nothing
// leaves the device except the one-time model download from Google.
// libs:keyboard depends on this module; InputLogic's KeyCode.TRANSLATE
// handler calls Translator.translate(...).

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.diegonmarcos.superapp.translate'
    compileSdk 36
    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'

    // On-device translation + source-language auto-detection. Models
    // download lazily on first use, then run fully offline.
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:language-id:17.0.6'
}
