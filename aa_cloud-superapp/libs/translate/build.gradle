// libs:translate — translate engine interface + Translator orchestrator.
// ML-Kit-free; the actual ML Kit implementation lives in libs:translate-mlkit
// so cloud-keyboard (standalone IME) can depend on libs:translate without
// bundling ML Kit (it binds the companion cloud-keyboard-libs service instead).
//
// libs:keyboard depends on this module; InputLogic's KeyCode.TRANSLATE
// handler calls Translator.translate(...).

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.diegonmarcos.superapp.translate'
    compileSdk 36
    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
}
