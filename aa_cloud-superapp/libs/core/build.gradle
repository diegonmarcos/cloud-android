plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {

    buildFeatures {
        // IDataBackend: the shared contract for engine libraries that ship
        // as their own APK. Declared here because every app already links core.
        aidl true
    }

    namespace 'com.diegonmarcos.superapp.core'
    compileSdk 36

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.13.1'
}
