plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// Inject build.json::ui.sections[c3].pages[dagu-events].dagu_default_server
// into BuildConfig so the Dagu login form pre-fills the server URL
// without any caller passing it in. Data-driven — change the default
// in build.json, get a rebuilt BuildConfig.DAGU_DEFAULT_SERVER on the
// next gradle run. Same pattern libs/mail uses for JMAP_DEFAULT_SERVER
// and libs/chat for MATTERMOST_DEFAULT_SERVER.
// Consumer-wins-with-fallback. This module is shared BY REFERENCE into other
// repos (ea_cloud-libs ships it as its own APK), so it must read the CONSUMING
// app's build.json first - a module-relative path always resolves to superapp's
// and the consumer's config would be silently ignored. The `ui` block is
// superapp-owned content that a wrapper repo has no reason to redeclare, so when
// the consumer does not define it we fall back to this module's home repo (same
// pattern as libs/voice).
def buildJson = new groovy.json.JsonSlurper().parse(file("${rootDir}/build.json"))
if (buildJson.ui == null) buildJson = new groovy.json.JsonSlurper().parse(file('../../build.json'))
def c3Section = buildJson.ui.sections.find { it.id == 'c3' }
def daguPage = c3Section?.pages?.find { it.id == 'dagu-events' }
def daguServer = daguPage?.dagu_default_server ?: ''

android {
    namespace 'com.diegonmarcos.superapp.ops'
    compileSdk 36

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
        buildConfigField "String", "DAGU_DEFAULT_SERVER", "\"${daguServer}\""
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:core')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    // EncryptedSharedPreferences for bearer-token storage — same dep
    // libs/chat uses for MattermostPrefs.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
