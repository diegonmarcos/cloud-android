plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// Bake build.json::ui.kde_connect into BuildConfig as base64-JSON so the
// module reads a single source of truth at runtime — no hardcoded IPs /
// package names. Mirrors how libs:mail bakes jmap_default_server.
def buildJson  = new groovy.json.JsonSlurper().parse(file('../../build.json'))
def kdeConnect = buildJson.ui.kde_connect ?: [:]
def kdeJson    = groovy.json.JsonOutput.toJson(kdeConnect)
def kdeB64     = kdeJson.bytes.encodeBase64().toString()

android {
    namespace 'com.diegonmarcos.superapp.kdeconnect'
    compileSdk 35
    defaultConfig {
        minSdk 26
        buildConfigField "String", "KDE_CONNECT_B64", "\"${kdeB64}\""
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:core')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
