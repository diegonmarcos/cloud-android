plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// Bake build.json::ui.kde_connect into BuildConfig as base64-JSON so the
// module reads a single source of truth at runtime — no hardcoded IPs /
// package names. Mirrors how libs:mail bakes jmap_default_server.
// Consumer-wins-with-fallback. This module is shared BY REFERENCE into other
// repos (ea_cloud-libs ships it as its own APK), so it must read the CONSUMING
// app's build.json first - a module-relative path always resolves to superapp's
// and the consumer's config would be silently ignored. The `ui` block is
// superapp-owned content that a wrapper repo has no reason to redeclare, so when
// the consumer does not define it we fall back to this module's home repo (same
// pattern as libs/voice).
def buildJson = new groovy.json.JsonSlurper().parse(file("${rootDir}/build.json"))
if (buildJson.ui == null) buildJson = new groovy.json.JsonSlurper().parse(file('../../build.json'))
def kdeConnect = buildJson.ui.kde_connect ?: [:]
def kdeJson    = groovy.json.JsonOutput.toJson(kdeConnect)
def kdeB64     = kdeJson.bytes.encodeBase64().toString()
// Mesh topology snapshot (data/mesh.json) — the Probe section pings every
// declared wg0 peer. Same source the app bakes; read here so the module
// stays self-contained (no back-reference to app's BuildConfig).
def kdeMeshFile = file('../../data/mesh.json')
def kdeMeshJson = kdeMeshFile.exists() ? kdeMeshFile.text : '{}'
def kdeMeshB64  = kdeMeshJson.bytes.encodeBase64().toString()

android {
    namespace 'com.diegonmarcos.superapp.kdeconnect'
    compileSdk 36
    defaultConfig {
        minSdk 26
        buildConfigField "String", "KDE_CONNECT_B64", "\"${kdeB64}\""
        buildConfigField "String", "MESH_JSON_B64", "\"${kdeMeshB64}\""
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:core')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Clean-room self-signed X.509 generation for the device-identity
    // certificate (mutual-TLS pairing). The jdk15to18 variant coexists with
    // Android's repackaged com.android.org.bouncycastle, so it never clashes
    // with the platform provider. Standard crypto library — NOT KDE Connect's
    // GPL source; all protocol code here is original.
    // Pinned to 1.81 to match libs:shizuku-adb-debug-tools (libadb-android
    // pulls bcprov 1.81, and Gradle bumps the shared bcprov app-wide to the
    // highest version — bcpkix MUST match or its clinit NoClassDefFounds).
    // bcutil holds org.bouncycastle.asn1.* (incl. edec.EdECObjectIdentifiers)
    // that bcpkix's DefaultSignatureNameFinder.<clinit> references; declare it
    // here too so this module is self-contained instead of relying on the
    // shizuku module's bcutil leaking into the merged classpath.
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.81'
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.81'
    implementation 'org.bouncycastle:bcutil-jdk15to18:1.81'

    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
