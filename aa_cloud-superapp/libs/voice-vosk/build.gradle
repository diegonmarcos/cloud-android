// libs:voice-vosk — Vosk native-engine implementation of libs:voice's
// VoiceEngineClient interface. Contains libvosk.so (via the AAR) and
// VoiceModelManager (model download/cache). Included ONLY in cloud-keyboard-libs
// (the companion APK). cloud-keyboard omits this module so libvosk.so never
// enters the standalone keyboard APK.

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.diegonmarcos.superapp.voice.vosk'
    compileSdk 36
    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Interface + VoiceModelManager live in libs:voice (light module).
    implementation project(':libs:voice')
    // Vosk AAR bundles libvosk.so for arm64-v8a, armeabi-v7a, x86_64.
    implementation 'com.alphacephei:vosk-android:0.3.47'
    // JNA native bridge required by Vosk.
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
}
