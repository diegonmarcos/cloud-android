plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.diegonmarcos.superapp.health'
    compileSdk 34
    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }
    buildFeatures {
        // Pure-Compose surface — same pattern as libs:wallet. All 15
        // pages declared in build.json::ui.sections[id=health].pages[]
        // resolve to Composables here.
        compose = true
        buildConfig = true
    }
    composeOptions {
        // Pinned to Kotlin 1.9.24 → Compose Compiler 1.5.14, identical
        // to app/ and libs:wallet so every Compose module agrees on the
        // bytecode contract.
        kotlinCompilerExtensionVersion = '1.5.14'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:core')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'

    // ── Health Connect — the entire reason this module exists. ──────
    // Single SDK that surfaces the aggregated record set Garmin Connect,
    // Google Fit, Samsung Health, Fitbit, Oura (and any other Health-
    // Connect-compatible client) all sync INTO on-device. No OAuth, no
    // webhooks, no cloud egress — every read is a local SQLite query
    // against the system-wide Health Connect store.
    implementation 'androidx.health.connect:connect-client:1.1.0-alpha10'

    // Coroutines — HC client APIs are all suspend.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // ── Compose (BOM-pinned, matches libs:wallet and app). ──────────
    implementation platform('androidx.compose:compose-bom:2024.05.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.runtime:runtime'
    // activity-compose for rememberLauncherForActivityResult — used by
    // the permissions page to request HC permissions inline.
    implementation 'androidx.activity:activity-compose:1.9.0'

    // Instrumented test deps — drive the gateway against an emulator
    // with the Health Connect app installed, assert local-only contract.
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
}
