plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    // Kotlin 2.0+ Compose compiler plugin (replaces composeOptions.
    // kotlinCompilerExtensionVersion). Version pinned in root build.gradle.
    id 'org.jetbrains.kotlin.plugin.compose'
}

// ── Health metric taxonomy ──────────────────────────────────────────
// Read build.json once at config time, base64-encode the metric
// declaration block, and expose it as a BuildConfig string. The
// Compose surface (HealthPagesUi.kt) decodes it once at process
// start to render the 8 metric tiles + drill-downs in Summary /
// Timeline / Configs. Adding/removing a metric = one entry in
// build.json::ui.sections[id=health].metrics[] — no Kotlin edit.
// Consumer-wins-with-fallback. This module is shared BY REFERENCE into other
// repos (ea_cloud-libs ships it as its own APK), so it must read the CONSUMING
// app's build.json first - a module-relative path always resolves to superapp's
// and the consumer's config would be silently ignored. The `ui` block is
// superapp-owned content that a wrapper repo has no reason to redeclare, so when
// the consumer does not define it we fall back to this module's home repo (same
// pattern as libs/voice).
def healthBuildJson = new groovy.json.JsonSlurper().parse(file("${rootDir}/build.json"))
if (healthBuildJson.ui == null) healthBuildJson = new groovy.json.JsonSlurper().parse(file('../../build.json'))
def healthSectionDef = healthBuildJson.ui.sections.find { it.id == 'health' }
def healthMetricsRaw = healthSectionDef?.metrics ?: []
def healthMetricsJson = groovy.json.JsonOutput.toJson(healthMetricsRaw)
def healthMetricsB64  = healthMetricsJson.bytes.encodeBase64().toString()

android {
    namespace 'com.diegonmarcos.superapp.health'
    compileSdk 36
    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
        buildConfigField "String", "UI_HEALTH_METRICS_B64", "\"${healthMetricsB64}\""
    }
    buildFeatures {
        // Pure-Compose surface — same pattern as libs:wallet. Three
        // top-level pages declared in build.json::ui.sections[id=health]
        // .pages[] (summary / timeline / configs); per-metric drill-down
        // lives INSIDE each page as Compose state, driven by
        // build.json::ui.sections[id=health].metrics[].
        compose = true
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:core')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'

    // ── Health Connect — the entire reason this module exists. ──────
    // Single SDK that surfaces the aggregated record set Garmin Connect,
    // Google Fit, Samsung Health, Fitbit, Oura (and any other Health-
    // Connect-compatible client) all sync INTO on-device. No OAuth, no
    // webhooks, no cloud egress — every read is a local SQLite query
    // against the system-wide Health Connect store.
    implementation 'androidx.health.connect:connect-client:1.1.0-alpha10'

    // Coroutines — HC client APIs are all suspend.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // ── Compose (BOM-pinned, matches libs:wallet and app). ──────────
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.runtime:runtime'
    // activity-compose for rememberLauncherForActivityResult — used by
    // the permissions page to request HC permissions inline.
    implementation 'androidx.activity:activity-compose:1.9.0'

    // Instrumented test deps — drive the gateway against an emulator
    // with the Health Connect app installed, assert local-only contract.
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
}
