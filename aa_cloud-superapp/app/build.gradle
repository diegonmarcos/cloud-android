        buildConfigField "String", "UI_CONSOLIDATED_CONFIG", "\"${consolidatedCfg}\""
        buildConfigField "String", "UI_WG_TUNNEL_NAME",              "\"${wgTunnelName}\""
        buildConfigField "String", "UI_WG_INTERFACE_ADDRESS",        "\"${wgIfAddress}\""
        buildConfigField "String", "UI_WG_INTERFACE_DNS",            "\"${wgIfDns}\""
        buildConfigField "String", "UI_WG_INTERFACE_LISTEN_PORT",    "\"${wgIfListenPort}\""
        buildConfigField "String", "UI_WG_INTERFACE_MTU",            "\"${wgIfMtu}\""
        buildConfigField "String", "UI_WG_PEERS_JSON_B64",           "\"${wgPeersB64}\""
        // Stack scan results — bakes the source-of-truth at build time so
        // the About → Stack section doesn't have to ship a static manifest.
        buildConfigField "String", "UI_STACK_LANGUAGES_JSON_B64",    "\"${stackLanguagesB64}\""
        buildConfigField "String", "UI_STACK_FRAMEWORKS_JSON_B64",   "\"${stackFrameworksB64}\""
        buildConfigField "String", "UI_STACK_FOLDER_TREE_B64",       "\"${stackTreeB64}\""
        // Wall-clock elapsed for app/build.gradle's config phase. Only a
        // partial picture (assemble runs after this gets baked), but a
        // reasonable proxy for "is the build getting slower over time".
        buildConfigField "long",   "STACK_GRADLE_CONFIG_MS",         "${System.currentTimeMillis() - gradleScriptStartMs}L"
        // Build-time history pulled from `gh run list` at config phase.
        // -1 means "no data" (gh missing / not authed / no network).
        buildConfigField "long",   "STACK_BUILD_AVG_SECS",           "${buildAvgSecs}L"
        buildConfigField "long",   "STACK_BUILD_LAST_SECS",          "${buildLastSecs}L"
        buildConfigField "int",    "STACK_BUILD_SAMPLE",             "${buildSampleSize}"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig = true
        // AIDL — needed for the Shizuku UserService (IUserService.aidl)
        // that runs `dumpsys batterystats` in shell context for exact
        // per-app energy attribution.
        aidl = true
        // Jetpack Compose is enabled but used SURGICALLY — only the
        // Wallet surface (WalletFragment hosting a ComposeView) right
        // now. Every other fragment remains programmatic-View based.
        // Adopt per-fragment as new surfaces benefit from declarative
        // recomposition (animation-heavy, dynamic theming).
        compose = true
    }
    composeOptions {
        // Pinned to Kotlin 1.9.24 → Compose Compiler 1.5.14 per
        // https://developer.android.com/jetpack/androidx/releases/compose-kotlin
        kotlinCompilerExtensionVersion = '1.5.14'
    }

    // Stable signing — required for the in-app updater to install update APKs.
    // The keystore is generated once in CI (cached forever via GHA) and lives at
    // app/keystores/debug.keystore. If it's missing locally (developer machine
    // without the cache), fall back to Android's framework default keystore so
    // local builds still work — they just won't be installable as updates to
    // CI-signed APKs (and vice versa).
    signingConfigs {
        debug {
            def projectKeystore = file('keystores/debug.keystore')
            if (projectKeystore.exists()) {
                storeFile     projectKeystore
                storePassword 'android'
                keyAlias      'androiddebugkey'
                keyPassword   'android'
            }
        }
    }

    buildTypes {
        debug {
            // No applicationIdSuffix — this IS the daily app, not a "debug"
            // variant of a separate release app. Same on-device package
            // (com.diegonmarcos.superapp) so the in-app updater keeps the
            // upgrade chain stable.
            debuggable true
        }
        release {
            // Daily-driver app: keep debuggable=true even in release so adb
            // logcat / debugger always works regardless of which variant the
            // engine picks. No production-key custody — this is personal
            // infra, not Play Store distribution.
            debuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:core')
    implementation project(':libs:updater')
    implementation project(':libs:mail')
    implementation project(':libs:cal')
    implementation project(':libs:feed')
    implementation project(':libs:net')
    implementation project(':libs:ops')
    implementation project(':libs:vault')
    implementation project(':libs:chat')
    implementation project(':libs:wallet')
    implementation project(':libs:health')
    implementation project(':libs:fin')
    implementation project(':libs:kde-connect')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // MediaStyle for the persistent floating-nav notification (album art +
    // up to 5 action buttons, 3 shown collapsed).
    implementation 'androidx.media:media:1.7.0'
    // WorkManager — used by BackgroundOrchestrator to cancel tagged
    // periodic jobs when the active theme's features.background_pause
    // is true (Cloud Power Saving). No producers in app/ enqueue work
    // yet; the cancel-by-tag calls are no-ops on a fresh install but
    // present so libs:updater / future producers can land their own
    // jobs under the same tag set without touching the orchestrator.
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // libs:browser — the in-app WebView host (was app/.../tabs/ until
    // the rename to Browser to free 'Tabs' for the App Tabs feature).
    // app/'s SectionPages dispatcher + MainActivity.launchUri import
    // BrowserHostFragment from this module.
    implementation project(':libs:browser')

    // libs:apptabs — the App Tabs (last-6 LRU shelf) feature.
    // MainActivity implements AppTabsHost (defined in libs:apptabs)
    // so the card-tap callback can re-navigate without libs:apptabs
    // reaching back into app/'s MainActivity by name.
    implementation project(':libs:apptabs')
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    // EncryptedSharedPreferences for ConfigsPrefs (imported bulk-config
    // blob). Same alpha pin libs:mail uses for JmapPrefs.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // ZXing core — pure Java QR encoder for the Virtual Business Card.
    // No camera scanning needed (we only encode), so the core artifact
    // is enough — no `zxing-android` needed.
    implementation 'com.google.zxing:core:3.5.3'

    // Shizuku — exact per-app energy attribution. The UserService
    // (IUserService.aidl + ShizukuUserService) runs `dumpsys
    // batterystats` in shell context (uid 2000) when the user has
    // Shizuku running + grants the app. api = client; provider =
    // the ShizukuProvider declared in the manifest.
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // ── Jetpack Compose (surgical adoption — WalletFragment only). ──
    // BOM pin keeps every Compose module on a compatible release; only
    // the artifacts we actually need are pulled in to keep the APK
    // delta minimal.
    implementation platform('androidx.compose:compose-bom:2024.05.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.runtime:runtime'
    // activity-compose provides rememberLauncherForActivityResult — the
    // Wallet add-card sheet uses it for the .vcf / .pkpass / .pass file
    // picker (ActivityResultContracts.GetContent).
    implementation 'androidx.activity:activity-compose:1.9.0'

    // ── Maps / Tracker stack lifted OUT to the ea_cloud-nav app ──
    // libs:maps (MapLibre Native + tracker + timeline + MyTrips) was moved
    // to the dedicated Cloud Nav app (../ea_cloud-nav/). SuperApp no longer
    // ships maps; BackgroundOrchestrator still issues a best-effort stop
    // intent by string to LocationTrackerService (no compile dep).

    // Instrumented tests — proves the build.json → BuildConfig → Sections
    // wiring for the companion external-apps registry (ExternalAppsTest).
    // Run via the engine: ./build.sh test connectedDebugAndroidTest
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
