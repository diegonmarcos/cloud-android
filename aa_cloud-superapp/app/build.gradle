        aidl = true
        // Jetpack Compose was used for libs:wallet (now moved to
        // ea_cloud-wallet — standalone constellation APK). No remaining
        // compose surfaces in this module; disabled so the Compose
        // compiler plugin is not invoked unnecessarily.
        compose = false
    }

    // Stable signing — required for the in-app updater to install update APKs.
    // The ONE shared Cloud-constellation key (release.jks + sops passwords) lives
    // in vault; build.sh::_resolve_signing resolves it and exports
    // ANDROID_KEYSTORE_FILE / _PASSWORD / KEY_ALIAS / KEY_PASSWORD (CI does the
    // same via the vault checkout + SOPS_AGE_KEY). The SAME key signs SuperApp /
    // Cloud-Nav / Cloud-Comms / Cloud-IDE so local + CI + every app produce a
    // matching signature and the in-app updater never rejects an install on a
    // signature mismatch. THERE IS NO FALLBACK: if ANDROID_KEYSTORE_FILE is
    // absent the build FAILS LOUD — it never substitutes a debug/legacy/freshly
    // generated key. Run via build.sh (or export the env yourself from vault).
    signingConfigs {
        debug {
            def envStore = System.getenv("ANDROID_KEYSTORE_FILE")
            if (envStore == null || envStore.isEmpty() || !file(envStore).exists()) {
                throw new GradleException("ONE shared constellation key required; run via build.sh / set ANDROID_KEYSTORE_FILE; no fallback")
            }
            storeFile     file(envStore)
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias      System.getenv("ANDROID_KEY_ALIAS")
            keyPassword   System.getenv("ANDROID_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            // No applicationIdSuffix — this IS the daily app, not a "debug"
            // variant of a separate release app. Same on-device package
            // (com.diegonmarcos.superapp) so the in-app updater keeps the
            // upgrade chain stable.
            debuggable true
            signingConfig signingConfigs.debug
        }
        release {
            // Daily-driver app: keep debuggable=true even in release so adb
            // logcat / debugger always works regardless of which variant the
            // engine picks. No production-key custody — this is personal
            // infra, not Play Store distribution.
            debuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Same shared key as debug → release APK is signed (no more
            // app-release-unsigned.apk fallback) and update-compatible.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
