plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Capture wall-clock start so we can emit gradle's config-phase
// elapsed time as a geeky data point in the About page below.
def gradleScriptStartMs = System.currentTimeMillis()

// Data-driven version code + name. Base from build.json; CI bumps via
// GITHUB_RUN_NUMBER so every push monotonically increases the version code
// (Android PackageInstaller refuses updates with non-increasing versionCode).
def buildJson  = new groovy.json.JsonSlurper().parse(file('../build.json'))
def runNumber  = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()
def codeBase   = (buildJson.android.version_code as Number).intValue()
def codeFinal  = codeBase + runNumber
// Short git sha for the welcome text — visible proof the update worked.
def shortSha = (System.getenv('GITHUB_SHA')
                ?: providers.exec {
                       commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
                   }.standardOutput.asText.get().trim())
                .take(8)
// Build date — UTC, ISO yyyy-MM-dd. Shown after the sha in versionName so
// you can tell at a glance how stale the installed APK is.
def buildDate = new java.text.SimpleDateFormat('yyyy-MM-dd').with {
    setTimeZone(java.util.TimeZone.getTimeZone('UTC'))
    format(new java.util.Date())
}
// Full build timestamp — date + time with seconds, UTC. Rendered on the
// SECOND line of the drawer header (separate from versionName which is
// already long enough on one line).
def buildTimestamp = new java.text.SimpleDateFormat("yyyy-MM-dd HH:mm:ss 'UTC'").with {
    setTimeZone(java.util.TimeZone.getTimeZone('UTC'))
    format(new java.util.Date())
}

// Bake build.json::ui.sections into BuildConfig as base64-JSON so Kotlin
// reads a single source of truth at runtime — no parallel hardcoded list.
// Base64 sidesteps Java-string-literal escaping for the embedded JSON.
def uiSectionsJson  = groovy.json.JsonOutput.toJson(buildJson.ui.sections)
def uiSectionsB64   = uiSectionsJson.bytes.encodeBase64().toString()
def defaultSection  = buildJson.ui.default_section ?: 'home'
def defaultMode     = buildJson.ui.default_mode    ?: 'apps'
def tileColumns     = (buildJson.ui.tile_columns as Number)?.intValue() ?: 3
def uiActionsJson    = groovy.json.JsonOutput.toJson(buildJson.ui.home_actions ?: [])
def uiActionsB64     = uiActionsJson.bytes.encodeBase64().toString()
def uiDrawerPrependJson = groovy.json.JsonOutput.toJson(buildJson.ui.home_drawer_prepend ?: [])
def uiDrawerPrependB64  = uiDrawerPrependJson.bytes.encodeBase64().toString()
def uiSamplesJson    = groovy.json.JsonOutput.toJson(buildJson.ui.page_samples ?: [:])
def uiSamplesB64     = uiSamplesJson.bytes.encodeBase64().toString()
def uiGroupsJson     = groovy.json.JsonOutput.toJson(buildJson.ui.home_groups ?: [])
def uiGroupsB64      = uiGroupsJson.bytes.encodeBase64().toString()
// Mesh + services topology come from snapshots committed in data/
// (regenerated via data/regen.sh from cloud / cloud-data upstream).
// Bake-time read + base64 so the parser only sees the raw bytes.
def meshFile         = file("../data/mesh.json")
def meshJson         = meshFile.exists() ? meshFile.text : "{}"
def meshB64          = meshJson.bytes.encodeBase64().toString()
def svcPubFile       = file("../data/services_public.json")
def svcPubJson       = svcPubFile.exists() ? svcPubFile.text : "[]"
def svcPubB64        = svcPubJson.bytes.encodeBase64().toString()
def svcPrivFile      = file("../data/services_private.json")
def svcPrivJson      = svcPrivFile.exists() ? svcPrivFile.text : "[]"
def svcPrivB64       = svcPrivJson.bytes.encodeBase64().toString()
def importSchemaJson = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(buildJson.ui.import_schema ?: [:]))
def importSchemaB64  = importSchemaJson.bytes.encodeBase64().toString()
def driveConnsJson   = groovy.json.JsonOutput.toJson(buildJson.ui.drive_connections ?: [])
def driveConnsB64    = driveConnsJson.bytes.encodeBase64().toString()
// Linktree snapshot — drives Tools aggregator (Apps + Admin modes).
// Source: front/a-Portals/linktree/src/data/personal-tools.json (snapshot
// committed in data/linktree.json via data/regen.sh).
def linktreeFile     = file("../data/linktree.json")
def linktreeJson     = linktreeFile.exists() ? linktreeFile.text : "{\"slides\":[]}"
def linktreeB64      = linktreeJson.bytes.encodeBase64().toString()
// News feeds + mail accounts come straight from build.json — fully
// declarative; no external snapshot. Keeps the data-driven contract.
def newsFeedsJson    = groovy.json.JsonOutput.toJson(buildJson.ui.news_feeds ?: [])
def newsFeedsB64     = newsFeedsJson.bytes.encodeBase64().toString()
def mailAccountsJson = groovy.json.JsonOutput.toJson(buildJson.ui.mail_accounts ?: [])
def mailAccountsB64  = mailAccountsJson.bytes.encodeBase64().toString()
// Profile defaults — first-run seed for ProfilePrefs. User can edit at
// runtime via Configs → Profile.
def profileDefault   = buildJson.ui.profile_default ?: [:]
def profileName      = (profileDefault.name     ?: '').toString()
def profileEmail     = (profileDefault.email    ?: '').toString()
def profileInitials  = (profileDefault.initials ?: '').toString()
def profileCompany   = (profileDefault.company  ?: '').toString()
def profileLocation  = (profileDefault.location ?: '').toString()
def profileWebsite   = (profileDefault.website  ?: '').toString()
def profileTitles    = (profileDefault.titles   ?: '').toString()
// WireGuard defaults — first-run seed for WireGuardPrefs. User edits at
// runtime via Configs → WireGuard. Private key + peer public/preshared
// keys are NOT seeded — generated, imported, or pasted by the user.
// Peers is an array baked as one base64 JSON blob (UI_WG_PEERS_JSON_B64)
// — WireGuardPrefs parses it at first launch; user can Add/Remove peers
// at runtime via the form.
def wgDefault       = buildJson.ui.wireguard_default ?: [:]
def wgTunnelName    = (wgDefault.tunnel_name              ?: '').toString()
def wgIfAddress     = (wgDefault.interface_address        ?: '').toString()
def wgIfDns         = (wgDefault.interface_dns            ?: '').toString()
def wgIfListenPort  = (wgDefault.interface_listen_port    ?: '').toString()
def wgIfMtu         = (wgDefault.interface_mtu            ?: '').toString()
def wgPeersJson     = groovy.json.JsonOutput.toJson(wgDefault.peers ?: [])
def wgPeersB64      = wgPeersJson.bytes.encodeBase64().toString()

// ── Stack scan ────────────────────────────────────────────────────────
// Data-driven snapshot of "what's inside this APK" for Configs → About →
// Stack. Computed from the actual repository contents at config time —
// no hardcoded list to drift. Two derived JSON blobs are baked into
// BuildConfig:
//   • UI_STACK_LANGUAGES_JSON_B64 — {language: {files, loc}} by extension
//   • UI_STACK_FRAMEWORKS_JSON_B64 — sorted unique deps from every
//     *.gradle in the repo (deduped, project(':...') skipped)
def repoRoot = rootDir.parentFile  // ea_cloud-superapp/

// Friendly-name table: filename extension → language label. Anything not
// listed here is ignored (build outputs, generated sources, .lock, etc.).
def stackExtMap = [
    "kt"     : "Kotlin",
    "java"   : "Java",
    "go"     : "Go (libwg-go)",
    "c"      : "C (ndk-compat)",
    "h"      : "C headers",
    "xml"    : "XML (resources/manifest)",
    "json"   : "JSON (config)",
    "gradle" : "Gradle (Groovy)",
    "kts"    : "Gradle (Kotlin DSL)",
    "groovy" : "Groovy",
    "sh"     : "Shell",
    "md"     : "Markdown",
    "nix"    : "Nix",
    "yml"    : "YAML",
    "yaml"   : "YAML",
    "pro"    : "ProGuard",
]
// Roots we count: app source, every libs/* source, root build/config.
def stackRoots = [
    new File(rootDir, "app/src/main"),
    new File(repoRoot, "libs"),
    new File(repoRoot, "build.json"),
    rootDir,                         // app/build.gradle, app/proguard
]
// Directories we skip (no point counting generated / external code).
def stackSkipDirs = [
    "build", ".gradle", ".idea", "dist", ".result",
    "libs/net/src/main/cpp/libwg-go/generated-src",
]
def stackStats = [:]  // ext -> [files: N, loc: M]
stackRoots.each { root ->
    if (!root.exists()) return
    root.eachFileRecurse { f ->
        if (!f.isFile()) return
        def rel = f.absolutePath.replace(rootDir.absolutePath + "/", "")
        if (stackSkipDirs.any { rel.startsWith(it) || rel.contains("/${it}/") }) return
        def ext = f.name.tokenize(".").last().toLowerCase()
        def label = stackExtMap[ext]
        if (label == null) return
        def loc = 0
        try { loc = f.readLines("UTF-8").size() } catch (Throwable t) { return }
        def bucket = stackStats[label] ?: [files: 0, loc: 0]
        bucket.files += 1
        bucket.loc   += loc
        stackStats[label] = bucket
    }
}
def stackLanguagesJson = groovy.json.JsonOutput.toJson(stackStats)
def stackLanguagesB64  = stackLanguagesJson.bytes.encodeBase64().toString()

// Framework scan: walk every *.gradle in this app/ + libs/, harvest
// `implementation`/`api`/`compileOnly` lines whose argument is a Maven
// coordinate (group:artifact:version). Skip `project(':libs:...')`
// entries — those are internal modules already covered by the module list.
def stackDeps = new TreeSet()
def depPattern = ~/\b(implementation|api|compileOnly|runtimeOnly|annotationProcessor|kapt)\s*[\(\s]\s*['"]([^'":]+:[^'":]+:[^'"]+)['"]/
def gradleSearchRoots = [rootDir, new File(repoRoot, "libs"), new File(repoRoot, "ea_cloud-superapp")]
gradleSearchRoots.findAll { it.exists() }.each { root ->
    root.eachFileRecurse { f ->
        if (!f.isFile()) return
        if (!(f.name.endsWith(".gradle") || f.name.endsWith(".gradle.kts"))) return
        def text = ""
        try { text = f.text } catch (Throwable t) { return }
        depPattern.matcher(text).each { m -> stackDeps.add(m[2]) }
    }
}
def stackFrameworksJson = groovy.json.JsonOutput.toJson(stackDeps.toList())
def stackFrameworksB64  = stackFrameworksJson.bytes.encodeBase64().toString()

android {
    namespace 'com.diegonmarcos.superapp'
    compileSdk 34

    defaultConfig {
        applicationId 'com.diegonmarcos.superapp'
        minSdk 26
        targetSdk 34
        versionCode codeFinal
        versionName "${buildJson.android.version_name} (sha-${shortSha})"
        buildConfigField "String", "GIT_SHORT_SHA",         "\"${shortSha}\""
        buildConfigField "String", "BUILD_TIMESTAMP",       "\"${buildTimestamp}\""
        buildConfigField "String", "UI_SECTIONS_JSON_B64",  "\"${uiSectionsB64}\""
        buildConfigField "String", "UI_DEFAULT_SECTION",    "\"${defaultSection}\""
        buildConfigField "String", "UI_DEFAULT_MODE",       "\"${defaultMode}\""
        buildConfigField "int",    "UI_TILE_COLUMNS",       "${tileColumns}"
        buildConfigField "String", "UI_HOME_ACTIONS_B64",   "\"${uiActionsB64}\""
        buildConfigField "String", "UI_HOME_DRAWER_PREPEND_B64", "\"${uiDrawerPrependB64}\""
        buildConfigField "String", "UI_PAGE_SAMPLES_B64",   "\"${uiSamplesB64}\""
        buildConfigField "String", "UI_HOME_GROUPS_B64",    "\"${uiGroupsB64}\""
        buildConfigField "String", "MESH_JSON_B64",         "\"${meshB64}\""
        buildConfigField "String", "SERVICES_PUBLIC_B64",   "\"${svcPubB64}\""
        buildConfigField "String", "SERVICES_PRIVATE_B64",  "\"${svcPrivB64}\""
        buildConfigField "String", "UI_IMPORT_SCHEMA_B64",  "\"${importSchemaB64}\""
        buildConfigField "String", "DRIVE_CONNECTIONS_B64", "\"${driveConnsB64}\""
        buildConfigField "String", "LINKTREE_JSON_B64",     "\"${linktreeB64}\""
        buildConfigField "String", "NEWS_FEEDS_B64",        "\"${newsFeedsB64}\""
        buildConfigField "String", "MAIL_ACCOUNTS_B64",     "\"${mailAccountsB64}\""
        buildConfigField "String", "UI_PROFILE_NAME",       "\"${profileName}\""
        buildConfigField "String", "UI_PROFILE_EMAIL",      "\"${profileEmail}\""
        buildConfigField "String", "UI_PROFILE_INITIALS",   "\"${profileInitials}\""
        buildConfigField "String", "UI_PROFILE_COMPANY",    "\"${profileCompany}\""
        buildConfigField "String", "UI_PROFILE_LOCATION",   "\"${profileLocation}\""
        buildConfigField "String", "UI_PROFILE_WEBSITE",    "\"${profileWebsite}\""
        buildConfigField "String", "UI_PROFILE_TITLES",     "\"${profileTitles}\""
        buildConfigField "String", "UI_WG_TUNNEL_NAME",              "\"${wgTunnelName}\""
        buildConfigField "String", "UI_WG_INTERFACE_ADDRESS",        "\"${wgIfAddress}\""
        buildConfigField "String", "UI_WG_INTERFACE_DNS",            "\"${wgIfDns}\""
        buildConfigField "String", "UI_WG_INTERFACE_LISTEN_PORT",    "\"${wgIfListenPort}\""
        buildConfigField "String", "UI_WG_INTERFACE_MTU",            "\"${wgIfMtu}\""
        buildConfigField "String", "UI_WG_PEERS_JSON_B64",           "\"${wgPeersB64}\""
        // Stack scan results — bakes the source-of-truth at build time so
        // the About → Stack section doesn't have to ship a static manifest.
        buildConfigField "String", "UI_STACK_LANGUAGES_JSON_B64",    "\"${stackLanguagesB64}\""
        buildConfigField "String", "UI_STACK_FRAMEWORKS_JSON_B64",   "\"${stackFrameworksB64}\""
        // Wall-clock elapsed for app/build.gradle's config phase. Only a
        // partial picture (assemble runs after this gets baked), but a
        // reasonable proxy for "is the build getting slower over time".
        buildConfigField "long",   "STACK_GRADLE_CONFIG_MS",         "${System.currentTimeMillis() - gradleScriptStartMs}L"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures { buildConfig = true }

    // Stable signing — required for the in-app updater to install update APKs.
    // The keystore is generated once in CI (cached forever via GHA) and lives at
    // app/keystores/debug.keystore. If it's missing locally (developer machine
    // without the cache), fall back to Android's framework default keystore so
    // local builds still work — they just won't be installable as updates to
    // CI-signed APKs (and vice versa).
    signingConfigs {
        debug {
            def projectKeystore = file('keystores/debug.keystore')
            if (projectKeystore.exists()) {
                storeFile     projectKeystore
                storePassword 'android'
                keyAlias      'androiddebugkey'
                keyPassword   'android'
            }
        }
    }

    buildTypes {
        debug {
            // No applicationIdSuffix — this IS the daily app, not a "debug"
            // variant of a separate release app. Same on-device package
            // (com.diegonmarcos.superapp) so the in-app updater keeps the
            // upgrade chain stable.
            debuggable true
        }
        release {
            // Daily-driver app: keep debuggable=true even in release so adb
            // logcat / debugger always works regardless of which variant the
            // engine picks. No production-key custody — this is personal
            // infra, not Play Store distribution.
            debuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:core')
    implementation project(':libs:updater')
    implementation project(':libs:mail')
    implementation project(':libs:cal')
    implementation project(':libs:feed')
    implementation project(':libs:net')
    implementation project(':libs:ops')
    implementation project(':libs:vault')
    implementation project(':libs:chat')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    // EncryptedSharedPreferences for ConfigsPrefs (imported bulk-config
    // blob). Same alpha pin libs:mail uses for JmapPrefs.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // ZXing core — pure Java QR encoder for the Virtual Business Card.
    // No camera scanning needed (we only encode), so the core artifact
    // is enough — no `zxing-android` needed.
    implementation 'com.google.zxing:core:3.5.3'
}
