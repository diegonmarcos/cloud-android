// ── Stack scan ────────────────────────────────────────────────────────
// Data-driven snapshot of "what's inside this APK" for Configs → About →
// Stack. Computed from the actual repository contents at config time —
// no hardcoded list to drift. Two derived JSON blobs are baked into
// BuildConfig:
//   • UI_STACK_LANGUAGES_JSON_B64 — {language: {files, loc}} by extension
//   • UI_STACK_FRAMEWORKS_JSON_B64 — sorted unique deps from every
//     *.gradle in the repo (deduped, project(':...') skipped)
def repoRoot = rootDir.parentFile  // ea_cloud-superapp/

// Friendly-name table: filename extension → language label. Anything not
// listed here is ignored (build outputs, generated sources, .lock, etc.).
def stackExtMap = [
    "kt"     : "Kotlin",
    "java"   : "Java",
    "go"     : "Go (libwg-go)",
    "c"      : "C (ndk-compat)",
    "h"      : "C headers",
    "xml"    : "XML (resources/manifest)",
    "json"   : "JSON (config)",
    "gradle" : "Gradle (Groovy)",
    "kts"    : "Gradle (Kotlin DSL)",
    "groovy" : "Groovy",
    "sh"     : "Shell",
    "md"     : "Markdown",
    "nix"    : "Nix",
    "yml"    : "YAML",
    "yaml"   : "YAML",
    "pro"    : "ProGuard",
]
// Roots we count: app source, every libs/* source, root build/config.
def stackRoots = [
    new File(rootDir, "app/src/main"),
    new File(repoRoot, "libs"),
    new File(repoRoot, "build.json"),
    rootDir,                         // app/build.gradle, app/proguard
]
// Directories we skip (no point counting generated / external code).
def stackSkipDirs = [
    "build", ".gradle", ".idea", "dist", ".result",
    "libs/net/src/main/cpp/libwg-go/generated-src",
]
def stackStats = [:]  // ext -> [files: N, loc: M]
stackRoots.each { root ->
    if (!root.exists()) return
    root.eachFileRecurse { f ->
        if (!f.isFile()) return
        def rel = f.absolutePath.replace(rootDir.absolutePath + "/", "")
        if (stackSkipDirs.any { rel.startsWith(it) || rel.contains("/${it}/") }) return
        def ext = f.name.tokenize(".").last().toLowerCase()
        def label = stackExtMap[ext]
        if (label == null) return
        def loc = 0
        try { loc = f.readLines("UTF-8").size() } catch (Throwable t) { return }
        def bucket = stackStats[label] ?: [files: 0, loc: 0]
        bucket.files += 1
        bucket.loc   += loc
        stackStats[label] = bucket
    }
}
def stackLanguagesJson = groovy.json.JsonOutput.toJson(stackStats)
def stackLanguagesB64  = stackLanguagesJson.bytes.encodeBase64().toString()

// Framework scan: walk every *.gradle in this app/ + libs/, harvest
// `implementation`/`api`/`compileOnly` lines whose argument is a Maven
// coordinate (group:artifact:version). Skip `project(':libs:...')`
// entries — those are internal modules already covered by the module list.
def stackDeps = new TreeSet()
def depPattern = ~/\b(implementation|api|compileOnly|runtimeOnly|annotationProcessor|kapt)\s*[\(\s]\s*['"]([^'":]+:[^'":]+:[^'"]+)['"]/
def gradleSearchRoots = [rootDir, new File(repoRoot, "libs"), new File(repoRoot, "ea_cloud-superapp")]
gradleSearchRoots.findAll { it.exists() }.each { root ->
    root.eachFileRecurse { f ->
        if (!f.isFile()) return
        if (!(f.name.endsWith(".gradle") || f.name.endsWith(".gradle.kts"))) return
        def text = ""
        try { text = f.text } catch (Throwable t) { return }
        depPattern.matcher(text).each { m -> stackDeps.add(m[2]) }
    }
}
def stackFrameworksJson = groovy.json.JsonOutput.toJson(stackDeps.toList())
def stackFrameworksB64  = stackFrameworksJson.bytes.encodeBase64().toString()

// ── Folder tree (2 levels, ea_* siblings) ─────────────────────────────
// Source of truth: data/folder-tree.txt, regenerated by
// `./build.sh refresh-tree`. We read the file rather than scan the
// filesystem because the ea_* siblings are gitignored and won't exist
// on the GHA build runner — the committed snapshot is the only way the
// shipped APK has access to that data. Local devs: rerun
// `./build.sh refresh-tree` whenever a sibling is cloned / removed and
// commit the change.
def stackTreeFile = new File(rootDir, "data/folder-tree.txt")
def stackTreeText = stackTreeFile.exists() ? stackTreeFile.text : "—"
def stackTreeB64  = stackTreeText.bytes.encodeBase64().toString()

// ── Build duration history (from gh CLI) ──────────────────────────────
// Run `gh run list` to pull the wall-clock duration of the last N
// successful GHA runs of this app's ship workflow. Used by the Stack
// section to surface "average build time" + "last build time" instead
// of just the UTC timestamp of THIS build (which the user reads here:
// reading is satisfying but doesn't tell you whether builds are
// getting slower or faster). Degrades cleanly if gh is missing or
// unauthenticated (e.g. offline / first-time clone) — fields fall back
// to -1, the UI renders "—".
def buildHistorySecs = []
try {
    def ghOut = providers.exec {
        commandLine 'gh', 'run', 'list',
            '--workflow=ship-cloud-superapp.yml',
            '--limit', '10',
            '--status', 'success',
            '--json', 'startedAt,updatedAt'
        ignoreExitValue = true
    }.standardOutput.asText.get().trim()
    if (ghOut.startsWith('[')) {
        new groovy.json.JsonSlurper().parseText(ghOut).each { r ->
            try {
                def s = java.time.Instant.parse(r.startedAt).epochSecond
                def e = java.time.Instant.parse(r.updatedAt).epochSecond
                if (e > s) buildHistorySecs << (e - s)
            } catch (Throwable t) { /* skip malformed */ }
        }
    }
} catch (Throwable t) {
    // gh CLI unavailable, not authenticated, or no network — leave empty
    // and the UI will render "—".
}
def buildAvgSecs    = buildHistorySecs.isEmpty() ? -1L : (buildHistorySecs.sum() / buildHistorySecs.size()).longValue()
def buildLastSecs   = buildHistorySecs.isEmpty() ? -1L : (buildHistorySecs[0] as long)
def buildSampleSize = buildHistorySecs.size()

android {
    namespace 'com.diegonmarcos.superapp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.diegonmarcos.superapp'
        minSdk 26
        targetSdk 34
        versionCode codeFinal
        versionName "${buildJson.android.version_name} (sha-${shortSha})"
        // Native-library ABI filter — declared in build.json::android.abi_filters
        // so the choice stays data-driven. Default = arm64-v8a only,
        // which trims MapLibre's native .so payload from ~60 MB across
        // 4 ABIs to ~15 MB for one ABI. Trades older-32-bit-device + x86-
        // emulator support for ~45 MB APK savings.
        ndk {
            // ABI is data-driven with an env override: the engine exports
            // SUPERAPP_ABIS (CSV) per release.variants[] when SUPERAPP_VARIANT
            // is set (CI builds one job per ABI). Unset → build.json default
            // (arm64-v8a), i.e. the phone build is byte-identical to before.
            def abiOverride = System.getenv('SUPERAPP_ABIS')
            def abis = (abiOverride?.trim()) \
                ? abiOverride.split(',').collect { it.trim() }.findAll { it } \
                : (buildJson.android.abi_filters ?: ['arm64-v8a'])
            abiFilters.addAll(abis as List)
        }
        buildConfigField "String", "GIT_SHORT_SHA",         "\"${shortSha}\""
        buildConfigField "String", "BUILD_TIMESTAMP",       "\"${buildTimestamp}\""
        buildConfigField "String", "UI_SECTIONS_JSON_B64",  "\"${uiSectionsB64}\""
        buildConfigField "String", "UI_PERMISSIONS_RUNTIME_B64", "\"${uiPermissionsRuntimeB64}\""
        buildConfigField "String", "UI_PERMISSIONS_ROLES_B64", "\"${uiPermissionsRolesB64}\""
        buildConfigField "String", "UI_DEFAULT_SECTION",    "\"${defaultSection}\""
        buildConfigField "String", "UI_DEFAULT_MODE",       "\"${defaultMode}\""
        buildConfigField "int",    "UI_TILE_COLUMNS",       "${tileColumns}"
        buildConfigField "String", "UI_HOME_ACTIONS_B64",   "\"${uiActionsB64}\""
        buildConfigField "String", "UI_HOME_DRAWER_PREPEND_B64", "\"${uiDrawerPrependB64}\""
        buildConfigField "String", "UI_PAGE_SAMPLES_B64",   "\"${uiSamplesB64}\""
        buildConfigField "String", "UI_HOME_GROUPS_B64",    "\"${uiGroupsB64}\""
        buildConfigField "String", "UI_LAUNCHER_THEMES_B64", "\"${uiLauncherThemesB64}\""
        buildConfigField "String", "UI_LAUNCHER_PROFILES_B64", "\"${uiLauncherProfilesB64}\""
        buildConfigField "String", "UI_HOME_APPS_TABS_B64",   "\"${uiHomeAppsTabsB64}\""
        buildConfigField "String", "UI_SWIPE_WALK_B64",       "\"${uiSwipeWalkB64}\""
        buildConfigField "String", "UI_SEARCH_SCOPES_B64",    "\"${uiSearchScopesB64}\""
        buildConfigField "String", "UI_PHONE_FOLDERS_B64",    "\"${uiPhoneFoldersB64}\""
        buildConfigField "String", "UI_PHONE_SECTIONS_B64",   "\"${uiPhoneSectionsB64}\""
        buildConfigField "String", "UI_PHONE_SMART_FOLDERS_B64", "\"${uiPhoneSmartFoldersB64}\""
        buildConfigField "String", "UI_SUITE_PHONE_GROUPS_B64", "\"${uiSuitePhoneGroupsB64}\""
        buildConfigField "int",    "UI_PHONE_GRID_COLUMNS",   "${phoneGridColumns}"
        buildConfigField "String", "UI_DYNAMIC_ISLAND_ACTION","\"${dynamicIslandAction}\""
        buildConfigField "String", "MESH_JSON_B64",         "\"${meshB64}\""
        buildConfigField "String", "SERVICES_PUBLIC_B64",   "\"${svcPubB64}\""
