def uiPermissionsRuntimeJson = groovy.json.JsonOutput.toJson(buildJson.ui.permissions?.runtime ?: [])
def uiPermissionsRuntimeB64  = uiPermissionsRuntimeJson.bytes.encodeBase64().toString()
