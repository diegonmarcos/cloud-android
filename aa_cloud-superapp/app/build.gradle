// ── AST tree (app code structure) — generated from the Kotlin source ──
// Scans app/ + every libs/* module and groups top-level TYPE declarations
// by package → file, so the "AST" button in Configs/About#Stack shows the
// real code map (module → package → file → class/object/interface).
def astTreeText = { ->
    def declRe = ~/(?m)^[a-z ]*\b(data class|sealed class|enum class|annotation class|class|object|interface)\s+([A-Za-z0-9_]+)/
    def pkgRe  = ~/(?m)^\s*package\s+([\w.]+)/
    def roots = []
    def appSrc = new File(rootDir, "app/src/main/java"); if (appSrc.exists()) roots << [m: "app", d: appSrc]
    (new File(repoRoot, "libs").listFiles() ?: []).findAll { it.directory }.sort { it.name }.each {
        def s = new File(it, "src/main/java"); if (s.exists()) roots << [m: "libs:${it.name}".toString(), d: s]
    }
    def sb = new StringBuilder()
    roots.each { root ->
        def byPkg = new TreeMap()
        root.d.eachFileRecurse { f ->
            if (!f.isFile() || !f.name.endsWith(".kt")) return
            def txt = ""; try { txt = f.text } catch (Throwable t) { return }
            def pm = pkgRe.matcher(txt); def pkg = pm.find() ? pm.group(1) : "(default)"
            def decls = []
            declRe.matcher(txt).each { mm -> decls << "${mm[1]} ${mm[2]}".toString() }
            if (!decls.isEmpty()) byPkg.computeIfAbsent(pkg, { [] }) << [file: f.name, decls: decls]
        }
        if (byPkg.isEmpty()) return
        sb.append(root.m).append("\n")
        byPkg.each { pkg, files ->
            sb.append("  ").append(pkg).append("\n")
            files.sort { it.file }.each { fi ->
                sb.append("    ").append(fi.file).append("\n")
                fi.decls.each { d -> sb.append("      ").append(d).append("\n") }
            }
        }
    }
    sb.length() == 0 ? "—" : sb.toString()
}()
def astTreeB64 = astTreeText.bytes.encodeBase64().toString()

// ── Build duration history (from gh CLI) ──────────────────────────────
// Run `gh run list` to pull the wall-clock duration of the last N
// successful GHA runs of this app's ship workflow. Used by the Stack
// section to surface "average build time" + "last build time" instead
// of just the UTC timestamp of THIS build (which the user reads here:
// reading is satisfying but doesn't tell you whether builds are
// getting slower or faster). Degrades cleanly if gh is missing or
// unauthenticated (e.g. offline / first-time clone) — fields fall back
// to -1, the UI renders "—".
def buildHistorySecs = []
try {
    def ghOut = providers.exec {
        commandLine 'gh', 'run', 'list',
            '--workflow=ship-cloud-superapp.yml',
            '--limit', '10',
            '--status', 'success',
            '--json', 'startedAt,updatedAt'
        ignoreExitValue = true
    }.standardOutput.asText.get().trim()
    if (ghOut.startsWith('[')) {
        new groovy.json.JsonSlurper().parseText(ghOut).each { r ->
            try {
                def s = java.time.Instant.parse(r.startedAt).epochSecond
                def e = java.time.Instant.parse(r.updatedAt).epochSecond
                if (e > s) buildHistorySecs << (e - s)
            } catch (Throwable t) { /* skip malformed */ }
        }
    }
} catch (Throwable t) {
    // gh CLI unavailable, not authenticated, or no network — leave empty
    // and the UI will render "—".
}
def buildAvgSecs    = buildHistorySecs.isEmpty() ? -1L : (buildHistorySecs.sum() / buildHistorySecs.size()).longValue()
def buildLastSecs   = buildHistorySecs.isEmpty() ? -1L : (buildHistorySecs[0] as long)
def buildSampleSize = buildHistorySecs.size()

