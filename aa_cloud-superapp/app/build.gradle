// ── Stack scan ────────────────────────────────────────────────────────
// Data-driven snapshot of "what's inside this APK" for Configs → About →
// Stack. Computed from the actual repository contents at config time —
// no hardcoded list to drift. Two derived JSON blobs are baked into
// BuildConfig:
//   • UI_STACK_LANGUAGES_JSON_B64 — {language: {files, loc}} by extension
//   • UI_STACK_FRAMEWORKS_JSON_B64 — sorted unique deps from every
//     *.gradle in the repo (deduped, project(':...') skipped)
def repoRoot = rootDir.parentFile  // ea_cloud-superapp/

// Friendly-name table: filename extension → language label. Anything not
// listed here is ignored (build outputs, generated sources, .lock, etc.).
def stackExtMap = [
    "kt"     : "Kotlin",
    "java"   : "Java",
    "go"     : "Go (libwg-go)",
    "c"      : "C (ndk-compat)",
    "h"      : "C headers",
    "xml"    : "XML (resources/manifest)",
    "json"   : "JSON (config)",
    "gradle" : "Gradle (Groovy)",
    "kts"    : "Gradle (Kotlin DSL)",
    "groovy" : "Groovy",
    "sh"     : "Shell",
    "md"     : "Markdown",
    "nix"    : "Nix",
    "yml"    : "YAML",
    "yaml"   : "YAML",
    "pro"    : "ProGuard",
]
// Roots we count: app source, every libs/* source, root build/config.
def stackRoots = [
    new File(rootDir, "app/src/main"),
    new File(repoRoot, "libs"),
    new File(repoRoot, "build.json"),
    rootDir,                         // app/build.gradle, app/proguard
]
// Directories we skip (no point counting generated / external code).
def stackSkipDirs = [
    "build", ".gradle", ".idea", "dist", ".result",
    "libs/net/src/main/cpp/libwg-go/generated-src",
]
def stackStats = [:]  // ext -> [files: N, loc: M]
stackRoots.each { root ->
    if (!root.exists()) return
    root.eachFileRecurse { f ->
        if (!f.isFile()) return
        def rel = f.absolutePath.replace(rootDir.absolutePath + "/", "")
        if (stackSkipDirs.any { rel.startsWith(it) || rel.contains("/${it}/") }) return
        def ext = f.name.tokenize(".").last().toLowerCase()
        def label = stackExtMap[ext]
        if (label == null) return
        def loc = 0
        try { loc = f.readLines("UTF-8").size() } catch (Throwable t) { return }
        def bucket = stackStats[label] ?: [files: 0, loc: 0]
        bucket.files += 1
        bucket.loc   += loc
        stackStats[label] = bucket
    }
}
def stackLanguagesJson = groovy.json.JsonOutput.toJson(stackStats)
def stackLanguagesB64  = stackLanguagesJson.bytes.encodeBase64().toString()

// Framework scan: walk every *.gradle in this app/ + libs/, harvest
// `implementation`/`api`/`compileOnly` lines whose argument is a Maven
// coordinate (group:artifact:version). Skip `project(':libs:...')`
// entries — those are internal modules already covered by the module list.
def stackDeps = new TreeSet()
def depPattern = ~/\b(implementation|api|compileOnly|runtimeOnly|annotationProcessor|kapt)\s*[\(\s]\s*['"]([^'":]+:[^'":]+:[^'"]+)['"]/
def gradleSearchRoots = [rootDir, new File(repoRoot, "libs"), new File(repoRoot, "ea_cloud-superapp")]
gradleSearchRoots.findAll { it.exists() }.each { root ->
    root.eachFileRecurse { f ->
        if (!f.isFile()) return
        if (!(f.name.endsWith(".gradle") || f.name.endsWith(".gradle.kts"))) return
        def text = ""
        try { text = f.text } catch (Throwable t) { return }
        depPattern.matcher(text).each { m -> stackDeps.add(m[2]) }
    }
}
def stackFrameworksJson = groovy.json.JsonOutput.toJson(stackDeps.toList())
def stackFrameworksB64  = stackFrameworksJson.bytes.encodeBase64().toString()

// ── Folder tree (L3, ea_* siblings) — DYNAMIC, scanned every build ────
// Re-scanned fresh from the filesystem on EVERY build (no committed
// snapshot): every `ea_*` directory sibling under the unix repo root is
// listed (L2), each with its immediate sub-directories (L3), rooted at
// `unix/` (L1). The tree therefore reflects exactly the ea_* clones
// present at build time. NOTE: the gitignored upstream clones
// (ea_cal-davx5, ea_mail-fairmail, …) appear only on machines where
// they're checked out (local builds); the GHA runner — which has just
// the tracked ea_cloud-* siblings — prints those. The `ea_*` filter
// requires an alphanumeric after the prefix so layout separator dirs
// (ea_____…) are skipped; nothing here is a hardcoded sibling list.
def stackTreeSkip = ["build", "dist", "node_modules", ".gradle", ".result"] as Set
def stackTreeSubdirs = { File dir, String selfName ->
    (dir.listFiles() ?: []).findAll {
        it.isDirectory() && !it.name.startsWith(".") &&
            !stackTreeSkip.contains(it.name) && it.name != selfName
    }.sort { it.name }
}
// Recursive directory walker, capped at `maxDepth` (the level NUMBER being
// printed). Rendered as a separate closure so the Folders view can emit
// three depth-bounded trees (L2 / L3 / L4) as 3 columns from ONE scan.
def stackTreeWalk
stackTreeWalk = { StringBuilder sb, File dir, String prefix, String selfName, int level, int maxDepth ->
    if (level > maxDepth) return
    def kids = stackTreeSubdirs(dir, selfName)
    kids.eachWithIndex { k, i ->
        boolean last = (i == kids.size() - 1)
        sb.append(prefix).append(last ? "└── " : "├── ").append(k.name).append("/\n")
        if (level < maxDepth)
            stackTreeWalk(sb, k, prefix + (last ? "    " : "│   "), null, level + 1, maxDepth)
    }
}
// unix/ (L1) → ea_* siblings (L2) → sub-dirs (L3) → grand-children (L4).
def folderTree = { int maxDepth ->
    def root = repoRoot
    if (root == null || !root.isDirectory()) return "—"
    // L2 = ea_* siblings. Alphanumeric-after-prefix filter drops layout
    // separator dirs (ea_____…) without a hardcoded sibling list.
    def eaDirs = (root.listFiles() ?: []).findAll {
        it.isDirectory() && (it.name ==~ /ea_[a-z0-9].*/)
    }.sort { it.name }
    if (eaDirs.isEmpty()) return "—"
    def sb = new StringBuilder(root.name + "/\n")   // L1
    eaDirs.eachWithIndex { ea, i ->
        boolean lastEa = (i == eaDirs.size() - 1)
        sb.append(lastEa ? "└── " : "├── ").append(ea.name).append("/\n")   // L2
        // L3 = the sibling's immediate sub-dirs (selfName guard skips the
        // doubly-nested self leftover); L4 = grand-children, recursed.
        if (maxDepth >= 3)
            stackTreeWalk(sb, ea, lastEa ? "    " : "│   ", ea.name, 3, maxDepth)
    }
    sb.toString()
}
def stackTreeL3B64 = folderTree(3).bytes.encodeBase64().toString()
def stackTreeL4B64 = folderTree(4).bytes.encodeBase64().toString()
def stackTreeB64   = folderTree(5).bytes.encodeBase64().toString()   // full (L5)

// ── ASM tree (app navigation sitemap) — static, hand-authored ─────────
// data/asm-tree.txt is the full page/section map shown behind the
// "ASM Tree Pages" button in Configs/About#Stack. Edit the txt to update.
def asmTreeFile = new File(rootDir, "data/asm-tree.txt")
