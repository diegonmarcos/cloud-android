plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// Inject build.json::release into BuildConfig — runtime code uses the same
// source of truth as build.sh oras-push / phone-install. No hardcoded URLs.
// rootDir, NOT '../../': this module is shared by reference (projectDir) into
// every constellation app, so it must read the CONSUMING app's build.json.
// A module-relative path would resolve to superapp's build.json and hand every
// app superapp's GHCR image + auto_update block — i.e. cloud-browser would
// update itself into cloud-superapp.
def buildJson = new groovy.json.JsonSlurper().parse(file("${rootDir}/build.json"))
def ghcr = buildJson.release.ghcr
def au   = buildJson.release.auto_update
// Short git sha = code-identity stamp (matches build.sh oras-push manifest
// revision annotation) so UpdateChecker can skip an identical-code rebuild.
def shortSha = (System.getenv('GITHUB_SHA')
                ?: providers.exec {
                       commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
                       ignoreExitValue = true
                   }.standardOutput.asText.get().trim())
                .take(8)
// ABI→update-tag map for the ABI-aware updater. Flattened from
// release.variants[]: each variant's supported_abis all point at its
// update_tag. The updater resolves the device's tag by the first
// Build.SUPPORTED_ABIS entry present in this map, falling back to
// AUTO_UPDATE_TAG (arm64 `latest`). Format: "abi=tag;abi=tag;…".
def auTagMap = (buildJson.release.variants ?: []).collectMany { v ->
    (v.supported_abis ?: []).collect { abi -> "${abi}=${v.update_tag}" }
}.join(';')

android {
    namespace 'com.diegonmarcos.superapp.updater'
    compileSdk 36

    // Two source sets, never both: shell/ talks to the real ShellChannels,
    // noshell/ hands Fleet a null channel. Source sets rather than reflection
    // because app/build.gradle runs R8 with minifyEnabled — a reflective
    // lookup would be renamed away and zero-dialog install would die silently
    // in the one app that wants it. Both variants are real compiled source, so
    // a rename in ShellChannels fails the SuperApp build out loud.
    sourceSets {
        main {
            java.srcDir(findProject(':libs:shizuku-adb-debug-tools') != null
                ? 'src/shell/java' : 'src/noshell/java')
        }
    }

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'

        buildConfigField "String",  "GHCR_REGISTRY",        "\"${ghcr.registry}\""
        buildConfigField "String",  "GHCR_NAMESPACE",       "\"${ghcr.namespace}\""
        buildConfigField "String",  "GHCR_IMAGE",           "\"${ghcr.image}\""
        buildConfigField "String",  "GHCR_MEDIA_TYPE",      "\"${ghcr.media_type}\""
        buildConfigField "String",  "AUTO_UPDATE_TAG",      "\"${au.tag}\""
        buildConfigField "String",  "AUTO_UPDATE_TAG_MAP",  "\"${auTagMap}\""
        buildConfigField "long",    "AUTO_UPDATE_INTERVAL_HOURS",  "${au.interval_hours}L"
        buildConfigField "boolean", "AUTO_UPDATE_ENABLED",         "${au.enabled}"
        // Most install sessions ONE unattended background pass may open. The
        // background pass cannot show the system install dialog (Android 10+
        // blocks background activity starts), so each install it starts leaves a
        // tap-to-install notification holding a PackageInstaller session until
        // the user answers it. Unbounded, a pass over a 40-entry fleet opens 40
        // at once and the installer hits Android's 50-session cap - "Too many
        // active sessions for UID". User-initiated "Update all" is NOT capped:
        // it runs in the foreground where the dialog appears and sessions
        // resolve immediately.
        buildConfigField "int", "AU_MAX_PER_PASS", "${au.max_installs_per_pass ?: 3}"
        buildConfigField "boolean", "AU_REQUIRE_UNMETERED",        "${au.require_unmetered_network}"
        buildConfigField "boolean", "AU_REQUIRE_CHARGING",         "${au.require_charging}"
        buildConfigField "String",  "AU_INSTALL_MODE",             "\"${au.install_mode}\""
        buildConfigField "String",  "GIT_SHORT_SHA",               "\"${shortSha}\""
    }

    buildFeatures { buildConfig = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:core')
    // Fleet.shellInstall uses the shell channel (uid 2000, holds INSTALL_PACKAGES)
    // so "Update all" installs with no confirm dialog. No cycle: this module only
    // depends on :libs:core, same as us.
    //
    // Conditional, because :libs:updater is linked into ALL EIGHT constellation
    // apps while :libs:shizuku-adb-debug-tools is declared by SuperApp alone.
    // Unconditionally, this line broke every other app at configuration time
    // ("Project with path ':libs:shizuku-adb-debug-tools' could not be found"),
    // and had they declared it they would each have swallowed BouncyCastle,
    // Conscrypt, libadb-android and the Shizuku client for a dialog-free
    // install only SuperApp performs. The matching source-set switch above
    // supplies a stub channel to the apps that opt out.
    if (findProject(':libs:shizuku-adb-debug-tools') != null) {
        implementation project(':libs:shizuku-adb-debug-tools')
    }
    implementation 'androidx.core:core-ktx:1.13.1'
    // UpdateOverlayFragment lives here now (it was four vendored copies in the
    // app modules and browser/vault/wallet were stale); the module owns the UI
    // for its own progress states, so it owns the fragment dependency too.
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
}
