plugins {
    id 'com.android.library'
}

// The Kotlin plugin is applied defensively, not in the plugins{} block above.
// This module is consumed by forks with wildly different build setups, and some
// already register a 'kotlin' extension on every subproject — applying it a
// second time fails the whole build with:
//   Cannot add extension with name 'kotlin', as there is an extension already
//   registered with that name.
// A plugins{} entry cannot be made conditional, so apply it only if absent.
if (!project.plugins.hasPlugin('org.jetbrains.kotlin.android')) {
    apply plugin: 'org.jetbrains.kotlin.android'
}

// Inject build.json::analytics into BuildConfig. rootDir, NOT '../../': this
// module is shared by reference (projectDir) into every constellation app, so
// it must read the CONSUMING app's build.json — a module-relative path would
// hand every app superapp's site ids and every event would be misattributed.
// Same reasoning as :libs:updater; see the long note in its build.gradle.
// Walk UP from rootDir to find it. Most apps keep build.json beside
// settings.gradle so rootDir hits on the first try, but a React Native app's
// gradle root is android/ while its build.json stays at the app root one level
// up. Hardcoding "${rootDir}/build.json" silently excluded every such app.
def buildJsonFile = { ->
    def d = rootDir
    for (int i = 0; i < 4 && d != null; i++) {
        def f = new File(d, "build.json")
        if (f.exists()) return f
        d = d.parentFile
    }
    throw new GradleException("libs:analytics: no build.json found at or above ${rootDir}")
}()
def buildJson = new groovy.json.JsonSlurper().parse(buildJsonFile)
def an = buildJson.analytics ?: [:]
def umami  = an.umami  ?: [:]
def matomo = an.matomo ?: [:]

android {
    namespace 'com.diegonmarcos.superapp.analytics'
    compileSdk 36

    defaultConfig {
        // 21, not 26: a library's minSdk is a FLOOR on every consumer, and the
        // manifest merger fails the whole app build when the app's minSdk is
        // lower ("uses-sdk:minSdkVersion 24 cannot be smaller than version 26
        // declared in library [:libs:analytics]"). chat is minSdk 24. Nothing
        // here needs 26 — the module only touches ContentProvider,
        // SharedPreferences, HttpURLConnection and java.util, all API <= 9.
        // Keep this at or below the lowest consumer minSdk in the repo.
        minSdk 21
        consumerProguardFiles 'consumer-rules.pro'

        // The app id is what makes events attributable. Umami and Matomo are
        // both single-site today, so every app reports into the same site and
        // is told apart by this name (it becomes the URL path and hostname).
        buildConfigField "String",  "AN_APP",           "\"${an.app ?: buildJson.project?.name ?: 'unknown'}\""
        buildConfigField "boolean", "AN_ENABLED",       "${an.enabled ?: false}"
        buildConfigField "String",  "AN_UMAMI_URL",     "\"${umami.endpoint ?: ''}\""
        buildConfigField "String",  "AN_UMAMI_SITE",    "\"${umami.site_id ?: ''}\""
        buildConfigField "String",  "AN_MATOMO_URL",    "\"${matomo.endpoint ?: ''}\""
        buildConfigField "String",  "AN_MATOMO_SITE",   "\"${matomo.site_id ?: ''}\""
    }

    buildFeatures { buildConfig = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // Deliberately NO :libs:core. This module is plain HttpURLConnection +
    // org.json, so keeping it dependency-free lets ANY app consume it —
    // including the upstream forks (mail, dialer, chat, matrix, media-center)
    // that have no shared-module graph at all.
}
