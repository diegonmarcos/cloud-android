//
// libs:net-wg — the WireGuard ENGINE: GoBackend plus the CMake-driven
// libwg-go.so built from src/main/cpp (cherry-picked from
// github.com/WireGuard/wireguard-android by `./build.sh sync-net`).
//
// This module is deliberately NOT linked by the apps. It is compiled into
// Cloud-Lib-Net-Wg.apk, which owns the VpnService and exposes the Backend
// contract over AIDL; an app links libs:net (the contract) only and binds
// across. That is where the ~8.5MB saving comes from: the native blob
// exists once on the device instead of inside every app that wants a
// tunnel.
//
// Package-private access note: GoBackend lives in the SAME Java package
// (com.wireguard.android.backend) as Statistics/Tunnel over in libs:net,
// which is what lets it keep calling the package-private Statistics.add.
// A split package across two modules is legal for javac/AGP; do not
// "tidy" GoBackend into another package or the engine stops compiling.

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.diegonmarcos.superapp.netwg'
    compileSdk 36
    ndkVersion '26.1.10909125'

    defaultConfig {
        minSdk 26
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        aidl true
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    buildTypes {
        all {
            externalNativeBuild {
                cmake {
                    targets 'libwg-go.so'
                    arguments "-DGRADLE_USER_HOME=${project.gradle.gradleUserHomeDir}"
                    arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                }
            }
        }
        release {
            externalNativeBuild {
                cmake {
                    // The tunnel's own package, i.e. this library's host APK.
                    arguments '-DANDROID_PACKAGE_NAME=com.diegonmarcos.cloudlib.netwg'
                }
            }
        }
        debug {
            externalNativeBuild {
                cmake {
                    arguments '-DANDROID_PACKAGE_NAME=com.diegonmarcos.cloudlib.netwg'
                }
            }
        }
    }

    lint {
        disable += 'LongLogTag'
        disable += 'NewApi'
    }
}

dependencies {
    api project(':libs:net')
    implementation project(':libs:core')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'androidx.collection:collection:1.4.4'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}
