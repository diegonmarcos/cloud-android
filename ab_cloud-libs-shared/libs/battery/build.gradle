// SPDX-License-Identifier: Apache-2.0
//
// libs:battery — battery/energy engine + its dialogs, extracted from the
// app module so it sits as a sibling of libs:firewall under libs/.
//
// Tiered energy model:
//   - Tier-1 (no root): BatteryManager / sysfs correlation — SysfsProc,
//     BatterySessionStats, BatteryCapacity, PowerFlow, EnergyWatchdog.
//   - Tier-2 (privileged): ShizukuEnergy reads `dumpsys batterystats`
//     through the Shizuku user-service (IUserService / ShizukuUserService)
//     that now lives in libs:shizuku-adb-debug-tools — hence the lib→lib
//     dependency below (NOT lib→app).
//
// UI dialogs (EnergyUsageDialog, BatteryEstimatePopup) live here too,
// mirroring how libs:firewall keeps FirewallDialog in-lib.

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.diegonmarcos.superapp.battery'
    compileSdk 36

    defaultConfig {
        minSdk 26
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':libs:core')
    // Tier-2 privileged read: ShizukuEnergy binds IUserService /
    // ShizukuUserService, both consolidated into this lib.
    implementation project(':libs:shizuku-adb-debug-tools')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'   // EnergyUsageDialog / BatteryEstimatePopup
    implementation 'androidx.work:work-runtime-ktx:2.9.1'   // BatterySessionWorker
    // rikka shizuku is implementation-scoped (non-transitive) in the
    // shizuku lib, so declare it directly for ShizukuEnergy.
    implementation 'dev.rikka.shizuku:api:13.1.5'
}
