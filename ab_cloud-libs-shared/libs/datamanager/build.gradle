// libs:datamanager — the "data-manager" for per-app usage + network
// metrics. Pure DATA providers (no UI): AppUsageProvider reads
// UsageStatsManager (recency / active-window / launch-count) and
// AppNetworkProvider reads NetworkStatsManager (per-app bytes). Both
// gated on the PACKAGE_USAGE_STATS special-access already granted for the
// Battery & Usage screen. Sibling to libs:battery (the "battery-manager",
// which owns per-app energy via EnergyWatchdog.perAppEstimate). Consumed
// by app/apps (Phone smart folders + Suite/Phone Active Apps section).

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.diegonmarcos.superapp.datamanager'
    compileSdk 36
    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:core')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
