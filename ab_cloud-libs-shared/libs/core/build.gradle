plugins {
    id 'com.android.library'
    // apply false + conditional apply below: AGP 9 consumers (mail,
    // media-center) register the 'kotlin' extension themselves and hard-error
    // on a second apply; AGP 8 consumers still need the explicit one. Same
    // pattern, same reason, same wording as libs/analytics/build.gradle.
    id 'org.jetbrains.kotlin.android' apply false
}

if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'org.jetbrains.kotlin.android'
}

android {

    buildFeatures {
        // IDataBackend: the shared contract for engine libraries that ship
        // as their own APK. Declared here because every app already links core.
        aidl true
    }

    namespace 'com.diegonmarcos.superapp.core'
    compileSdk 36

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// jvmTarget via the top-level `kotlin` extension, NOT android.kotlinOptions:
// AGP 9 removed kotlinOptions from the android extension and this module is
// consumed by both AGP 8 and AGP 9 apps. Same pattern as libs/analytics.
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}


dependencies {

    implementation 'androidx.core:core-ktx:1.13.1'

    // libs:devtools rides on core so the constellation-wide debug API reaches
    // every app without eight separate app/build.gradle edits that would drift
    // the moment someone adds a ninth app. `api`, not `implementation`, so the
    // consuming app can also call AppDebugServer directly (SuperApp's Configs
    // screen reports the bound port).
    //
    // Safe from cycles: devtools depends on androidx.core only, never on
    // libs:core. Keep it that way — a devtools→core edge would break every
    // app's build at once.
    api project(':libs:devtools')
}
