plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    // Kotlin 2.0+ Compose compiler is a standalone plugin (replaces the old
    // composeOptions.kotlinCompilerExtensionVersion). Version pinned in root
    // build.gradle to the Kotlin version (2.3.20).
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Consumer-wins-with-fallback, same as libs/chat and libs/voice. This module is
// shared BY REFERENCE into other repos (lib-apks ships it as its own APK), so it
// reads the CONSUMING app's build.json first — a module-relative path always
// resolves to this repo's and the consumer's config would be silently ignored.
// ui.socials is superapp/wallet-owned content a wrapper repo has no reason to
// redeclare, so an absent `ui` falls back to this module's home repo.
def buildJson = new groovy.json.JsonSlurper().parse(file("${rootDir}/build.json"))
if (buildJson.ui == null) buildJson = new groovy.json.JsonSlurper().parse(file('../../build.json'))
def uiSocialsB64 = groovy.json.JsonOutput
        .toJson(buildJson.ui.socials ?: [])
        .bytes.encodeBase64().toString()
// The `Me` pill's target. Empty default rather than a literal fallback: a
// wrong package name would silently open nothing, while an empty one makes
// the pill say the app is missing, which is the truth in that case.
def uiMeAppPackage = (buildJson.ui.me_app_package ?: '').toString()

android {
    namespace 'com.diegonmarcos.superapp.wallet'
    compileSdk 36
    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
        buildConfigField "String", "UI_SOCIALS_B64", "\"${uiSocialsB64}\""
        buildConfigField "String", "UI_ME_APP_PACKAGE", "\"${uiMeAppPackage}\""
    }
    buildFeatures {
        buildConfig = true
        // Wallet IS our Compose surface — the lib hosts every Compose
        // composable that used to live in app/. App still depends on
        // Compose for any future in-app Compose, but the wallet's UI
        // surface is fully self-contained here.
        compose = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:core')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'

    // ZXing core — pure-Java QR encoder. No camera scanning here, so
    // the core artifact is enough (matches app/build.gradle pin).
    implementation 'com.google.zxing:core:3.5.3'

    // Compose — BOM-pinned to keep every artifact on a compatible
    // release.
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.runtime:runtime'
    // activity-compose for rememberLauncherForActivityResult — used by
    // the wallet's Add-card bottom sheet to drive the .vcf / .pkpass
    // / .pass file picker.
    implementation 'androidx.activity:activity-compose:1.9.0'

    // JavaMail for Android — IMAP scanner (Mail Connector in Config tab).
    // android-mail bundles android-activation; no second artifact needed.
    implementation 'com.sun.mail:android-mail:1.6.7'
}
