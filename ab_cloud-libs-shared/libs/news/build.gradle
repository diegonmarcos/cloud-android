plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// NewsEngine ships inside Cloud-Lib-News.apk and cannot see the app's
// BuildConfig, so the three config files are baked into THIS module. Paths are
// ${rootDir}/data/*, the CONSUMING app's data dir. These used to be
// '../../data/*', relative to this module's own directory, and the comment
// here claimed that kept them at ac_cloud-news/data/ "whether the module is
// built by the app or shared by reference" — true only while the module sat
// under ac_cloud-news/libs/. After the consolidation it resolved to
// ab_cloud-libs-shared/data/, which does not exist, and b64Of's `f.exists()`
// turned that into '{}' with no error: cloud-news would have shipped with no
// topics, no sources, no media and no events. Warn rather than bake silence.
def b64Of = { String rel ->
    def f = file("${rootDir}/data/${rel}")
    if (!f.exists()) logger.warn("libs:news: no ${f} — baking an EMPTY ${rel}")
    (f.exists() ? f.text : '{}').bytes.encodeBase64().toString()
}
def topicsB64  = b64Of('topics.json')
def sourcesB64 = b64Of('sources.json')
def mediaB64   = b64Of('media.json')
def eventsB64  = b64Of('events.json')

android {
    namespace 'com.diegonmarcos.superapp.news'
    compileSdk 36

    defaultConfig {
        buildConfigField "String", "TOPICS_B64",  "\"${topicsB64}\""
        buildConfigField "String", "SOURCES_B64", "\"${sourcesB64}\""
        buildConfigField "String", "MEDIA_B64",   "\"${mediaB64}\""
        buildConfigField "String", "EVENTS_B64",  "\"${eventsB64}\""
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // api: NewsBackendService extends core's DataBackendService.
    api project(':libs:core')

    implementation 'androidx.core:core-ktx:1.13.1'
}
