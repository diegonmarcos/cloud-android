// SPDX-License-Identifier: Apache-2.0
//
// libs:net — WireGuard CONTRACT. Config/crypto parsing, the Backend and
// Tunnel interfaces, Statistics, and the AIDL client that talks to the
// engine in another APK.
//
// The engine (GoBackend + the 8.5MB libwg-go.so built from src/main/cpp)
// moved to libs:net-wg, which ships as Cloud-Lib-Net-Wg.apk. That single
// split is what takes ~8.5MB off every app that only needs to drive a
// tunnel rather than implement one - the same shape as
// libs:voice / libs:voice-vosk and libs:translate / libs:translate-mlkit.
//
// So: NO CMake, NO NDK, no native output. Pure Java/Kotlin. If a native
// dependency ever appears here again the split has been undone.

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.diegonmarcos.superapp.net'
    compileSdk 36

    defaultConfig {
        minSdk 26
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        // The Backend contract crosses a process boundary now.
        aidl true
    }

    lint {
        disable += 'LongLogTag'
        disable += 'NewApi'
    }
}

dependencies {
    implementation project(':libs:core')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'androidx.collection:collection:1.4.4'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}
