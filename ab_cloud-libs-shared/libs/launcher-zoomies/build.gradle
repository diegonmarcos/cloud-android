plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// ── Zoomies pets ────────────────────────────────────────────────────
// The animated status-bar companion (PetStrengthView) + its vendored GIF
// assets (assets/zoomies/<animal>/<variant>_<gait>.gif, CC BY-ND). Pure
// view module: no build.json config, no inter-lib deps — just appcompat
// for AppCompatImageView.
android {
    namespace 'com.diegonmarcos.superapp.zoomies'
    compileSdk 36
    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
