plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // libs:wallet and libs:health are pure-Compose surfaces and this module
    // hosts them inside a ComposeView, so the app needs the Compose compiler
    // even though its own shell is Views.
    id 'org.jetbrains.kotlin.plugin.compose'
}

def buildJson = new groovy.json.JsonSlurper().parse(file('../build.json'))
def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()
def codeFinal = (buildJson.android.version_code as Number).intValue() + runNumber
def shortSha  = (System.getenv('GITHUB_SHA')
                 ?: providers.exec {
                        commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
                        ignoreExitValue = true
                    }.standardOutput.asText.get().trim())
                .take(8)
def buildTimestamp = new java.text.SimpleDateFormat("yyyy-MM-dd HH:mm:ss 'UTC'").with {
    setTimeZone(java.util.TimeZone.getTimeZone('UTC')); format(new java.util.Date())
}

// Every navigation surface in the app is baked from build.json::ui here and
// decoded once at process start by Sections.kt. There is no hardcoded menu,
// tab strip or tile list anywhere in the Kotlin — adding a page is a JSON edit.
def b64 = { obj -> groovy.json.JsonOutput.toJson(obj).bytes.encodeBase64().toString() }

// build.json::ui.sections carries the navigation SHAPE; each page's content is
// its own file at data/ui/<section>/<page>.json and is folded back in here as
// `stack_<page id>`, exactly where Sections.kt already looks for it. A declared
// page with no file is a build failure rather than a blank tab on the phone —
// the whole point of splitting the stacks out was to make a missing page
// visible, and a fail-soft loader would hide it again.
def uiPagesDir = file('../data/ui')
def uiSections = (buildJson.ui.sections ?: []).collect { s ->
    def out = new LinkedHashMap(s)
    // A page with `pages` of its own is a container — it holds no content,
    // its children do, one folder deeper. Sub-page ids stay unique inside the
    // section, so the flat `stack_<id>` map Sections.kt already reads is
    // enough and nothing needed a second lookup path.
    def load = { p, dir ->
        def f = new File(uiPagesDir, "${dir}/${p.id}.json")
        if (!f.exists()) throw new GradleException("ui.sections[${s.id}] page '${p.id}' has no data/ui/${dir}/${p.id}.json")
        out["stack_${p.id}"] = new groovy.json.JsonSlurper().parse(f)
    }
    (s.pages ?: []).each { p ->
        if (p.pages) p.pages.each { sub -> load(sub, "${s.id}/${p.id}") }
        else load(p, s.id)
    }
    out
}
def uiSectionsB64     = b64(uiSections)
def uiExternalAppsB64 = b64(buildJson.ui.external_apps ?: [])
def uiPermsRuntimeB64 = b64(buildJson.ui.permissions?.runtime ?: [])
def profile           = buildJson.ui.profile_default ?: [:]

android {
    namespace 'com.diegonmarcos.cloudme'
    compileSdk 36

    defaultConfig {
        applicationId 'com.diegonmarcos.cloudme'
        minSdk 26
        targetSdk 35
        versionCode codeFinal
        versionName "${buildJson.android.version_name} (sha-${shortSha})"
        ndk {
            def abiOverride = System.getenv('CLOUDME_ABIS')
            def abis = (abiOverride?.trim())
                ? abiOverride.split(',').collect { it.trim() }.findAll { it }
                : (buildJson.android.abi_filters ?: ['arm64-v8a'])
            abiFilters.addAll(abis as List)
        }
        buildConfigField "String", "GIT_SHORT_SHA",   "\"${shortSha}\""
        buildConfigField "String", "BUILD_TIMESTAMP", "\"${buildTimestamp}\""
        buildConfigField "String", "UI_SECTIONS_B64",      "\"${uiSectionsB64}\""
        buildConfigField "String", "UI_EXTERNAL_APPS_B64", "\"${uiExternalAppsB64}\""
        buildConfigField "String", "UI_PERMISSIONS_RUNTIME_B64", "\"${uiPermsRuntimeB64}\""
        buildConfigField "String", "UI_PROFILE_NAME",  "\"${profile.name ?: ''}\""
        buildConfigField "String", "UI_PROFILE_EMAIL", "\"${profile.email ?: ''}\""
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures { buildConfig = true; compose = true }

    // data/files is shipped verbatim as assets: Buro > Wallet browses the real
    // wallet records as folders, and AssetManager.list() already enumerates a
    // directory, so the tree needs no manifest to walk it.
    sourceSets { main { assets.srcDirs += file('../data/files') } }

    // ONE shared Cloud-constellation key — same key as SuperApp/Wallet/Vault.
    signingConfigs {
        debug {
            def envStore = System.getenv("ANDROID_KEYSTORE_FILE")
            if (envStore == null || envStore.isEmpty() || !file(envStore).exists()) {
                throw new GradleException("ONE shared constellation key required; run via build.sh / set ANDROID_KEYSTORE_FILE; no fallback")
            }
            storeFile     file(envStore)
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias      System.getenv("ANDROID_KEY_ALIAS")
            keyPassword   System.getenv("ANDROID_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug   { debuggable true; signingConfig signingConfigs.debug }
        release { debuggable true; minifyEnabled false
                  proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  signingConfig signingConfigs.debug }
    }

    packaging {
        resources {
            excludes += ['META-INF/NOTICE.md', 'META-INF/LICENSE.md',
                         'META-INF/NOTICE',    'META-INF/LICENSE']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // Shared BY REFERENCE from ab_cloud-libs-shared/libs — Cloud Me owns no
    // library source, it is an assembly of the constellation's modules.
    implementation project(':libs:core')
    implementation project(':libs:updater')
    implementation project(':libs:analytics')
    implementation project(':libs:wallet')   // Me tab (social cards)
    implementation project(':libs:health')   // Health section (Health Connect)
    implementation project(':libs:fin')      // Buro → Accounting
    implementation project(':libs:cal')      // Agenda → events + todos

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'

    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'

    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
