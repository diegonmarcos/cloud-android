plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // libs:health is a pure-Compose surface and this module hosts it inside a
    // ComposeView, so the app needs the Compose compiler even though its own
    // shell is Views.
    id 'org.jetbrains.kotlin.plugin.compose'
}

def buildJson = new groovy.json.JsonSlurper().parse(file('../build.json'))
// Version code: minutes since 2026-01-01 UTC over a 3,000,000 base.
//
// This used to be build.json's version_code plus GITHUB_RUN_NUMBER, which is
// per-WORKFLOW. Every app here ships from its own ship-*.yml with its own
// independent counter, so the moment an app was built by a different workflow
// than the one that produced the installed APK -- or a workflow was re-created,
// or a dispatch cancelled a push-triggered run via the concurrency group -- the
// number handed out was SMALLER than the last published one and Android refused
// the update with "Update version code 190 is older than current 192". A build
// counter can only be monotonic for the one counter that issued it.
//
// Wall clock only ever moves forward and is identical for every workflow, every
// runner and every trigger, so this cannot go backwards again. Same encoding as
// ac_cloud-mail and ab_cloud-libs-shared/lib-apks, so the whole fleet is
// comparable: ~3.35M in Sep 2026, far above any version code in the field and
// inside the 2^31 limit for centuries. COMMS_BUILD_TIMESTAMP is honoured when
// CI provides one so the code matches the release tag; otherwise build time.
def codeFinal = { ->
    def base  = java.time.LocalDateTime.of(2026, 1, 1, 0, 0)
    def built = java.time.LocalDateTime.now(java.time.ZoneOffset.UTC)
    def stamp = System.getenv('COMMS_BUILD_TIMESTAMP')
    if (stamp) {
        try {
            built = java.time.LocalDateTime.parse(stamp,
                java.time.format.DateTimeFormatter.ofPattern('yyyyMMdd.HHmmss'))
        } catch (ignored) { }
    }
    long mins = java.time.Duration.between(base, built).toMinutes()
    return mins > 0 ? (int) (3000000L + mins) : 3000000
}()
def shortSha  = (System.getenv('GITHUB_SHA')
                 ?: providers.exec {
                        commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
                        ignoreExitValue = true
                    }.standardOutput.asText.get().trim())
                .take(8)
def buildTimestamp = new java.text.SimpleDateFormat("yyyy-MM-dd HH:mm:ss 'UTC'").with {
    setTimeZone(java.util.TimeZone.getTimeZone('UTC')); format(new java.util.Date())
}

// Every navigation surface in the app is baked from build.json::ui here and
// decoded once at process start by Sections.kt. There is no hardcoded menu,
// tab strip or tile list anywhere in the Kotlin — adding a page is a JSON edit.
def b64 = { obj -> groovy.json.JsonOutput.toJson(obj).bytes.encodeBase64().toString() }

// build.json::ui.sections carries the navigation SHAPE only — ids, labels,
// icons, placement. Page CONTENT is NOT baked in: the stacks ship as assets
// (see sourceSets below) and Sections.kt reads one when its page opens.
//
// They used to be folded in here, and that hit javac's 64KB limit on a String
// constant the moment Profile gained a real profile's worth of text. A
// BuildConfig field is the wrong home for content that grows with the data:
// the shape is bounded, the content is not.
//
// A declared page with no file is still a build failure rather than a blank
// tab on the phone — the check moves here, the loader does not become
// fail-soft.
def uiPagesDir = file('../data/ui')
(buildJson.ui.sections ?: []).each { s ->
    def check = { p, dir ->
        if (!new File(uiPagesDir, "${dir}/${p.id}.json").exists()) {
            throw new GradleException("ui.sections[${s.id}] page '${p.id}' has no data/ui/${dir}/${p.id}.json")
        }
    }
    (s.pages ?: []).each { p ->
        if (p.pages) p.pages.each { sub -> check(sub, "${s.id}/${p.id}") }
        else check(p, s.id)
    }
}
def uiSectionsB64     = b64(buildJson.ui.sections ?: [])
def uiExternalAppsB64 = b64(buildJson.ui.external_apps ?: [])
def uiPermsRuntimeB64 = b64(buildJson.ui.permissions?.runtime ?: [])
def profile           = buildJson.ui.profile_default ?: [:]

android {
    namespace 'com.diegonmarcos.cloudme'
    compileSdk 36

    defaultConfig {
        applicationId 'com.diegonmarcos.cloudme'
        minSdk 26
        targetSdk 35
        versionCode codeFinal
        versionName "${buildJson.android.version_name} (sha-${shortSha})"
        ndk {
            def abiOverride = System.getenv('CLOUDME_ABIS')
            def abis = (abiOverride?.trim())
                ? abiOverride.split(',').collect { it.trim() }.findAll { it }
                : (buildJson.android.abi_filters ?: ['arm64-v8a'])
            abiFilters.addAll(abis as List)
        }
        buildConfigField "String", "GIT_SHORT_SHA",   "\"${shortSha}\""
        buildConfigField "String", "BUILD_TIMESTAMP", "\"${buildTimestamp}\""
        buildConfigField "String", "UI_SECTIONS_B64",      "\"${uiSectionsB64}\""
        buildConfigField "String", "UI_EXTERNAL_APPS_B64", "\"${uiExternalAppsB64}\""
        buildConfigField "String", "UI_PERMISSIONS_RUNTIME_B64", "\"${uiPermsRuntimeB64}\""
        buildConfigField "String", "UI_PROFILE_NAME",  "\"${profile.name ?: ''}\""
        buildConfigField "String", "UI_PROFILE_EMAIL", "\"${profile.email ?: ''}\""
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures { buildConfig = true; compose = true }

    // Both data trees ship verbatim as assets. data/files so Buro > Wallet can
    // browse the real wallet records as folders — AssetManager.list()
    // enumerates a directory, so the tree needs no manifest. data/ui so a page
    // is read when it opens instead of being carried in a String constant.
    //
    // They merge into one asset root, so a section id must not collide with a
    // top-level folder under data/files. test-ui-pages.sh fails if one ever
    // does; today the only candidate is `wallet`, and the Wallet bar section
    // has no pages and therefore no data/ui/wallet/ folder.
    sourceSets {
        main {
            assets.srcDirs += file('../data/files')
            assets.srcDirs += file('../data/ui')
            // The real mySocials pages, so Profile renders the actual LinkedIn
            // and Instagram layouts instead of an approximation of them.
            assets.srcDirs += file('../data/web')
        }
    }

    // ONE shared Cloud-constellation key — same key as SuperApp/Wallet/Vault.
    signingConfigs {
        debug {
            def envStore = System.getenv("ANDROID_KEYSTORE_FILE")
            if (envStore == null || envStore.isEmpty() || !file(envStore).exists()) {
                throw new GradleException("ONE shared constellation key required; run via build.sh / set ANDROID_KEYSTORE_FILE; no fallback")
            }
            storeFile     file(envStore)
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias      System.getenv("ANDROID_KEY_ALIAS")
            keyPassword   System.getenv("ANDROID_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug   { debuggable true; signingConfig signingConfigs.debug }
        release { debuggable true; minifyEnabled false
                  proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  signingConfig signingConfigs.debug }
    }

    packaging {
        resources {
            excludes += ['META-INF/NOTICE.md', 'META-INF/LICENSE.md',
                         'META-INF/NOTICE',    'META-INF/LICENSE']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // Shared BY REFERENCE from ab_cloud-libs-shared/libs — Cloud Me owns no
    // library source, it is an assembly of the constellation's modules.
    implementation project(':libs:core')
    implementation project(':libs:updater')
    implementation project(':libs:analytics')
    implementation project(':libs:health')   // Health section (Health Connect)
    implementation project(':libs:fin')      // Buro → Accounting
    implementation project(':libs:cal')      // Agenda → events + todos

    // Photo grid on Profile > Personal. Same version libs:media already pins.
    implementation 'io.coil-kt:coil:2.7.0'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'

    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'

    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
