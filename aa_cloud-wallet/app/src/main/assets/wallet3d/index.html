  <!-- No data-type="module" — Babel inlines the transpiled code directly, UMD globals resolve identifiers -->
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;
    const { createRoot } = ReactDOM;
    // THREE is window.THREE from UMD build

    // ── 1. DATA ──────────────────────────────────────────────────────────────
    const MOCK_DATA = {
      spainDNI: {
        id: "12345678Z", can: "123456",

        address: "C/ GRAN VÍA 1, 1A\n28013 MADRID",
        mrz: ["IDESP12345678Z5<<<<<<<<<<<<<<<", "9001014M2503155ESP<<<<<<<<<<<4", "MARCOS<NEPOMUCENO<COELHO<<DIEGO"]
      },
      brazilRG: {
        rg: "12.345.678-9", expedition: "01/FEV/2020",
        name: "DIEGO MARCOS NEPOMUCENO COELHO",
        parents: "PAULO MARCOS\nVERA NEPOMUCENO", birthPlace: "BELO HORIZONTE - MG",
        dob: "01/JAN/1990", originDoc: "CERT. NASC. LIV 1 FL 23 BH-MG", cpf: "123.456.789-00"
      },
      spainPass: {
        type: "P", code: "ESP", passNo: "XYZ123456",
        surname: "MARCOS NEPOMUCENO COELHO", name: "DIEGO",
        nationality: "ESPAÑOLA", dob: "01 ENE 1990", sex: "M", birthPlace: "BELO HORIZONTE",
        issue: "20 OCT 2021", expiry: "20 OCT 2031",
        mrz: ["P<ESPMARCOS<NEPOMUCENO<COELHO<<DIEGO<<<<<<<", "XYZ1234567ESP9001014M3110201<<<<<<<<<<<<<<00"]
      },
      brazilPass: {
        type: "P", code: "BRA", passNo: "FX000001",
        surname: "MARCOS NEPOMUCENO COELHO", name: "DIEGO",
        nationality: "BRASILEIRO(A)", dob: "01 JAN 1990", sex: "M", birthPlace: "BELO HORIZONTE - MG",
        issue: "15 MAR 2023", expiry: "15 MAR 2033",
        mrz: ["P<BRAMARCOS<NEPOMUCENO<COELHO<<DIEGO<<<<<<<", "FX0000017BRA9001014M3303154<<<<<<<<<<<<<<00"]

        { type:'rect',   color:'#b91c1c', text:'JFK INTL\nADMITTED\nAUG 14 2023', x:1200, y:400,  rot:0.1   },
        { type:'circle', color:'#047857', text:'PARIS CDG\n↑ 04-08-22',            x:600,  y:1200, rot:0.3   },
        { type:'rect',   color:'#4338ca', text:'HEATHROW\nARRIVED\n22 OCT 2023',   x:1000, y:1500, rot:-0.15 },
        { type:'circle', color:'#b91c1c', text:'NARITA\nDEPARTED\n11 MAR 2023',    x:1600, y:1300, rot:0.05  }
      ]
    };

    // ── 2. TEX_SCALE ─────────────────────────────────────────────────────────
    const TEX_SCALE = 0.5;

    // ── 3. STUDIO HDRI ───────────────────────────────────────────────────────
    let _cachedEnv = null;
    const getStudioEnvironment = () => {
      if (_cachedEnv) return _cachedEnv;
      const c = document.createElement('canvas'); c.width = 512; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#050505'; ctx.fillRect(0,0,512,256);
      ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 30; ctx.fillStyle = '#ffffff';
      ctx.fillRect(50,75,75,100); ctx.fillRect(400,50,25,150); ctx.fillRect(200,25,112,40);
      _cachedEnv = new THREE.CanvasTexture(c);
      _cachedEnv.mapping = THREE.EquirectangularReflectionMapping;
      return _cachedEnv;
    };

    // ── 4. VORONOI LEATHER NOISE ─────────────────────────────────────────────
    let _cachedVoronoi = null;
    const getVoronoiCanvas = () => {
      if (_cachedVoronoi) return _cachedVoronoi;
      const w=256, h=362;
      const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
      const ctx = canvas.getContext('2d'); const img = ctx.createImageData(w,h); const d = img.data;
      const s=6, GX=Math.ceil(w/s)+1, GY=Math.ceil(h/s)+1;
      const px = new Float32Array(GX*GY), py = new Float32Array(GX*GY);
      for(let i=0;i<GX;i++) for(let j=0;j<GY;j++){const k=i*GY+j; px[k]=(i+Math.random())*s; py[k]=(j+Math.random())*s;}
      for(let y=0;y<h;y++) for(let x=0;x<w;x++){
        let md=999999; const gx=Math.floor(x/s), gy=Math.floor(y/s);
        for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
          const nx=gx+dx, ny=gy+dy;
          if(nx>=0&&nx<GX&&ny>=0&&ny<GY){const ax=px[nx*GY+ny]-x, ay=py[nx*GY+ny]-y; const dist=ax*ax+ay*ay; if(dist<md) md=dist;}
        }
        const v=255-(Math.sqrt(md)*35)+(Math.random()*20-10);
        const i4=(y*w+x)*4; d[i4]=d[i4+1]=d[i4+2]=Math.max(0,Math.min(255,v)); d[i4+3]=255;
      }
      ctx.putImageData(img,0,0); _cachedVoronoi=canvas; return canvas;
    };
    const generateVoronoiNoise = () => new THREE.CanvasTexture(getVoronoiCanvas());

    // ── 5. PAGE EDGES ────────────────────────────────────────────────────────
    const generatePageEdges = (country) => {
      const c=document.createElement('canvas'); c.width=128; c.height=512;
      const ctx=c.getContext('2d');
      ctx.fillStyle=country==='ES'?'#eab308':'#f8f9fa'; ctx.fillRect(0,0,128,512);
      for(let y=0;y<512;y+=3){ctx.globalAlpha=Math.random()*0.4+0.1; ctx.fillStyle=country==='ES'?'#ca8a04':'#e2e8f0'; ctx.fillRect(0,y,128,Math.random()*2+1);}
      ctx.globalAlpha=1;
      const t=new THREE.CanvasTexture(c); t.wrapS=THREE.RepeatWrapping; t.wrapT=THREE.RepeatWrapping; t.colorSpace=THREE.SRGBColorSpace;
      return t;
    };

    // ── 6. HOLOGRAM OVERLAY ──────────────────────────────────────────────────
    const createHologramMesh = (type, view) => {
      const canvas=document.createElement('canvas');
      const w=1024, h=type==='DNI'?640:1448;
      canvas.width=w*TEX_SCALE; canvas.height=h*TEX_SCALE;
      const ctx=canvas.getContext('2d'); ctx.scale(TEX_SCALE,TEX_SCALE);
      const grad=ctx.createLinearGradient(0,0,w,h);
      grad.addColorStop(0,'rgba(255,0,0,1)'); grad.addColorStop(0.3,'rgba(255,255,0,1)');
      grad.addColorStop(0.6,'rgba(0,255,255,1)'); grad.addColorStop(1,'rgba(255,0,255,1)');
      ctx.fillStyle=grad; ctx.strokeStyle=grad;
      if(type==='DNI'&&view==='front'){
        ctx.lineWidth=6;
        ctx.beginPath(); ctx.arc(540,320,120,0,Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.arc(540,320,100,0,Math.PI*2); ctx.stroke();
        ctx.font='bold 80px sans-serif'; ctx.globalAlpha=0.5;
        for(let y=150;y<h;y+=160) ctx.fillText('ESPAÑA ESPAÑA',300,y);
      } else if(type.includes('Pass')&&view==='info'){
        ctx.lineWidth=6;
        for(let i=0;i<4;i++){ctx.beginPath(); ctx.arc(200+Math.random()*600,400+Math.random()*800,120,0,Math.PI*2); ctx.stroke();}
        ctx.font='bold 60px sans-serif'; ctx.globalAlpha=0.5;
        for(let y=200;y<h;y+=200) ctx.fillText('SECURE DOCUMENT VALID',100,y);
      }
      const tex=new THREE.CanvasTexture(canvas);
      const mat=new THREE.MeshBasicMaterial({map:tex,transparent:true,blending:THREE.AdditiveBlending,opacity:0.0,depthWrite:false});
      const geo=type==='DNI'?new THREE.PlaneGeometry(3.4,2.15):new THREE.PlaneGeometry(2.4,3.4);
      const mesh=new THREE.Mesh(geo,mat);
      mesh.position.z=type==='DNI'?0.016:0.021;
      if(type.includes('Pass')) mesh.position.x=1.2;
      return mesh;
    };

    // ── 7. TEXTURE HELPERS ───────────────────────────────────────────────────
    const makeCanvas = (W,H) => {
      const c=document.createElement('canvas'); c.width=W*TEX_SCALE; c.height=H*TEX_SCALE;
      const ctx=c.getContext('2d'); ctx.scale(TEX_SCALE,TEX_SCALE);
      return {c,ctx};
    };
    const toTex = (canvas,isColor) => {
      const t=new THREE.CanvasTexture(canvas); if(isColor) t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
    };
    const guilloche = (ctx,W,H,color,f1,f2,alpha) => {
      ctx.strokeStyle=color; ctx.globalAlpha=alpha; ctx.lineWidth=3;
      for(let y=0;y<H;y+=40){ctx.beginPath(); for(let x=0;x<=W;x+=10) ctx.lineTo(x,y+Math.sin(x*f1)*40+Math.cos(x*f2+y)*20); ctx.stroke();}
      ctx.globalAlpha=1;
    };

    // ── 8. PASS COVER ────────────────────────────────────────────────────────
    const generatePassCover = (country) => {
      const W=1024, H=1448;
      const {c:cC,ctx}=makeCanvas(W,H); const {c:rC,ctx:rctx}=makeCanvas(W,H);
      const v=getVoronoiCanvas();
      ctx.fillStyle=country==='ES'?'#330812':'#030c1f'; ctx.fillRect(0,0,W,H);
      ctx.globalCompositeOperation='overlay'; ctx.globalAlpha=0.6; ctx.drawImage(v,0,0,W,H);
      ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
      rctx.fillStyle='#b3b3b3'; rctx.fillRect(0,0,W,H);
      rctx.globalCompositeOperation='multiply'; rctx.globalAlpha=0.5; rctx.drawImage(v,0,0,W,H);
      rctx.globalCompositeOperation='source-over'; rctx.globalAlpha=1;
      ctx.fillStyle='#eab308'; ctx.strokeStyle='#eab308'; ctx.textAlign='center'; ctx.lineWidth=6;
      if(country==='ES'){
        ctx.font='50px serif'; ctx.fillText('UNIÓN EUROPEA',W/2,200);
        ctx.font='bold 85px serif'; ctx.fillText('ESPAÑA',W/2,350);
        ctx.beginPath(); ctx.arc(W/2,700,180,0,Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.arc(W/2,700,160,0,Math.PI*2); ctx.stroke();
        ctx.font='75px serif'; ctx.fillText('PASAPORTE',W/2,1150);
      } else {
        ctx.font='50px serif'; ctx.fillText('MERCOSUL',W/2,200);
        ctx.font='bold 75px serif'; ctx.fillText('REPÚBLICA FEDERATIVA',W/2,350); ctx.fillText('DO BRASIL',W/2,450);
        ctx.beginPath(); ctx.arc(W/2,800,200,0,Math.PI*2); ctx.stroke();
        ctx.font='75px serif'; ctx.fillText('PASSAPORTE',W/2,1250);
      }
      return {map:toTex(cC,true), rough:toTex(rC,false)};
    };

    // ── 9. PASS SPREAD ───────────────────────────────────────────────────────
    const generatePassSpread = (country, view) => {
      const W=2896, H=2048;
      const {c,ctx}=makeCanvas(W,H);
      const data=country==='ES'?MOCK_DATA.spainPass:MOCK_DATA.brazilPass;
      const g=ctx.createLinearGradient(0,0,W,H);
      if(country==='ES'){g.addColorStop(0,'#fdfbf7'); g.addColorStop(0.5,'#fce7f3'); g.addColorStop(1,'#dbeafe');}
      else{g.addColorStop(0,'#f0fdf4'); g.addColorStop(0.5,'#e0f2fe'); g.addColorStop(1,'#f8fafc');}
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      guilloche(ctx,W,H,country==='ES'?'#fbcfe8':'#bbf7d0',0.01,0.02,0.5);
      const sh=ctx.createLinearGradient(W/2-60,0,W/2+60,0);
      sh.addColorStop(0,'transparent'); sh.addColorStop(0.5,'rgba(0,0,0,0.4)'); sh.addColorStop(1,'transparent');
      ctx.fillStyle=sh; ctx.fillRect(W/2-60,0,120,H);
      if(view==='info'){
        const rx=W/2+50;
        ctx.fillStyle='#e5e7eb'; ctx.fillRect(rx+50,250,350,450);
        ctx.strokeStyle='#9ca3af'; ctx.lineWidth=4; ctx.strokeRect(rx+50,250,350,450);
        ctx.fillStyle='#9ca3af'; ctx.beginPath(); ctx.arc(rx+225,440,88,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(rx+225,700,157,Math.PI,0); ctx.fill();
        ctx.fillStyle=country==='ES'?'#9f1239':'#1e3a8a'; ctx.font='bold 40px sans-serif';
        ctx.fillText(country==='ES'?'ESPAÑA':'REPÚBLICA FEDERATIVA DO BRASIL',rx+50,100);
        ctx.fillStyle='#4b5563'; ctx.font='25px sans-serif'; ctx.fillText('PASAPORTE / PASSPORT',rx+50,145);
        [['Tipo',data.type,rx+450,280],['Código',data.code,rx+650,280],['Pasaporte No.',data.passNo,rx+900,280,'#dc2626'],
         ['Apellidos',data.surname,rx+450,400],['Nombre',data.name,rx+450,520],
         ['Nacionalidad',data.nationality,rx+450,640],['Fecha nac.',data.dob,rx+900,640],
         ['Sexo',data.sex,rx+450,760],['Lugar nac.',data.birthPlace,rx+650,760],
         ['Expedición',data.issue,rx+450,880],['Caducidad',data.expiry,rx+900,880]
        ].forEach(([l,v,fx,fy,fc])=>{
          ctx.fillStyle='#6b7280'; ctx.font='22px sans-serif'; ctx.fillText(l,fx,fy);
          ctx.fillStyle=fc||'#111827'; ctx.font='bold 35px sans-serif'; ctx.fillText(v,fx,fy+40);
        });
        ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.fillRect(rx,H-300,W/2,300);
        ctx.fillStyle='#111827'; ctx.font='bold 50px monospace';
        data.mrz.forEach((line,i)=>ctx.fillText(line,rx+40,H-180+i*80));
        ctx.strokeStyle='#9ca3af'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(200,H-150); ctx.lineTo(1000,H-150); ctx.stroke();
        ctx.fillStyle='#4b5563'; ctx.font='25px serif'; ctx.fillText('Firma del titular',200,H-120);
      } else if(view==='stamps'){
        MOCK_DATA.stamps.forEach(s=>{
          ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(s.rot);
          ctx.strokeStyle=s.color; ctx.fillStyle=s.color;
          ctx.globalCompositeOperation='multiply'; ctx.globalAlpha=0.85;
          if(s.type==='circle'){ctx.lineWidth=6; ctx.beginPath(); ctx.arc(0,0,150,0,Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.arc(0,0,140,0,Math.PI*2); ctx.stroke();}
          else{ctx.lineWidth=6; ctx.strokeRect(-200,-100,400,200);}
          ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='bold 35px sans-serif';
          s.text.split('\n').forEach((l,i,a)=>ctx.fillText(l,0,(i-a.length/2)*45+20));
          ctx.restore();
        });
      }
      return {map:toTex(c,true)};
    };

    // ── 10. DNI TEXTURES ─────────────────────────────────────────────────────
    const generateDniTextures = (view) => {
      const W=2048, H=1280; const data=MOCK_DATA.spainDNI;
      const {c:cC,ctx}=makeCanvas(W,H); const {c:rC,ctx:rctx}=makeCanvas(W,H);
      rctx.fillStyle='#1a1a1a'; rctx.fillRect(0,0,W,H);
      rctx.strokeStyle='rgba(150,150,150,0.2)'; rctx.lineWidth=1;
      for(let i=0;i<150;i++){const x=Math.random()*W,y=Math.random()*H; rctx.beginPath(); rctx.moveTo(x,y); rctx.lineTo(x+(Math.random()-.5)*100,y+(Math.random()-.5)*100); rctx.stroke();}
      if(view==='front'){
        const bg=ctx.createLinearGradient(0,0,W,H);
        bg.addColorStop(0,'#e0eaf5'); bg.addColorStop(0.5,'#ffffff'); bg.addColorStop(1,'#f0e6e6');
        ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
        guilloche(ctx,W,H,'#93c5fd',0.005,0.01,0.5); guilloche(ctx,W,H,'#fca5a5',0.008,0.005,0.4);
        ctx.fillStyle='rgba(30,58,138,0.9)'; ctx.fillRect(0,0,W,150);
        ctx.fillStyle='white'; ctx.font='bold 45px sans-serif'; ctx.fillText('ESPAÑA',100,90);
        ctx.font='35px sans-serif'; ctx.fillText('DOCUMENTO NACIONAL DE IDENTIDAD',800,90);
        ctx.fillStyle='#e5e7eb'; ctx.fillRect(100,250,450,550); ctx.strokeStyle='#9ca3af'; ctx.lineWidth=4; ctx.strokeRect(100,250,450,550);
        ctx.fillStyle='#9ca3af'; ctx.beginPath(); ctx.arc(325,440,112,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(325,800,202,Math.PI,0); ctx.fill();
        ctx.fillStyle='#fbbf24'; ctx.fillRect(100,850,180,140); ctx.strokeStyle='#b45309'; ctx.lineWidth=4;
        for(let i=0;i<4;i++) ctx.strokeRect(110,860+i*30,160,20);
        [['APELLIDOS',data.surname,650,350],['NOMBRE',data.name,650,500],
         ['SEXO',data.sex,650,650],['NACIONALIDAD',data.nationality,1100,650],
         ['FECHA DE NACIMIENTO',data.dob,650,800],['VALIDEZ',data.validity,1300,800]
        ].forEach(([l,v,x,y])=>{
          ctx.fillStyle='#1e3a8a'; ctx.font='bold 25px sans-serif'; ctx.fillText(l,x,y);
          ctx.fillStyle='#111827'; ctx.font='bold 50px sans-serif'; ctx.fillText(v,x,y+60);
        });
        ctx.fillStyle='#dc2626'; ctx.font='bold 80px monospace'; ctx.fillText(data.id,1500,1100);
        ctx.fillStyle='#6b7280'; ctx.font='bold 30px sans-serif'; ctx.fillText('CAN '+data.can,1500,1000);
      } else {
        ctx.fillStyle='#f3f4f6'; ctx.fillRect(0,0,W,H);
        guilloche(ctx,W,H,'#cbd5e1',0.01,0.02,0.6);
        ctx.fillStyle='#1e3a8a'; ctx.font='bold 35px sans-serif'; ctx.fillText('LUGAR DE NACIMIENTO',100,180);
        ctx.fillStyle='#111827'; ctx.font='bold 55px sans-serif'; ctx.fillText(data.birthPlace,100,250);
        ctx.fillStyle='#1e3a8a'; ctx.font='bold 35px sans-serif'; ctx.fillText('HIJO DE',100,380);
        ctx.fillStyle='#111827'; ctx.font='bold 55px sans-serif'; ctx.fillText(data.parents,100,450);
        ctx.fillStyle='#1e3a8a'; ctx.font='bold 35px sans-serif'; ctx.fillText('DOMICILIO',1100,180);
        data.address.split('\n').forEach((l,i)=>{ctx.fillStyle='#111827'; ctx.font='bold 45px sans-serif'; ctx.fillText(l,1100,250+i*60);});
        ctx.fillStyle='rgba(255,255,255,0.8)'; ctx.fillRect(0,800,W,480);
        ctx.fillStyle='#111827'; ctx.font='bold 90px monospace';
        data.mrz.forEach((l,i)=>ctx.fillText(l,80,950+i*130));
      }
      return {map:toTex(cC,true), rough:toTex(rC,false)};
    };

    // ── 11. RG TEXTURES ──────────────────────────────────────────────────────
    const generateRgTextures = (view) => {
      const W=2048, H=1280; const data=MOCK_DATA.brazilRG;
      const {c:cC,ctx}=makeCanvas(W,H); const {c:rC,ctx:rctx}=makeCanvas(W,H);
      rctx.fillStyle='#808080'; rctx.fillRect(0,0,W,H);
      if(view==='front'){
        ctx.fillStyle='#c8e6c9'; ctx.fillRect(0,0,W,H);
        ctx.fillStyle='#2e7d32'; ctx.globalAlpha=0.15;
        for(let x=0;x<W;x+=30) for(let y=0;y<H;y+=30){ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fill();}
        ctx.globalAlpha=1;
        ctx.strokeStyle='#1b5e20'; ctx.lineWidth=10; ctx.strokeRect(40,40,W-80,H-80);
        ctx.beginPath(); ctx.moveTo(40,220); ctx.lineTo(W-40,220); ctx.stroke();
        ctx.fillStyle='#1b5e20'; ctx.font='bold 55px serif'; ctx.fillText('REPÚBLICA FEDERATIVA DO BRASIL',100,120);
        ctx.font='45px serif'; ctx.fillText('CARTEIRA DE IDENTIDADE',100,190);
        ctx.fillStyle='#e5e7eb'; ctx.fillRect(150,300,600,750); ctx.strokeRect(150,300,600,750);
        ctx.fillStyle='#9ca3af'; ctx.beginPath(); ctx.arc(450,530,150,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(450,1050,270,Math.PI,0); ctx.fill();
        ctx.strokeStyle='#1b5e20'; ctx.lineWidth=4;
        ctx.beginPath(); ctx.moveTo(1550,950); ctx.lineTo(1950,950); ctx.stroke();
        ctx.fillStyle='#1b5e20'; ctx.font='bold 30px sans-serif'; ctx.fillText('ASSINATURA DO TITULAR',1600,1000);
      } else {
        ctx.fillStyle='#c8e6c9'; ctx.fillRect(0,0,W,H);
        ctx.strokeStyle='#1b5e20'; ctx.lineWidth=6;
        const cell=(l,v,x,y,cw,ch)=>{
          ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.fillRect(x,y,cw,ch); ctx.strokeRect(x,y,cw,ch);
          ctx.fillStyle='#1b5e20'; ctx.font='bold 25px sans-serif'; ctx.fillText(l,x+20,y+40);
          ctx.fillStyle='#000'; ctx.font='bold 50px monospace';
          v.split('\n').forEach((line,i)=>ctx.fillText(line,x+20,y+110+i*60));
        };
        const m=60, gW=W-m*2;
        cell('REGISTRO GERAL',data.rg,m,m,gW*0.6,180);
        cell('DATA DE EXPEDIÇÃO',data.expedition,m+gW*0.6,m,gW*0.4,180);
        cell('NOME',data.name,m,m+180,gW,180);
        cell('FILIAÇÃO',data.parents,m,m+360,gW,240);
        cell('NATURALIDADE',data.birthPlace,m,m+600,gW*0.6,180);
        cell('DATA DE NASCIMENTO',data.dob,m+gW*0.6,m+600,gW*0.4,180);
        cell('DOC ORIGEM',data.originDoc,m,m+780,gW,180);
        cell('CPF',data.cpf,m,m+960,gW*0.4,200);
        cell('ASSINATURA DO DIRETOR','',m+gW*0.4,m+960,gW*0.6,200);
      }
      return {map:toTex(cC,true), rough:toTex(rC,false)};
    };

    // ── 12. THREE.JS VIEWER ──────────────────────────────────────────────────
    const ThreeViewer = ({ doc, view, setLoading }) => {
      const mountRef = useRef(null);

      useEffect(() => {
        if (!mountRef.current) return;
        const w=mountRef.current.clientWidth, h=mountRef.current.clientHeight;
        if(!w||!h) return;
        const scene=new THREE.Scene();
        const camera=new THREE.PerspectiveCamera(40,w/h,0.1,100); camera.position.z=6.5;
        const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
        renderer.setSize(w,h); renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
        mountRef.current.appendChild(renderer.domElement);
        scene.environment=getStudioEnvironment();
        scene.add(new THREE.AmbientLight(0xffffff,0.7));
        const dir=new THREE.DirectionalLight(0xffffff,2.0); dir.position.set(-5,8,4); scene.add(dir);
        const group=new THREE.Group(); scene.add(group);
        let animId, timeoutId, holoMesh=null, targetRotX=0, targetRotY=0;

        timeoutId=setTimeout(()=>{
          try {
            const isPass=doc.includes('Pass');
            const isSpread=isPass&&(view==='info'||view==='stamps');
            const country=doc.includes('ES')?'ES':'BR';
            const geoW=isSpread?4.8:(isPass?2.4:3.4);
            const geoH=isPass?3.4:2.15;
            const geoD=isSpread?0.02:(isPass?0.15:0.03);
            const geometry=new THREE.BoxGeometry(geoW,geoH,geoD);
            let materials;

            if(isPass&&!isSpread){
              const front=generatePassCover(country), back=generatePassCover(country);
              const vTex=generateVoronoiNoise(), eTex=generatePageEdges(country);
              const eMat=new THREE.MeshStandardMaterial({map:eTex,roughness:0.8});
              const fMat=new THREE.MeshPhysicalMaterial({map:front.map,bumpMap:vTex,bumpScale:0.03,roughnessMap:front.rough,clearcoat:0.1});
              const bMat=new THREE.MeshPhysicalMaterial({map:back.map,bumpMap:vTex,bumpScale:0.03,roughnessMap:back.rough});
              materials=[eMat,new THREE.MeshPhysicalMaterial({color:country==='ES'?'#4a0e1c':'#0a1931'}),eMat,eMat,fMat,bMat];
            } else if(isPass&&isSpread){
              const spread=generatePassSpread(country,view);
              const eMat=new THREE.MeshStandardMaterial({color:'#ffffff',roughness:0.6});
              const fMat=new THREE.MeshPhysicalMaterial({map:spread.map,roughness:0.8});
              const bMat=new THREE.MeshPhysicalMaterial({color:country==='ES'?'#4a0e1c':'#0a1931'});
              materials=[eMat,eMat,eMat,eMat,fMat,bMat];
              if(view==='info'){holoMesh=createHologramMesh(doc,view); group.add(holoMesh);}
            } else {
              const front=doc==='DNI'?generateDniTextures('front'):generateRgTextures('front');
              const back=doc==='DNI'?generateDniTextures('back'):generateRgTextures('back');
              const eMat=new THREE.MeshStandardMaterial({color:'#d1d5db'});
              const fMat=new THREE.MeshPhysicalMaterial({map:front.map,roughnessMap:front.rough,clearcoat:1.0,clearcoatRoughness:0.1});
              const bMat=new THREE.MeshPhysicalMaterial({map:back.map,roughnessMap:back.rough,clearcoat:1.0,clearcoatRoughness:0.1});
              materials=[eMat,eMat,eMat,eMat,fMat,bMat];
              if(doc==='DNI'&&view==='front'){holoMesh=createHologramMesh(doc,view); group.add(holoMesh);}
            }

            const mesh=new THREE.Mesh(geometry,materials);
            if(!isPass&&view==='back') mesh.rotation.y=Math.PI;
            group.add(mesh);
            targetRotX=isPass&&!isSpread?0.2:0.1;
            targetRotY=(!isPass&&view==='back')?Math.PI:(isPass&&!isSpread?-0.3:-0.15);
            group.rotation.x=targetRotX; group.rotation.y=targetRotY;
          } catch(e){ console.error('3D-r build error',e); }
          setLoading(false);
        }, 50);

        const handleMove=(e)=>{
          if(!mountRef.current) return;
          const rect=mountRef.current.getBoundingClientRect();
          const cx=e.touches?e.touches[0].clientX:e.clientX;
          const cy=e.touches?e.touches[0].clientY:e.clientY;
          const x=((cx-rect.left)/rect.width)*2-1;
          const y=-((cy-rect.top)/rect.height)*2+1;
          const isPass=doc.includes('Pass');
          targetRotY=((!isPass&&view==='back')?Math.PI:0)+(x*0.8);
          targetRotX=y*0.8;
        };
        const handleLeave=()=>{
          const isPass=doc.includes('Pass'), isSpread=isPass&&(view==='info'||view==='stamps');
          targetRotX=isPass&&!isSpread?0.2:0.1;
          targetRotY=(!isPass&&view==='back')?Math.PI:(isPass&&!isSpread?-0.3:-0.15);
        };
        mountRef.current.addEventListener('mousemove',handleMove);
        mountRef.current.addEventListener('mouseleave',handleLeave);
        mountRef.current.addEventListener('touchmove',handleMove,{passive:true});
        mountRef.current.addEventListener('touchend',handleLeave);

        const animate=()=>{
          group.rotation.x+=(targetRotX-group.rotation.x)*0.1;
          group.rotation.y+=(targetRotY-group.rotation.y)*0.1;
          if(holoMesh){
            const tilt=Math.abs(targetRotX)+Math.abs(targetRotY-(view==='back'?Math.PI:0));
            holoMesh.material.opacity=Math.min(0.8,tilt*0.8);
          }
          renderer.render(scene,camera);
          animId=requestAnimationFrame(animate);
        };
        animate();

        const handleResize=()=>{
          if(!mountRef.current) return;
          const w=mountRef.current.clientWidth, h=mountRef.current.clientHeight;
          if(!w||!h) return;
          renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
        };
        window.addEventListener('resize',handleResize);

        return ()=>{
          clearTimeout(timeoutId); window.removeEventListener('resize',handleResize); cancelAnimationFrame(animId);
          if(mountRef.current){
            mountRef.current.removeEventListener('mousemove',handleMove);
            mountRef.current.removeEventListener('mouseleave',handleLeave);
            mountRef.current.removeEventListener('touchmove',handleMove);
            mountRef.current.removeEventListener('touchend',handleLeave);
            try{ renderer.dispose(); } catch(e){}
            mountRef.current.innerHTML='';
          }
        };
      }, [doc, view, setLoading]);

      return (
        <div ref={mountRef} style={{width:'100%',height:'100%',cursor:'grab'}} />
      );
    };

    // ── 13. KIND → TYPE ──────────────────────────────────────────────────────
    const KIND_MAP = {
      'id_dni':         {type:'DNI',     isPassport:false},
      'id_nie':         {type:'DNI',     isPassport:false},
      'id_tsi':         {type:'DNI',     isPassport:false},
      'id_driving_es':  {type:'DNI',     isPassport:false},
      'id_boat_es':     {type:'DNI',     isPassport:false},
      'id_cin_br':      {type:'RG',      isPassport:false},
      'id_passport_es': {type:'ES-Pass', isPassport:true},
      'id_passport_br': {type:'BR-Pass', isPassport:true},
    };

    // ── 14. APP ──────────────────────────────────────────────────────────────
    const S = {
      root:    {width:'100vw',height:'100vh',background:'#0c0d12',display:'flex',flexDirection:'column',overflow:'hidden',color:'white',position:'relative',fontFamily:'sans-serif'},
      topNav:  {position:'absolute',top:0,left:0,right:0,zIndex:20,padding:'16px',display:'flex',flexDirection:'column',alignItems:'center',pointerEvents:'none'},
      title:   {fontSize:'28px',fontWeight:900,letterSpacing:'-1px',marginBottom:'12px',textAlign:'center'},
      badge:   {fontSize:'10px',letterSpacing:'3px',fontFamily:'monospace',color:'#34d399',border:'1px solid rgba(52,211,153,0.3)',background:'rgba(52,211,153,0.1)',padding:'3px 10px',borderRadius:'20px',marginBottom:'8px',display:'block'},
      tabBar:  {display:'flex',flexWrap:'wrap',justifyContent:'center',gap:'6px',background:'rgba(255,255,255,0.05)',padding:'6px',borderRadius:'40px',border:'1px solid rgba(255,255,255,0.1)',pointerEvents:'auto'},
      tabBtn:  (active)=>({border:'none',cursor:'pointer',fontWeight:'bold',fontSize:'13px',borderRadius:'40px',padding:'8px 16px',transition:'all 0.2s',background:active?'white':'transparent',color:active?'#111':'#9ca3af'}),
      viewer:  {flex:1,width:'100%',position:'relative'},
      spinner: {position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',zIndex:10,color:'rgba(52,211,153,0.6)',fontFamily:'monospace',fontSize:'11px',letterSpacing:'3px',background:'#0c0d12'},
      ctrlBar: {position:'absolute',bottom:'24px',left:0,right:0,zIndex:20,display:'flex',justifyContent:'center',pointerEvents:'none'},
      ctrlInner:{display:'flex',gap:'6px',background:'rgba(255,255,255,0.1)',padding:'8px',borderRadius:'16px',border:'1px solid rgba(255,255,255,0.2)',pointerEvents:'auto'},
      ctrlBtn: (active)=>({border:'none',cursor:'pointer',fontWeight:'bold',fontSize:'13px',borderRadius:'10px',padding:'6px 18px',transition:'all 0.2s',background:active?'#6366f1':'transparent',color:active?'white':'#d1d5db'}),
      hint:    {position:'absolute',bottom:'80px',left:0,right:0,textAlign:'center',color:'#4b5563',fontSize:'11px',fontFamily:'monospace',letterSpacing:'3px',pointerEvents:'none',zIndex:10},
    };

    function App() {
      const [activeDoc, setActiveDoc] = useState(() => {
        const k=new URLSearchParams(location.search).get('kind')||'id_dni';
        return KIND_MAP[k]&&KIND_MAP[k].type||'DNI';
      });
      const [view, setView] = useState(() => {
        const k=new URLSearchParams(location.search).get('kind')||'id_dni';
        return KIND_MAP[k]&&KIND_MAP[k].isPassport?'cover':'front';
      });
      const [isLoading, setLoading] = useState(true);

      useEffect(()=>{
        window.setCard=(kind)=>{ const cfg=KIND_MAP[kind]; if(cfg){setActiveDoc(cfg.type); setView(cfg.isPassport?'cover':'front');} };
        return ()=>{ delete window.setCard; };
      },[]);
      useEffect(()=>{ setLoading(true); if(activeDoc.includes('Pass')) setView('cover'); else setView('front'); },[activeDoc]);

      const docs=[{id:'DNI',name:'🇪🇸 Spain DNI'},{id:'RG',name:'🇧🇷 Brazil RG'},{id:'ES-Pass',name:'🇪🇸 Passport ES'},{id:'BR-Pass',name:'🇧🇷 Passport BR'}];
      const handleViewChange=(v)=>{ setLoading(true); setView(v); };

      return (
        <div style={S.root}>
          <div style={S.topNav}>
            <h1 style={S.title}>
              <span style={S.badge}>PBR · Iridescence · Leather · Hologram</span>
              Hyper-Realistic Identity
            </h1>
            <div style={S.tabBar}>
              {docs.map(d=>(
                <button key={d.id} onClick={()=>setActiveDoc(d.id)} style={S.tabBtn(activeDoc===d.id)}>{d.name}</button>
              ))}
            </div>
          </div>

          <div style={S.viewer}>
            {isLoading&&(
              <div style={S.spinner}>
                <svg style={{width:28,height:28,marginBottom:12,animation:'spin 1s linear infinite'}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <circle cx="12" cy="12" r="10" strokeOpacity="0.25"/>
                  <path d="M12 2a10 10 0 0 1 10 10" strokeLinecap="round"/>
                </svg>
                COMPILING PBR TEXTURES...
              </div>
            )}
            <ThreeViewer doc={activeDoc} view={view} setLoading={setLoading} />
          </div>

          <div style={S.ctrlBar}>
            <div style={S.ctrlInner}>
              {activeDoc.includes('Pass')?(
                ['cover','info','stamps'].map(tab=>(
                  <button key={tab} onClick={()=>handleViewChange(tab)} style={S.ctrlBtn(view===tab)}>{tab.charAt(0).toUpperCase()+tab.slice(1)}</button>
                ))
              ):(
                ['front','back'].map(tab=>(
                  <button key={tab} onClick={()=>handleViewChange(tab)} style={S.ctrlBtn(view===tab)}>{tab.charAt(0).toUpperCase()+tab.slice(1)} Side</button>
                ))
              )}
            </div>
          </div>

          <div style={S.hint}>DRAG TO INTERACT WITH PBR LIGHTING AND HOLOGRAMS</div>
        </div>
      );
    }

    createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
