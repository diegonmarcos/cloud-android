<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>*{margin:0;padding:0;box-sizing:border-box}html,body,canvas{width:100%;height:100%;display:block;background:#0c0d12}#ov{position:fixed;top:0;left:0;padding:6px 10px;background:#0008;color:#0f0;font:10px monospace;pointer-events:none;white-space:pre-wrap;word-break:break-all;max-width:100%}</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ov"></div>
<script>
var ov=document.getElementById('ov');
function log(m){console.log(m);ov.textContent=(ov.textContent+'\n'+m).slice(-600);}
window.onerror=function(m,s,l){console.error('[E]'+m+'('+l+')');log('ERR:'+m);return false;};
log('WebGL init');

// ── minimal mat4 (column-major, matches WebGL) ────────────────────────────────
function m4(){return new Float32Array(16);}
function identity(m){for(var i=0;i<16;i++)m[i]=0;m[0]=m[5]=m[10]=m[15]=1;return m;}
function perspective(m,fov,ar,n,f){var t=1/Math.tan(fov/2),r=1/(n-f);
  m[0]=t/ar;m[1]=m[2]=m[3]=0;m[4]=0;m[5]=t;m[6]=m[7]=0;m[8]=m[9]=0;
  m[10]=(n+f)*r;m[11]=-1;m[12]=m[13]=0;m[14]=2*n*f*r;m[15]=0;return m;}
function mul(o,a,b){
  for(var c=0;c<4;c++){var b0=b[c*4],b1=b[c*4+1],b2=b[c*4+2],b3=b[c*4+3];
    o[c*4  ]=b0*a[0]+b1*a[4]+b2*a[8] +b3*a[12];
    o[c*4+1]=b0*a[1]+b1*a[5]+b2*a[9] +b3*a[13];
    o[c*4+2]=b0*a[2]+b1*a[6]+b2*a[10]+b3*a[14];
    o[c*4+3]=b0*a[3]+b1*a[7]+b2*a[11]+b3*a[15];}return o;}
function rotY(m,a){var s=Math.sin(a),c=Math.cos(a),x=m[0],y=m[1],z=m[2],w=m[3],X=m[8],Y=m[9],Z=m[10],W=m[11];
  m[0]=x*c-X*s;m[1]=y*c-Y*s;m[2]=z*c-Z*s;m[3]=w*c-W*s;
  m[8]=x*s+X*c;m[9]=y*s+Y*c;m[10]=z*s+Z*c;m[11]=w*s+W*c;return m;}
function rotX(m,a){var s=Math.sin(a),c=Math.cos(a),x=m[4],y=m[5],z=m[6],w=m[7],X=m[8],Y=m[9],Z=m[10],W=m[11];
  m[4]=x*c+X*s;m[5]=y*c+Y*s;m[6]=z*c+Z*s;m[7]=w*c+W*s;
  m[8]=X*c-x*s;m[9]=Y*c-y*s;m[10]=Z*c-z*s;m[11]=W*c-w*s;return m;}
function upper3(m){return new Float32Array([m[0],m[1],m[2],m[4],m[5],m[6],m[8],m[9],m[10]]);}

// ── per-document data (data-driven) ───────────────────────────────────────────
// type: 'book' (passport) | 'card' (ID-1). cover=front bg, accent=gold/emblem,
// back=reverse/edge colour. title/country/sub render onto the cover/header.
var SPECS={
  id_passport_es:{type:'book',cover:'#3a0d14',accent:'#c9a84c',back:'#2a0a10',page:'#efe8d8',
                  sub:'UNIÓN EUROPEA',country:'ESPAÑA',title:'PASAPORTE'},
  id_passport_br:{type:'book',cover:'#0b2545',accent:'#d4af37',back:'#08182f',page:'#efe8d8',
                  sub:'MERCOSUL',country:'BRASIL',title:'PASSAPORTE'},
  id_dni:{type:'card',cover:'#1b3a8c',accent:'#f2c53d',back:'#12285f',
          sub:'REINO DE ESPAÑA',country:'DNI',title:'DOCUMENTO NACIONAL DE IDENTIDAD'},
  id_nie:{type:'card',cover:'#2e8b57',accent:'#f2c53d',back:'#1f5f3b',
          sub:'UNIÓN EUROPEA',country:'NIE',title:'TARJETA DE IDENTIDAD DE EXTRANJERO'},
  id_tsi:{type:'card',cover:'#009fca',accent:'#ffffff',back:'#0077a0',
          sub:'CATSALUT',country:'TSI',title:'TARGETA SANITÀRIA INDIVIDUAL'},
  id_cin_br:{type:'card',cover:'#1f8b4c',accent:'#f2d34d',back:'#156038',
             sub:'REPÚBLICA FEDERATIVA DO BRASIL',country:'CIN',title:'CARTEIRA DE IDENTIDADE'},
  id_driving_es:{type:'card',cover:'#c0392b',accent:'#f2c53d',back:'#8f2a20',
                 sub:'PERMISO DE CONDUCCIÓN',country:'ESP',title:'PERMISO DE CONDUCIR'},
  id_boat_es:{type:'card',cover:'#0a4b8c',accent:'#f2c53d',back:'#073562',
              sub:'TITULACIÓN NÁUTICA',country:'PER',title:'PATRÓN EMBARCACIÓN RECREO'}
};

// ── canvas texture for the front face ─────────────────────────────────────────
function drawEmblem(x,g,cx,cy,r,col){
  x.save();x.translate(cx,cy);x.strokeStyle=col;x.fillStyle=col;x.lineWidth=r*0.06;
  x.beginPath();x.arc(0,0,r,0,7);x.stroke();
  x.beginPath();x.arc(0,0,r*0.62,0,7);x.stroke();
  for(var i=0;i<12;i++){var a=i/12*Math.PI*2;
    x.beginPath();x.moveTo(Math.cos(a)*r*0.62,Math.sin(a)*r*0.62);
    x.lineTo(Math.cos(a)*r*0.88,Math.sin(a)*r*0.88);x.stroke();}
  x.beginPath();x.arc(0,0,r*0.28,0,7);x.fill();
  x.restore();
}
function bookTex(s){
  var c=document.createElement('canvas');c.width=360;c.height=512;var x=c.getContext('2d');
  x.fillStyle=s.cover;x.fillRect(0,0,360,512);
  // subtle vignette border
  x.strokeStyle=s.accent;x.lineWidth=4;x.strokeRect(16,16,328,480);
  x.fillStyle=s.accent;x.textAlign='center';
  x.font='bold 20px serif';x.fillText(s.sub,180,70);
  x.font='bold 34px serif';x.fillText(s.country,180,120);
  drawEmblem(x,g,180,260,90,s.accent);
  x.font='bold 26px serif';x.fillText(s.title,180,440);
  // chip-ish glyph
  x.fillStyle=s.accent;x.fillRect(150,466,60,26);x.clearRect(158,472,44,14);
  return c;
}
function cardTex(s){
  var c=document.createElement('canvas');c.width=512;c.height=323;var x=c.getContext('2d');
  x.fillStyle='#f4f4ef';x.fillRect(0,0,512,323);
  // header band
  x.fillStyle=s.cover;x.fillRect(0,0,512,64);
  x.fillStyle=s.accent;x.textAlign='left';x.font='bold 15px sans-serif';x.fillText(s.sub,16,26);
  x.fillStyle='#fff';x.font='bold 22px sans-serif';x.fillText(s.title,16,52);
  // photo box
  x.fillStyle='#d7dae0';x.fillRect(20,86,120,150);
  x.strokeStyle='#9aa0aa';x.lineWidth=2;x.strokeRect(20,86,120,150);
  x.fillStyle='#aeb4bd';x.beginPath();x.arc(80,150,34,0,7);x.fill();
  x.fillRect(48,196,64,40);
  // field lines
  x.fillStyle=s.cover;x.font='bold 12px sans-serif';
  var labels=['APELLIDOS','NOMBRE','FECHA NAC.','Nº DOCUMENTO','VÁLIDO HASTA'];
  for(var i=0;i<labels.length;i++){var yy=104+i*30;
    x.fillStyle='#7a8089';x.fillText(labels[i],160,yy);
    x.fillStyle='#2a2e35';x.fillRect(160,yy+6,300,10);}
  // gold document code
  x.fillStyle=s.cover;x.font='bold 26px sans-serif';x.textAlign='right';x.fillText(s.country,496,52);
  // MRZ strip
  x.fillStyle='#e9e9e2';x.fillRect(0,272,512,51);
  x.fillStyle='#33373d';x.font='16px monospace';x.textAlign='left';
  x.fillText('IDESP'+ s.country +'<<<<<<<<<<<<<<<<<<<<<<<',10,292);
  x.fillText('7708231M3011148ESP<<<<<<<<<<<8',10,314);
  return c;
}

// ── geometry: box with per-face groups (front textured) ───────────────────────
// faces order: +Z front, -Z back, +Y top, -Y bottom, +X right, -X left
function faceQuad(pos,nor,uv,idx,base,p,n){
  for(var i=0;i<4;i++){pos.push(p[i*3],p[i*3+1],p[i*3+2]);nor.push(n[0],n[1],n[2]);}
  uv.push(0,1, 1,1, 1,0, 0,0);
  idx.push(base,base+1,base+2, base,base+2,base+3);
}
function buildBox(hw,hh,hd){
  var pos=[],nor=[],uv=[],idx=[],b=0;
  faceQuad(pos,nor,uv,idx,b,[-hw,-hh,hd, hw,-hh,hd, hw,hh,hd, -hw,hh,hd],[0,0,1]);b+=4; //front
  faceQuad(pos,nor,uv,idx,b,[hw,-hh,-hd, -hw,-hh,-hd, -hw,hh,-hd, hw,hh,-hd],[0,0,-1]);b+=4;//back
  faceQuad(pos,nor,uv,idx,b,[-hw,hh,hd, hw,hh,hd, hw,hh,-hd, -hw,hh,-hd],[0,1,0]);b+=4;//top
  faceQuad(pos,nor,uv,idx,b,[-hw,-hh,-hd, hw,-hh,-hd, hw,-hh,hd, -hw,-hh,hd],[0,-1,0]);b+=4;//bottom
  faceQuad(pos,nor,uv,idx,b,[hw,-hh,hd, hw,-hh,-hd, hw,hh,-hd, hw,hh,hd],[1,0,0]);b+=4;//right
  faceQuad(pos,nor,uv,idx,b,[-hw,-hh,-hd, -hw,-hh,hd, -hw,hh,hd, -hw,hh,-hd],[-1,0,0]);b+=4;//left
  return {pos:new Float32Array(pos),nor:new Float32Array(nor),uv:new Float32Array(uv),idx:new Uint16Array(idx)};
}
function hex(h){return [parseInt(h.substr(1,2),16)/255,parseInt(h.substr(3,2),16)/255,parseInt(h.substr(5,2),16)/255];}

// ── WebGL ─────────────────────────────────────────────────────────────────────
var cv=document.getElementById('c');
var gl=cv.getContext('webgl')||cv.getContext('experimental-webgl');
if(!gl){log('WebGL NOT SUPPORTED');throw new Error('no webgl');}
log('WebGL context: OK');

var VS='attribute vec3 aP;attribute vec3 aN;attribute vec2 aUV;uniform mat4 uMVP;uniform mat3 uNM;varying vec3 vN;varying vec2 vUV;void main(){vN=uNM*aN;vUV=aUV;gl_Position=uMVP*vec4(aP,1.);}';
var FS='precision mediump float;varying vec3 vN;varying vec2 vUV;uniform vec3 uC;uniform sampler2D uT;uniform float uUseT;void main(){float l=max(dot(normalize(vN),normalize(vec3(2.,3.,4.))),.0)*.75+.35;vec3 base=uUseT>.5?texture2D(uT,vUV).rgb:uC;gl_FragColor=vec4(base*l,1.);}';

function mkShader(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){log('shader err:'+gl.getShaderInfoLog(s));}return s;}
var prog=gl.createProgram();
gl.attachShader(prog,mkShader(gl.VERTEX_SHADER,VS));
gl.attachShader(prog,mkShader(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){log('link err:'+gl.getProgramInfoLog(prog));}
gl.useProgram(prog);
log('shaders: OK');

var aP=gl.getAttribLocation(prog,'aP'),aN=gl.getAttribLocation(prog,'aN'),aUV=gl.getAttribLocation(prog,'aUV');
var uMVP=gl.getUniformLocation(prog,'uMVP'),uNM=gl.getUniformLocation(prog,'uNM'),uC=gl.getUniformLocation(prog,'uC');
var uT=gl.getUniformLocation(prog,'uT'),uUseT=gl.getUniformLocation(prog,'uUseT');
gl.enable(gl.DEPTH_TEST);
gl.uniform1i(uT,0);

var bP=gl.createBuffer(),bN=gl.createBuffer(),bU=gl.createBuffer(),bI=gl.createBuffer();
var tex=gl.createTexture();
var idxCount=0;
var faceColors=[]; // per-face [r,g,b], index 0..5 (front unused=textured)

function uploadTex(canvas){
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,canvas);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
}

var proj=m4(),view=m4(),model=m4(),mv=m4(),mvp=m4();
perspective(proj,Math.PI/4,1,0.1,100);
identity(view);view[14]=-4.6;
var ry=0,rx=0;

window.setCard=function(kind){
  log('setCard: '+kind);
  var s=SPECS[kind]||SPECS.id_dni;
  var geo,g;
  if(s.type==='book'){
    geo=buildBox(0.88,1.25,0.13);
    uploadTex(bookTex(s));
    var cov=hex(s.back),page=hex(s.page);
    // +Z textured, -Z back cover, -X spine cover, +X/+Y/-Y = pages
    faceColors=[null,cov,page,page,page,cov];
  }else{
    geo=buildBox(1.6875,1.0625,0.05);
    uploadTex(cardTex(s));
    var bk=hex(s.back);
    faceColors=[null,bk,bk,bk,bk,bk];
  }
  gl.bindBuffer(gl.ARRAY_BUFFER,bP);gl.bufferData(gl.ARRAY_BUFFER,geo.pos,gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER,bN);gl.bufferData(gl.ARRAY_BUFFER,geo.nor,gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER,bU);gl.bufferData(gl.ARRAY_BUFFER,geo.uv,gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,bI);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,geo.idx,gl.STATIC_DRAW);
  idxCount=geo.idx.length;
};

function resize(){var w=cv.clientWidth,h=cv.clientHeight;
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;gl.viewport(0,0,w,h);perspective(proj,Math.PI/4,w/h,0.1,100);}}

function render(){
  requestAnimationFrame(render);
  resize();
  ry+=0.008;rx=Math.sin(ry*0.5)*0.25;
  identity(model);rotY(model,ry);rotX(model,rx);
  mul(mv,view,model);mul(mvp,proj,mv);

  gl.clearColor(0.047,0.051,0.071,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  if(!idxCount)return;

  gl.bindBuffer(gl.ARRAY_BUFFER,bP);gl.enableVertexAttribArray(aP);gl.vertexAttribPointer(aP,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,bN);gl.enableVertexAttribArray(aN);gl.vertexAttribPointer(aN,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,bU);gl.enableVertexAttribArray(aUV);gl.vertexAttribPointer(aUV,2,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,bI);
  gl.uniformMatrix4fv(uMVP,false,mvp);
  gl.uniformMatrix3fv(uNM,false,upper3(model));
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);

  // each face = 6 indices; face 0 textured, 1..5 solid per faceColors
  for(var f=0;f<6;f++){
    if(f===0){gl.uniform1f(uUseT,1.);}
    else{gl.uniform1f(uUseT,0.);var col=faceColors[f]||[0.3,0.3,0.3];gl.uniform3fv(uC,col);}
    gl.drawElements(gl.TRIANGLES,6,gl.UNSIGNED_SHORT,f*6*2);
  }
}

log('starting render loop');
render();
var k=new URLSearchParams(location.search).get('kind')||'';
if(k)window.setCard(k);
</script>
</body>
</html>
