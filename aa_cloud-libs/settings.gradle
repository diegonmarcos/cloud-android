pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

def buildJson = new groovy.json.JsonSlurper().parse(file('build.json'))
def libCfg    = buildJson.lib_apks
// lib_apks.scan is a LIST of roots: library modules live beside the app that
// grew them, so the set spans repos. Normalised here once and reused below for
// the module graph, so no path is written twice.
def scanRoots = (libCfg.scan instanceof List ? libCfg.scan : [libCfg.scan])
                        .collect { file(it) }
// libs:firewall consumes a prebuilt firestack.aar from a flat directory. Found
// by searching the scan roots rather than repeating a path build.json owns.
def firestackDirs = scanRoots.collect { new File(it, 'firewall/firestack') }.findAll { it.isDirectory() }

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // The same set the consuming repos declare, because these are THEIR
        // modules: libs:shizuku-adb-debug-tools resolves libadb-android from
        // JitPack, and libs:firewall picks up the prebuilt firestack.aar from a
        // flat directory. FAIL_ON_PROJECT_REPOS means a module cannot declare
        // either for itself - they have to be here or the module does not
        // resolve, which is exactly how this build first failed.
        maven { url 'https://jitpack.io' }
        if (!firestackDirs.isEmpty()) flatDir { dirs firestackDirs*.absolutePath }
    }
}

rootProject.name = "cloud-libs"

// The wrapper module, same data-driven loop every constellation repo uses.
buildJson.modules.each { name, _spec ->
    if (name.startsWith('_')) return  // skip _doc keys
    include ":${name}"
    def path = _spec?.dir ?: name.replace(':', '/')
    project(":${name}").projectDir = file(path)
}

// Every library module in the constellation, shared BY REFERENCE from the one
// canonical directory it already lives in. Discovered, never listed: a directory
// with a build.gradle under any scan root is a module, and gets an APK unless
// lib_apks.exclude says why not. Adding a module therefore ships an APK with no
// edit here (FIRE RULE #6: never hardcode lists).
scanRoots.each {
    if (!it.isDirectory()) throw new GradleException("lib_apks.scan names a path that is not a directory: ${it}")
}
def excluded = (libCfg.exclude ?: [:]).keySet()

/** name -> directory, for every library module under any root. */
def modulesUnder = { boolean skipExcluded ->
    def found = [:]
    scanRoots.each { root ->
        root.listFiles()
            .findAll { it.isDirectory() && new File(it, 'build.gradle').isFile() }
            .each { dir ->
                if (skipExcluded && excluded.contains(dir.name)) return
                def prev = found.put(dir.name, dir)
                if (prev != null && prev != dir) {
                    // The module name is both the gradle path (:libs:<name>) and
                    // the applicationId suffix, so a collision would silently
                    // give two different libraries the same APK identity.
                    throw new GradleException(
                        "two scan roots both provide module '${dir.name}':\n  ${prev}\n  ${dir}\n" +
                        "module names must be unique across every lib_apks.scan root")
                }
            }
    }
    found
}

def libDirs = modulesUnder(true)
if (libDirs.isEmpty()) {
    // A silent empty scan would produce a repo that builds zero APKs and still
    // reports success - the exact failure mode the CI engine's glob guard exists
    // to prevent. Fail loudly instead.
    throw new GradleException("no library modules found under ${scanRoots} - nothing to ship")
}
gradle.ext.shippedLibs = libDirs.keySet().sort()
gradle.ext.shippedLibs.each { name ->
    include ":libs:${name}"
    project(":libs:${name}").projectDir = libDirs[name]
}

// Inter-module dependencies: a shipped module may depend on a module we excluded
// (or on one that lives under a different root), and gradle would only say
// "Project with path ':libs:x' could not be found". Include any such module too -
// it is compiled into the APK that needs it, it just gets no APK of its own.
def allDirs  = modulesUnder(false)
def included = libDirs.keySet().toSet()
allDirs.each { _name, dir ->
    new File(dir, 'build.gradle').text.findAll(/project\(':libs:([\w-]+)'\)/) { _m, dep ->
        if (!included.contains(dep) && allDirs.containsKey(dep)) {
            included << dep
            include ":libs:${dep}"
            project(":libs:${dep}").projectDir = allDirs[dep]
        }
    }
}
