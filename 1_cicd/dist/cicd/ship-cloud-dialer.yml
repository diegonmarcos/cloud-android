name: "Ship → Cloud Dialer (materialize + build + publish to GHCR)"

# Independent per-app workflow for Cloud Dialer (Fossify Phone fork).
# Engine: 1_cicd/src/scripts/cloud-dialer-fork-engine.sh (symlinked as ac_cloud-dialer/build.sh).
# Per-app build.json at ac_cloud-dialer/build.json; patches at ac_cloud-dialer/patches/.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      # MANAGED by cloud-android-ship-repo-workflow-engine.sh: every dir
      # ac_cloud-dialer/build.json::modules declares is added automatically, dead
      # entries are dropped, and cloud-android-source-identity.sh hashes
      # exactly this list — so nothing can trigger a build the publish
      # gate does not weigh. Extra entries no module map can express
      # (settings.gradle.kts references, scan roots) are kept: add them
      # here and they stay.
      - "1_cicd/src/cicd/ship-cloud-dialer.yml"
      - "1_cicd/src/scripts/cloud-dialer-fork-engine.sh"
      - "ac_cloud-dialer/**"
permissions:
  contents: write   # gh release create (RSS feed entries)
  packages: write   # ghcr push (oras)

concurrency:
  group: ship-cloud-dialer-${{ github.ref }}
  cancel-in-progress: true

env:
  WORK_DIR: ac_cloud-dialer
  FORK: dialer

jobs:
  build_and_publish:
    name: "Materialize + build + publish (dialer · ${{ matrix.combo.abi }})"
    strategy:
      fail-fast: false
      matrix:
        combo: [{fork: "dialer", abi: "arm64-v8a"}]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COMMS_BUNDLE_ABI: ${{ matrix.combo.abi }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Publish-if-changed gate. Android builds are not byte-reproducible, so a
      # rebuild of unchanged source published different bytes, a different
      # sha256 sidecar and a different OCI digest — and the Constellation store
      # compares exactly those, so every cascade rebuild showed up on every
      # phone as an update with nothing in it. The gate hashes this app's build
      # INPUTS (git tree shas of the app dir, the shared lib dirs its build.json
      # module map declares, and this workflow) and compares that identity to
      # the <asset>.source sidecar already on the release. Equal → the whole
      # rest of this job is skipped and the release asset is left untouched.
      - name: Publish gate (skip when source unchanged)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh check "$WORK_DIR" "${{ matrix.combo.abi }}"

      - name: Set up JDK 17
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Checkout vault (shared Android signing key)
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault

      - name: Install ORAS + sops + jq
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq
          curl -fsSL https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz \
            | sudo tar -C /usr/local/bin -xzf - oras
          oras version
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64 \
            | sudo tee /usr/local/bin/sops >/dev/null
          sudo chmod +x /usr/local/bin/sops
          sops --version

      - name: Materialize fork (clone @ pin + patch series)
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
        run: |
          chmod +x build.sh
          ./build.sh materialize-fork "$FORK"

      - name: Generate build stamp (baked into APK BuildConfig AND release tag)
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "COMMS_BUILD_TIMESTAMP=$(date -u '+%Y%m%d.%H%M%S')" >> "$GITHUB_ENV"

      - name: Build fork APK (fork's own gradle wrapper + constellation signing)
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          COMMS_BUILD_TIMESTAMP: ${{ env.COMMS_BUILD_TIMESTAMP }}
        run: |
          ./build.sh build-fork "$FORK"
          ls -la dist/

      - name: Upload fork APK as workflow artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cloud-comms-dialer-${{ matrix.combo.abi }}-${{ github.sha }}
          path: ${{ env.WORK_DIR }}/dist/cloud-comms-dialer.apk
          if-no-files-found: error
          retention-days: 30

      - name: Login to GHCR
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish fork APK to GHCR
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          GITHUB_SHA: ${{ github.sha }}
        run: ./build.sh publish-fork "$FORK"

      - name: Create GitHub Release (RSS update notification)
        if: ${{ steps.gate.outputs.skip != 'true' && (success() && matrix.combo.abi == 'arm64-v8a') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="cloud-comms-dialer-${COMMS_BUILD_TIMESTAMP}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Cloud Dialer · ${{ env.COMMS_BUILD_TIMESTAMP }}" \
            --notes "New build published to ghcr.io/diegonmarcos/cloud-comms-dialer:latest — install via Cloud Dialer → About → Check for updates." \
            --latest=false \
            "${{ env.WORK_DIR }}/dist/cloud-comms-dialer.apk"

      # Rolling 'latest' release: upload the APK under its own name so
      # /releases/latest/download/cloud-comms-dialer.apk is a stable install URL
      # (aa_cloud-superapp ui.external_apps[cloud-dialer].install_apk_url).
      # Engine step reads build.json::release.gh_release (rolling_tag=latest).
      - name: Publish fork APK to rolling 'latest' release (stable install URL)
        if: ${{ steps.gate.outputs.skip != 'true' && (success() && matrix.combo.abi == 'arm64-v8a') }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./build.sh gh-release-fork "$FORK"

      - name: Stamp source identity on the published assets
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh stamp "$WORK_DIR" "${{ matrix.combo.abi }}"
