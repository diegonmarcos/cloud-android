name: "Ship → Cloud Sheets APK (mirror official Collabora Office + push to GHCR via ORAS + attach to GH Release)"

# NO BUILD. No engine script, no gradle, no SDK, no signing — on purpose.
#
# Collabora Office's engine is LibreOffice core. Building it means Collabora's
# own Gerrit plus an NDK megabuild over the whole external/ tree, and the result
# still could not be signed as com.collabora.libreoffice by us. So this workflow
# MIRRORS: it downloads the official APK from Collabora's F-Droid repo, verifies
# it byte-for-byte against the sha256 pinned in ac_cloud-sheets/build.json, and
# republishes those exact bytes through the same two channels every other app
# here uses, so the Constellation AppStore installs and auto-updates it like any
# fleet member:
#
#   1. ORAS push as OCI artifact → ghcr.io/diegonmarcos/cloud-sheets:latest
#   2. GH Release attachment     → Cloud-Sheets.apk on the rolling `latest` release
#
# The pin is the entire security story. An unpinned mirror is a supply-chain
# hole: whatever upstream happens to serve would get our name on it. So a sha
# mismatch FAILS the job hard and publishes nothing — it means either upstream
# rotated the artifact (bump build.json::upstream.* in one commit) or the
# download was tampered with, and neither is something to paper over.
#
# Single job, no ABI matrix: the pinned index entry declares abis
# ["arm64-v8a"] and Collabora ships no x86_64 artifact to mirror.

on:
  workflow_dispatch:
    inputs:
      push_oras:
        description: "Push APK to GHCR via ORAS"
        required: false
        type: boolean
        default: true
  push:
    branches: [main]
    tags:
      - "ac_cloud-sheets-v*"
    paths:
      # MANAGED by cloud-android-ship-repo-workflow-engine.sh: every dir
      # ac_cloud-sheets/build.json::modules declares is added automatically, dead
      # entries are dropped, and cloud-android-source-identity.sh hashes
      # exactly this list — so nothing can trigger a build the publish
      # gate does not weigh. Extra entries no module map can express
      # (settings.gradle.kts references, scan roots) are kept: add them
      # here and they stay.
      - "1_cicd/src/cicd/ship-cloud-sheets.yml"
      - "ac_cloud-sheets/**"
permissions:
  contents: write   # for gh release create/upload
  packages: write   # for ghcr push (oras)

concurrency:
  group: ship-cloud-sheets-${{ github.ref }}
  cancel-in-progress: true

env:
  WORK_DIR: ac_cloud-sheets

jobs:
  mirror_and_publish:
    name: "Mirror official APK + Publish (arm64-v8a)"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Publish-if-changed gate. Android builds are not byte-reproducible, so a
      # rebuild of unchanged source published different bytes, a different
      # sha256 sidecar and a different OCI digest — and the Constellation store
      # compares exactly those, so every cascade rebuild showed up on every
      # phone as an update with nothing in it. The gate hashes this app's build
      # INPUTS (git tree shas of the app dir, the shared lib dirs its build.json
      # module map declares, and this workflow) and compares that identity to
      # the <asset>.source sidecar already on the release. Equal → the whole
      # rest of this job is skipped and the release asset is left untouched.
      - name: Publish gate (skip when source unchanged)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh check "$WORK_DIR" ""

      - name: Install ORAS
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin oras
          oras version

      - name: Read pin from build.json
        if: steps.gate.outputs.skip != 'true'
        id: pin
        run: |
          set -euo pipefail
          BJ="$WORK_DIR/build.json"
          {
            echo "url=$(jq -r '.upstream.url'          "$BJ")"
            echo "sha256=$(jq -r '.upstream.sha256'    "$BJ")"
            echo "size=$(jq -r '.upstream.size'        "$BJ")"
            echo "version=$(jq -r '.upstream.version_name' "$BJ")"
            echo "asset=$(jq -r '.release.gh_release.asset_name' "$BJ")"
            echo "rolling_tag=$(jq -r '.release.gh_release.rolling_tag' "$BJ")"
            echo "media_type=$(jq -r '.release.ghcr.media_type' "$BJ")"
            echo "ref=$(jq -r '.release.ghcr.registry + "/" + .release.ghcr.namespace + "/" + .release.ghcr.image' "$BJ")"
          } >> "$GITHUB_OUTPUT"

      - name: Download official Collabora Office APK
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          curl -fSL --retry 3 --retry-delay 5 \
            -o "${{ steps.pin.outputs.asset }}" "${{ steps.pin.outputs.url }}"
          ls -l "${{ steps.pin.outputs.asset }}"

      - name: Verify pinned sha256 (HARD FAIL on mismatch)
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          ASSET="${{ steps.pin.outputs.asset }}"
          EXPECT="${{ steps.pin.outputs.sha256 }}"
          EXPECT_SIZE="${{ steps.pin.outputs.size }}"
          ACTUAL="$(sha256sum "$ASSET" | awk '{print $1}')"
          ACTUAL_SIZE="$(stat -c %s "$ASSET")"
          echo "expected sha256 $EXPECT ($EXPECT_SIZE bytes)"
          echo "actual   sha256 $ACTUAL ($ACTUAL_SIZE bytes)"
          if [ "$ACTUAL" != "$EXPECT" ] || [ "$ACTUAL_SIZE" != "$EXPECT_SIZE" ]; then
            echo "::error::PIN MISMATCH — refusing to publish. Upstream rotated the" \
                 "artifact or the download was tampered with. Verify the new APK by" \
                 "hand against index-v1.json, then bump ac_cloud-sheets/build.json" \
                 "::upstream.{version_name,version_code,apk_name,url,sha256,size}."
            exit 1
          fi
          echo "pin verified — publishing upstream bytes unmodified"

      - name: Attach to rolling GH Release
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.pin.outputs.rolling_tag }}"
          ASSET="${{ steps.pin.outputs.asset }}"
          # Sidecar sha256 — the pin verify step above already proved this is
          # the pinned upstream digest, so re-use it rather than re-hash. A
          # same-size collision on 2026-08-30 made two distinct APK builds
          # compare "equal" under the old size-only update check, silently
          # hiding a real update; the in-app updater now compares this
          # digest instead, so every publish path must emit + verify it.
          echo "${{ steps.pin.outputs.sha256 }}" > "$ASSET.sha256"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" \
              --notes "Rolling release — overwritten on every main push." --latest
          fi
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
          gh release edit "$TAG" --latest >/dev/null 2>&1 || true
          local_size="$(wc -c <"$ASSET")"
          remote_size="$(gh release view "$TAG" --json assets --jq ".assets[] | select(.name==\"$(basename "$ASSET")\") | .size")"
          names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "$names" | grep -qxF "$(basename "$ASSET")" && echo "$names" | grep -qxF "$(basename "$ASSET").sha256" \
            && [ -n "$remote_size" ] && [ "$remote_size" = "$local_size" ] \
            || { echo "::error::gh-release: $(basename "$ASSET") or its .sha256 sidecar missing/size-mismatched on $TAG after upload (remote=$remote_size local=$local_size)"; exit 1; }

      - name: Push to GHCR via ORAS
        if: ${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.push_oras) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_CREATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          REF="${{ steps.pin.outputs.ref }}"
          MT="${{ steps.pin.outputs.media_type }}"
          # CREATE WITH GITHUB_TOKEN, UPDATE WITH THE AMBIENT PAT LOGIN. A GHCR
          # package's visibility is fixed at CREATION and there is no API to
          # change it later. A package created by the user-scoped PAT is
          # unlinked and PRIVATE forever; one created by this repo's
          # GITHUB_TOKEN inherits the public repo. But GITHUB_TOKEN cannot
          # UPDATE a package that is not linked to this repo, so the token is
          # chosen per PACKAGE: override the ambient login only when the
          # package does not exist yet.
          CREDS=()
          PKG="${REF##*/}"
          if [ -n "${GHCR_CREATE_TOKEN:-}" ] && command -v gh >/dev/null 2>&1 \
             && ! gh api "/user/packages/container/${PKG}" >/dev/null 2>&1; then
            echo "ghcr: ${PKG} does not exist - creating it with GITHUB_TOKEN so it inherits the repo"
            CREDS=(--username "${GITHUB_ACTOR:-diegonmarcos}" --password "${GHCR_CREATE_TOKEN}")
          fi
          # Layer title annotation comes from the filename in the file spec, so
          # the AppStore's downloader finds Cloud-Sheets.apk by title exactly as
          # it does for every built app.
          oras push "${CREDS[@]}" "$REF:latest" \
            "${{ steps.pin.outputs.asset }}:$MT" \
            --artifact-type "$MT" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.version=${{ steps.pin.outputs.version }}" \
            --annotation "org.opencontainers.image.title=${{ steps.pin.outputs.asset }}"
          oras manifest fetch "$REF:latest" --descriptor

      - name: Stamp source identity on the published assets
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh stamp "$WORK_DIR" ""
