name: "Ship → Cloud SuperApp APK (build + push to GHCR via ORAS + attach to GH Release)"

# Builds the Cloud SuperApp APK from aa_cloud-superapp/ and publishes via two
# channels — both data-driven by aa_cloud-superapp/build.json::release:
#
#   1. ORAS push as OCI artifact      → ghcr.io/<ns>/<image>:<tags>
#      Always runs on main pushes (release.ghcr.tags expanded from build.json).
#      ORAS lets us publish the raw APK as an OCI blob (not a container image)
#      so any OCI-aware tooling can pull it: oras pull, crane export, podman
#      image pull --tls-verify, etc.
#
#   2. GH Release attachment           → APK on a tagged release
#      Only fires on tag push matching release.gh_release.tag_pattern
#      (default: aa_cloud-superapp-v*). Lets phone-side install pick up
#      "latest version" via the gh-release JSON API or a fixed deep link.
#
# All registry, tag, asset-name strings live in aa_cloud-superapp/build.json —
# this workflow never hardcodes any of that. The only "knob" here is which
# build.sh subcommand to invoke; engine reads build.json for the rest.
#
# Triggers:
#   - push main on paths under aa_cloud-superapp/  → build + oras push :latest + :sha
#   - push tag `aa_cloud-superapp-v*`              → build + oras push :latest + :sha + :version + gh release
#   - workflow_dispatch                            → manual, same as main push

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        required: false
        type: choice
        default: "debug"
        options:
          - debug
          - release
      push_oras:
        description: "Push APK to GHCR via ORAS"
        required: false
        type: boolean
        default: true
      # DEFAULT TRUE, because "manual, same as main push" (above) has to mean
      # it. A main push publishes the rolling `latest` release — which is the
      # only thing the in-app updater ever downloads — and this defaulted to
      # false, so a manual dispatch built an APK, uploaded it as a workflow
      # artifact nobody installs, and exited GREEN having shipped nothing.
      # Worse, `concurrency: cancel-in-progress` is keyed on the ref, so a
      # dispatch fired seconds after a push CANCELS the push run that would
      # have published, and replaces it with one that does not. That is exactly
      # how commit ffe5b157c went green at 08:41 on 2026-09-05 while the served
      # asset stayed at the previous day's build (run 33955960648 cancelled run
      # 33955954081; "Publish to GitHub Releases" = skipped).
      #
      # No tag context is needed: the engine's rolling mode creates/updates the
      # `latest` release on any ref. Set this to false only to deliberately
      # build without publishing — the verify step below then says so loudly.
      create_release:
        description: "Publish to the rolling `latest` GitHub Release (what devices download)"
        required: false
        type: boolean
        default: true
  push:
    branches: [main]
    tags:
      - "aa_cloud-superapp-v*"
    paths:
      # MANAGED by cloud-android-ship-repo-workflow-engine.sh: every dir
      # aa_cloud-superapp/build.json::modules declares is added automatically, dead
      # entries are dropped, and cloud-android-source-identity.sh hashes
      # exactly this list — so nothing can trigger a build the publish
      # gate does not weigh. Extra entries no module map can express
      # (settings.gradle.kts references, scan roots) are kept: add them
      # here and they stay.
      - "1_cicd/src/cicd/ship-cloud-superapp.yml"
      - "aa_cloud-superapp/**"
      - "ab_cloud-libs-shared/libs/analytics/**"
      - "ab_cloud-libs-shared/libs/appstore/**"
      - "ab_cloud-libs-shared/libs/battery/**"
      - "ab_cloud-libs-shared/libs/chat/**"
      - "ab_cloud-libs-shared/libs/core/**"
      - "ab_cloud-libs-shared/libs/datamanager/**"
      - "ab_cloud-libs-shared/libs/devtools/**"
      - "ab_cloud-libs-shared/libs/feed/**"
      - "ab_cloud-libs-shared/libs/fin/**"
      - "ab_cloud-libs-shared/libs/firewall/**"
      - "ab_cloud-libs-shared/libs/health/**"
      - "ab_cloud-libs-shared/libs/kde-connect/**"
      - "ab_cloud-libs-shared/libs/launcher-apptabs/**"
      - "ab_cloud-libs-shared/libs/launcher-onehand/**"
      - "ab_cloud-libs-shared/libs/launcher-zoomies/**"
      - "ab_cloud-libs-shared/libs/mail/**"
      - "ab_cloud-libs-shared/libs/net/**"
      - "ab_cloud-libs-shared/libs/ops/**"
      - "ab_cloud-libs-shared/libs/search/**"
      - "ab_cloud-libs-shared/libs/shizuku-adb-debug-tools/**"
      - "ab_cloud-libs-shared/libs/updater/**"
permissions:
  contents: write   # for gh release create + tag push reads
  packages: write   # for ghcr push (oras)

concurrency:
  group: ship-cloud-superapp-${{ github.ref }}
  cancel-in-progress: true

env:
  WORK_DIR: aa_cloud-superapp

jobs:
  build_and_publish:
    name: "Build APK + Push (${{ matrix.abi }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One job per ABI variant (build.json::release.variants[].id). arm64 is
      # the canonical phone build; x86_64 is for Waydroid / desktop emulators.
      # fail-fast: false so an x86_64 hiccup never blocks the arm64 release.
      fail-fast: false
      matrix:
        abi: [arm64, x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so build.sh can `git rev-parse`

      # Publish-if-changed gate. Android builds are not byte-reproducible, so a
      # rebuild of unchanged source published different bytes, a different
      # sha256 sidecar and a different OCI digest — and the Constellation store
      # compares exactly those, so every cascade rebuild showed up on every
      # phone as an update with nothing in it. The gate hashes this app's build
      # INPUTS (git tree shas of the app dir, the shared lib dirs its build.json
      # module map declares, and this workflow) and compares that identity to
      # the <asset>.source sidecar already on the release. Equal → the whole
      # rest of this job is skipped and the release asset is left untouched.
      - name: Publish gate (skip when source unchanged)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh check "$WORK_DIR" "${{ matrix.abi }}"

      - name: Set up JDK 17
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.gate.outputs.skip != 'true'
        uses: android-actions/setup-android@v3
        with:
          # Pre-install the two native toolchains the build needs, so AGP
          # never races to install them lazily during parallel per-ABI native
          # tasks (corrupt-zip flake). Versions MUST match each module's
          # build.gradle + aa_cloud-superapp/{build.json::toolchain,flake.nix}:
          #   • cmake;3.22.1 + ndk;26.1.10909125 — libs:net (libwg-go.so).
          #   • ndk;28.0.13004108              — libs:keyboard (HeliBoard
          #     libjni_latinime.so, ndk-build).
          # platforms;android-36 + build-tools;36.0.0 added for the HeliBoard
          # bump (AGP 8.13.2 / Kotlin 2.3.20 / compileSdk 36). 35/34/26 kept for
          # the rest of the modules + NDK-side builds that still target them.
          packages: "platforms;android-36 platforms;android-35 platforms;android-34 platforms;android-26 build-tools;36.0.0 build-tools;35.0.0 build-tools;34.0.0 platform-tools cmake;3.22.1 ndk;28.0.13004108 ndk;26.1.10909125"

      - name: Set up Gradle 8.14 (cached)
        if: steps.gate.outputs.skip != 'true'
        # v6, not v3: v3 bundles the old @actions/cache client, which talks to the
        # cache service GitHub retired. Every save AND restore 400s ("Our services
        # aren't available right now"), so the Gradle distribution, the dependency
        # cache and the build cache were all discarded every run — org.gradle.caching
        # was on and had nowhere to persist, and every build ran fully cold.
        uses: gradle/actions/setup-gradle@v6
        with:
          # Pin to build.json::toolchain.gradle. Bumped 8.10.2 -> 8.14 for the
          # HeliBoard toolchain (AGP 8.13.2 needs Gradle 8.13+; Kotlin 2.3.20
          # Compose-compiler plugin). Mirrors HeliBoard main's wrapper.
          gradle-version: "8.14"

      # ── ONE shared Cloud-constellation signing key (vault) ──────────────
      # ALL constellation apps (Cloud-Comms hub+forks, Cloud-Nav, Cloud-IDE,
      # Cloud-SuperApp) sign with the SAME key so cross-app signature-IPC + the
      # in-app fleet updater never hit a signature mismatch. The raw keystore +
      # its sops-encrypted passwords live ONLY in the private vault repo:
      #   A0_keys/providers/android/release.jks (OU=Cloud Constellation)
      #   A0_keys/providers/android/signing.secrets.yaml
      # build.sh::_resolve_signing reads $VAULT_DIR + sops-decrypts (SOPS_AGE_KEY)
      # and exports ANDROID_KEYSTORE_* which the gradle signingConfig reads.
      # NO fallback: if the key is unavailable build.sh exits 1 (desired).
      - name: Checkout vault (shared Android signing key)
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault

      - name: Install ORAS + sops + gh CLI + jq
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
          # gh CLI is preinstalled on ubuntu-latest; verify.
          command -v gh
          # ORAS install (single binary).
          curl -fsSL https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz \
            | sudo tar -C /usr/local/bin -xzf - oras
          oras version
          # sops — build.sh::_resolve_signing needs it to decrypt the shared key.
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64 \
            | sudo tee /usr/local/bin/sops >/dev/null
          sudo chmod +x /usr/local/bin/sops
          sops --version

      - name: Determine variant
        if: steps.gate.outputs.skip != 'true'
        id: variant
        run: |
          if   [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "variant=${{ inputs.variant }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      # ── Build via build.sh (engine) ─────────────────────────────────
      # BYPASS_NIX=1 because GHA already provides JDK + SDK + Gradle —
      # devShell would just re-download them. The engine still reads
      # build.json + build.gradle for everything else (toolchain pins,
      # module graph, registry config, tags).
      - name: Build APK (engine)
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          # Shared Cloud-constellation signing key (vault checkout above).
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          # SUPERAPP_VARIANT selects the ABI variant (build.json::release
          # .variants[].id) → engine overrides ABI filter + artifact name.
          SUPERAPP_VARIANT: ${{ matrix.abi }}
          # app/build.gradle shells out to `gh run list` at gradle config
          # phase to bake recent CI run durations into BuildConfig
          # (Configs → About → Stack: "Build avg time" + "Build last").
          # Without this token gh runs unauthenticated → returns empty,
          # the fields fall back to -1, the UI shows "—".
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x build.sh
          if [ "${{ steps.variant.outputs.variant }}" = "release" ]; then
            ./build.sh release
          else
            ./build.sh build
          fi
          ls -la dist/

      - name: Upload APK as workflow artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Cloud-SuperApp-${{ matrix.abi }}-${{ steps.variant.outputs.variant }}-${{ github.sha }}
          path: ${{ env.WORK_DIR }}/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # ── ORAS push to GHCR (engine reads build.json::release.ghcr) ──
      - name: Login to GHCR
        if: ${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.push_oras) }}
        run: |
          echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push APK to GHCR via ORAS
        if: ${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.push_oras) }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          SUPERAPP_VARIANT: ${{ matrix.abi }}
          GITHUB_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_CREATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.sh oras-push

      # Whether anyone else can actually pull what we just pushed. The push
      # itself says nothing about it: visibility is decided when the package is
      # CREATED and inherited silently forever after, so this is the one cheap
      # moment to find out. A warning, not a failure — the APK is also on the
      # GH release, which is public by construction, so a private mirror
      # degrades the install route without breaking it.
      - name: Is the GHCR package publicly pullable
        if: ${{ always() && steps.gate.outputs.skip != 'true' }}
        continue-on-error: true
        run: sh 1_cicd/dist/scripts/cloud-android-ghcr-visibility.sh diegonmarcos cloud-superapp

      # ── GitHub Release (engine reads build.json::release.gh_release) ──
      # Always runs — the engine publishes a rolling release tagged
      # `latest` (so /releases/latest/download/Cloud-SuperApp.apk is a
      # stable URL the linktree footer points at). The engine ALSO
      # creates the immutable per-tag release when it detects a tag
      # push (GITHUB_REF starts with refs/tags/). Don't try to clear
      # GITHUB_REF_NAME with an empty string here — GitHub Actions
      # re-injects the runner's default for that variable even when a
      # step's env: block sets it to '', which would falsely trigger
      # the per-tag branch on every main push and create a stray
      # "main"-tagged release.
      - name: Publish to GitHub Releases
        id: publish
        if: ${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.create_release) }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          SUPERAPP_VARIANT: ${{ matrix.abi }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: ./build.sh gh-release

      # A GREEN RUN THAT SHIPPED NOTHING IS THE WORST POSSIBLE OUTCOME, and it
      # is how the 2026-09-05 update deadlock formed: the publish step above was
      # SKIPPED (a workflow_dispatch with create_release defaulting to false,
      # which had also cancelled the push run that would have published), every
      # other step succeeded, and the run reported success while devices kept
      # being served the previous day's APK. A skipped step is not a failure to
      # GitHub, so it has to be one to us.
      #
      # The engine itself reads the asset back off the release and compares it
      # to the local file (build.sh::_verify_release_asset), so a publish that
      # RAN is already proven. The only hole left is a publish that did not run
      # at all — which is precisely what happened — so that is what this closes.
      - name: A run that published nothing must not be green
        if: ${{ always() && steps.gate.outputs.skip != 'true' }}
        run: |
          if [ "${{ steps.publish.outcome }}" = "success" ]; then
            echo "publish: ok — the rolling release carries this run's APK"
            exit 0
          fi
          echo "::error title=Nothing was published::The 'Publish to GitHub Releases' step did" \
               "not succeed (outcome=${{ steps.publish.outcome }}). Devices are still being" \
               "served the PREVIOUS APK, so this run built something nobody can install."
          exit 1

      - name: Stamp source identity on the published assets
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh stamp "$WORK_DIR" "${{ matrix.abi }}"
