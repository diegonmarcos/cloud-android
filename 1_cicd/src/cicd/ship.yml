name: ship

on:
  push:
    branches: [main]
    paths:
      - 'a_solutions/**'
      - '9_others/src/**'
      - 'config.json'
  workflow_dispatch:
    inputs:
      solution:
        description: 'Solution to ship (empty = auto-detect from diff)'
        required: false
        type: string

concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      solutions: ${{ steps.diff.outputs.solutions }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, submodules: recursive }

      - id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.solution }}" ]; then
            echo "solutions=[\"${{ github.event.inputs.solution }}\"]" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} || true)
          list=$(echo "$changed" | awk -F/ '/^a_solutions\//{print $2}' | sort -u | jq -R . | jq -sc .)
          [ -z "$list" ] || [ "$list" = "[]" ] && list='[]'
          echo "solutions=$list" >> "$GITHUB_OUTPUT"

  ship:
    needs: detect
    if: needs.detect.outputs.solutions != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        solution: ${{ fromJSON(needs.detect.outputs.solutions) }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - uses: ./.github/actions/setup-deps

      - name: Setup SOPS age key
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          mkdir -p ~/.config/sops/age
          echo "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt

      - name: Build + sign ${{ matrix.solution }}
        run: ./build.sh build ${{ matrix.solution }} && ./build.sh secrets ${{ matrix.solution }} || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.solution }}-dist
          path: a_solutions/${{ matrix.solution }}/dist/
          if-no-files-found: warn
