<!doctype html><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Watchdog</title>
<style>
@charset "UTF-8";
:root {
  --bg: #0b0e14;
  --lift: #101520;
  --rule: #171c26;
  --dim: #3a3e4a;
  --floor: #404040;
  --label: #788091;
  --accent: #78c8ff;
  --ok: #40dc78;
  --warn: #f0de40;
  --bad: #f04848;
  --fg: #c8ccd4;
  --w: 272px;
}


body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: ui-monospace, "JetBrainsMono Nerd Font", "JetBrains Mono", "FiraCode Nerd Font", "Fira Code", "Cascadia Code", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
  font-size: 13px;
  line-height: 1.55;
  font-variant-ligatures: none;
  font-feature-settings: "liga" 0, "calt" 0;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}

body::before, body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
}

body::before {
  z-index: 98;
  background: radial-gradient(130% 100% at 50% 42%, transparent 52%, rgba(0, 0, 0, 0.62) 100%), radial-gradient(90% 60% at 50% 0%, rgba(120, 200, 255, 0.045), transparent 70%);
}

body::after {
  z-index: 99;
  opacity: 0.55;
  background: repeating-linear-gradient(180deg, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px);
}


@media (prefers-reduced-motion: reduce) {
  body::after {
    display: none;
  }


@media (min-width: 1000px) {
  :root:not([data-view=mobile]) .ham, :root:not([data-view=mobile]) .scrim, :root:not([data-view=mobile]) .x {
    display: none;
  }

  :root:not([data-view=mobile]) .sidebar {
    transform: none;
  }

  :root:not([data-view=mobile]) .content {
    margin-left: var(--w);
    padding-top: 18px;
  }


.panel-body {
  padding: 16px 13px 13px;
}


.tui {
  margin: 0;
  padding: 4px 6px;
  white-space: pre;
  overflow-x: auto;
  line-height: 1.18;
  font-size: 12px;
  letter-spacing: 0;
  color: var(--fg);
  background: var(--bg);
  tab-size: 8;
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}


[data-view=mobile] .tui {
  font-size: min(2.6vw, 11px);
  padding: 2px;
  line-height: 1.15;
}

[data-view=mobile] .panel-body {
  padding: 14px 9px 10px;
}


.tui-wrap {
  display: flex;
  justify-content: center;
  padding: 0 0 18px;
}


.tui {
  border: 0;
  padding: 10px 14px;
  border-radius: 6px;
  background: var(--bg);
  box-shadow: 0 0 0 1px var(--rule), 0 18px 40px rgba(0, 0, 0, 0.45);
  user-select: text;
}


@media print {
  body::before, body::after {
    display: none;
  }

  .tui {
    box-shadow: none;
    padding: 0;
  }

  .tui-wrap {
    padding: 0;
  }

[data-view=mobile] .appbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 70;
  height: calc(var(--appbar) + var(--safe-t));
  padding: var(--safe-t) 8px 0;
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--lift);
  border-bottom: 1px solid var(--dim);
  box-shadow: 0 1px 0 rgba(0, 0, 0, 0.4);
}

[data-view=mobile] .appbar .t {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

[data-view=mobile] .appbar .age {
  margin-left: auto;
  font-size: 11px;
  color: var(--label);
}

[data-view=mobile] .appbar .zoom {
  background: none;
  border: 1px solid var(--dim);
  border-radius: 6px;
  color: var(--label);
  font: inherit;
  font-size: 11px;
  min-width: 44px;
  min-height: 36px;
  padding: 0 10px;
  cursor: pointer;
}

[data-view=mobile] .appbar .zoom[aria-pressed=true] {
  color: var(--bg);
  background: var(--accent);
  border-color: var(--accent);
}

[data-view=mobile] .tui-wrap {
  padding: 0 0 calc(var(--safe-b) + 16px);
  overflow: hidden;
}

[data-view=mobile] .tui {
  padding: 6px;
  box-shadow: none;
  border-radius: 0;
  transform-origin: top left;
}

[data-view=mobile].zoom1 .tui-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

[data-view=mobile].zoom1 .tui {
  transform: none !important;
  font-size: 11px;
}
/* ── the app IS the panel ───────────────────────────────────────────────────
   Every part of this page is drawn in the language the CLI uses, because the
   thing it wraps is a transcript of that CLI and a chrome in a different
   idiom makes the screen look like two products stapled together.

   So: box-drawing frames rather than Material bars, a title inlaid into the
   top edge the way draw::bbox does it, reverse video for the pressed state
   the way a terminal marks a selection, and one monospace stack throughout.
   Nothing here is a rounded card, a shadow, or a ripple. */
html, body {
  height: 100%; margin: 0; background: #0b0e14; color: #c8ccd4;
  font-family: ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", monospace;
  font-variant-ligatures: none; overflow: hidden;
  -webkit-text-size-adjust: 100%;
}

/* The top line, framed like a box's upper edge with the name inlaid into it.
   Fixed because the transcript scrolls under it. */
#bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 9;
  padding-top: env(safe-area-inset-top, 0px);
  display: flex; align-items: center; gap: 10px;
  padding-left: 10px; padding-right: 10px; height: calc(44px + env(safe-area-inset-top, 0px));
  background: #0b0e14; border-bottom: 1px solid #3a3e4a;
}
#bar b {
  color: #78c8ff; font-size: 13px; font-weight: 700;
  text-shadow: 0 0 8px rgba(120, 200, 255, .35);
}
/* ┤ ├ around the name, exactly as bbox() brackets a title into its border. */
#bar b::before { content: "\2524"; color: #3a3e4a; font-weight: 400; text-shadow: none; }
#bar b::after  { content: "\251C"; color: #3a3e4a; font-weight: 400; text-shadow: none; }
#bar .s { margin-left: auto; font-size: 11px; color: #788091; }
/* The blinking block the panel's own command line ends in. */
#bar .s::after { content: "\00a0\2588"; color: #78c8ff; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
@media (prefers-reduced-motion: reduce) { #bar .s::after { animation: none } }

#bar button {
  background: none; border: 1px solid #3a3e4a; color: #788091;
  font: inherit; font-size: 11px; padding: 0 10px;
  min-width: 44px; min-height: 32px; cursor: pointer;
  border-radius: 0;                    /* terminals have corners, not radii */
}
#bar button:active { background: #78c8ff; color: #0b0e14; border-color: #78c8ff; }
#bar #env { color: #78c8ff; }
#bar #retry { color: #f0de40; border-color: #5c5423; }

/* The transcript sits between them, unframed: it brings its own borders. */
#view {
  position: absolute; left: 0; right: 0;
  top: calc(44px + env(safe-area-inset-top, 0px)); bottom: 0;
  overflow: auto; -webkit-overflow-scrolling: touch; padding: 4px;
}
#view .tui { margin: 0; padding: 0; box-shadow: none; border-radius: 0; }
#msg {
  padding: 14px; color: #f0de40; white-space: pre-wrap;
  font: inherit; font-size: 12px; line-height: 1.5;
}

/* ── the key rows ──────────────────────────────────────────────────────────
   A framed box like every other box on the screen, with its title inlaid, and
   keys that look like cells rather than buttons. Pressed is reverse video —
   what a terminal does to mark a selection — not a colour wash. */
#keys {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
  background: #0b0e14; border-top: 1px solid #3a3e4a;
  padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px));
}
#keys::before {
  content: "\2524keys\251C"; position: absolute; top: -8px; left: 12px;
  background: #0b0e14; padding: 0 3px; font-size: 11px; color: #78c8ff;
}
#keys .row { display: flex; gap: 3px; margin: 3px 0; }
#keys button {
  flex: 1; min-height: 38px; padding: 0 2px;
  background: #0b0e14; color: #c8ccd4; border: 1px solid #3a3e4a;
  border-radius: 0; font: inherit; font-size: 11px;
}
#keys button:active { background: #78c8ff; color: #0b0e14; border-color: #78c8ff; }
/* The action row is the one that changes the machine, so it carries the
   accent the panel gives its own act menus. */
#keys .row[data-t="act"] button { color: #78c8ff; }
#keys .row[data-t="sort"] button,
#keys .row[data-t="view"] button { color: #788091; }

/* Off-screen but focusable: focusing it raises the soft keyboard, and every
   character typed goes down the same pipe as the buttons. */
#sink { position: fixed; left: -9999px; width: 1px; height: 1px; opacity: 0; }
</style>
<div id="bar"><b>watchdog</b><span class="s" id="age">connecting…</span>
<button id="retry" type="button" hidden>retry</button>
<button id="env" type="button">env</button><button id="kb" type="button">keys</button></div>
<!-- THE SHELL IS NOT THE DATA. Everything here exists before the first byte
     comes back over ssh: the bar, the key rows, the frame. A terminal that
     appears only once a remote command has answered looks broken for the whole
     second it takes, and looks permanently broken when the answer never comes.
     The skeleton is dimmed box-drawing so the shape of what is loading is
     already right, rather than a spinner that shows nothing about the page. -->
<div id="view"><pre class="tui" id="skel"></pre></div>

<!-- Every key the CLI binds, reachable by thumb. The LABELS are a convenience
     for a touchscreen; the app still sends only a key name and the panel's own
     on_key decides what it means, so this bar can never disagree with the CLI
     about behaviour — only about which keys it bothers to show. Anything not
     here is still typeable from the soft keyboard. -->
<div id="keys" hidden>
  <div class="row" data-t="tabs">
    <button data-k="p">proc</button><button data-k="o">ctr</button>
    <button data-k="f">fleet</button><button data-k="W">fw</button>
    <button data-k="L">logs</button><button data-k="y">hist</button>
    <button data-k="F">files</button><button data-k="b">about</button>
  </div>
  <div class="row" data-t="subs">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
  </div>
  <div class="row" data-t="act">
    <button data-k="k">k act</button><button data-k="x">x opt</button>
    <button data-k="enter">enter</button><button data-k="esc">esc</button>
    <button data-k="v">v</button><button data-k=":">:</button>
    <button data-k="m">menu</button><button data-k="h">help</button>
  </div>
  <div class="row" data-t="exp">
    <button data-k="E">E export</button><button data-k="A">A all</button>
    <button data-k="o">o open</button><button data-k=".">. dot</button>
  </div>
  <div class="row" data-t="move">
    <button data-k="up">↑</button><button data-k="down">↓</button>
    <button data-k="left">←</button><button data-k="right">→</button>
    <button data-k="tab">tab</button><button data-k="backtab">⇧tab</button>
    <button data-k="pgup">pgup</button><button data-k="pgdn">pgdn</button>
    <button data-k="home">home</button><button data-k="end">end</button>
  </div>
  <!-- Every column SORT_KEYS binds, not the four that happened to fit: a bar
       that shows half the sorts teaches that the other half do not exist. -->
  <div class="row" data-t="sort">
    <button data-k="c">cpu</button><button data-k="M">mem</button>
    <button data-k="d">disk</button><button data-k="n">name</button>
    <button data-k="e">net</button><button data-k="g">runq</button>
    <button data-k="s">slice</button><button data-k="u">user</button>
  </div>
  <div class="row" data-t="view">
    <button data-k="i">invert</button><button data-k="w">window</button>
    <button data-k="a">auto</button><button data-k="r">refresh</button>
  </div>
</div>
<input id="sink" autocapitalize="off" autocorrect="off" spellcheck="false">
<script>
// The grid is MEASURED, never assumed: a monospace cell is whatever this
// device's font makes it, and asking for a width the screen does not have is
// how a terminal ends up clipped or shrunk into a texture.
function cell() {
  const p = document.createElement('pre');
  p.className = 'tui';
  p.style.cssText = 'position:absolute;visibility:hidden';
  p.textContent = 'M'.repeat(100);
  document.body.appendChild(p);
  const r = p.getBoundingClientRect();
  p.remove();
  return { w: (r.width / 100) || 7, h: r.height || 14 };
}
function grid() {
  const v = document.getElementById('view'), c = cell();
  return [Math.max(40, Math.floor((v.clientWidth - 12) / c.w)),
          Math.max(20, Math.floor((v.clientHeight - 12) / c.h))];
}

// Frames are PUSHED, not polled: the panel emits one per key and one per tick,
// so the page paints what arrives rather than deciding when a screen is ready.
window.__wdEvent = function (kind, payload) {
  const view = document.getElementById('view');
  if (kind === 'frame') {
    view.innerHTML = payload;
    document.getElementById('age').textContent = new Date().toLocaleTimeString();
    showEnv();
  } else if (kind === 'error') {
    // Into the view only — the bar and the key rows stay where they are, so a
    // failed connect leaves a usable app rather than an error page. Retrying
    // is then one tap instead of a relaunch.
    document.getElementById('retry').hidden = false;
    view.innerHTML = '<div id="msg"></div>';
    // Verbatim: "cannot connect" and "command not found" send you to two
    // different places, and collapsing them into "error" helps nobody.
    // The app carries its own panel, so reaching this at all means the local
    // one could not run AND every terminal was unreachable. Say which of those
    // it was — the key only matters for the second.
    const envs = JSON.parse(AndroidWatchdog.backends());
    view.firstChild.textContent = payload +
      '\n\ntried: ' + Object.keys(envs).join(', ') +
      (envs.local ? '' :
        '\n\nthis build carries no panel for this device, so it needs a terminal') +
      '\n\nadd this to ~/.ssh/authorized_keys in the env you use:\n\n' + AndroidWatchdog.publicKey();
    document.getElementById('age').textContent = 'unreachable';
  } else if (kind === 'closed') {
    document.getElementById('age').textContent = 'panel exited';
  }
};

// A skeleton the size of the grid we are about to ask for, so the page does
// not jump when the real screen replaces it.
function skeleton() {
  const el = document.getElementById('skel');
  if (!el) return;
  const [c, r] = grid();
  const bar = '\u2500'.repeat(Math.max(10, c - 2));
  const mid = (t) => '\u2502' + t.padEnd(Math.max(8, c - 2)) + '\u2502';
  const rows = ['\u256d' + bar + '\u256e'];
  for (let i = 0; i < Math.max(3, r - 4); i++) rows.push(mid(i === 1 ? '   waiting for the panel…' : ''));
  rows.push('\u2570' + bar + '\u256f');
  el.textContent = rows.join('\n');
  el.style.color = '#3a3e4a';
}

const send = k => AndroidWatchdog.key(k);

// Which env we are on, shown once connected. This is the env that ANSWERED,
// not the one preferred — the app falls back, so those differ exactly when it
// matters to know.
function showEnv() {
  const a = AndroidWatchdog.activeBackend();
  document.getElementById('env').textContent = a || 'env';
}

// Tap to pin the next env in the list. A pin, not a switch: the panel is a
// process on the far side, so changing it restarts the session rather than
// re-pointing a live one and stranding the old process there.
document.getElementById('env').onclick = () => {
  const all = Object.keys(JSON.parse(AndroidWatchdog.backends()));
  if (all.length < 2) return;
  const cur = AndroidWatchdog.activeBackend();
  const next = all[(Math.max(0, all.indexOf(cur)) + 1) % all.length];
  AndroidWatchdog.setBackend(next);
  document.getElementById('env').textContent = next + '…';
  document.getElementById('age').textContent = 'reconnecting';
  const [c, r] = grid();
  AndroidWatchdog.start(c, r);
};

// The key bar. One listener on the container, so adding a button is markup.
document.getElementById('keys').addEventListener('click', e => {
  const b = e.target.closest('button[data-k]');
  if (b) { send(b.dataset.k); e.preventDefault(); }
});
document.getElementById('kb').onclick = () => {
  const k = document.getElementById('keys');
  k.hidden = !k.hidden;
  // The hidden input is what makes a real keyboard usable: focusing it brings
  // up the soft keyboard, and every character it receives goes straight down
  // the same pipe as the buttons.
  if (k.hidden) document.getElementById('sink').blur();
  else document.getElementById('sink').focus();
  fit();
};

// A physical or soft keyboard, forwarded by NAME. The panel wants "up", not an
// escape sequence, and a WebView already reports names — so nothing here has
// to know how a terminal encodes anything.
const NAMED = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
                Enter:'enter', Escape:'esc', Tab:'tab', Backspace:'backspace',
                PageUp:'pgup', PageDown:'pgdn', Home:'home', End:'end', ' ':'space' };
addEventListener('keydown', e => {
  const n = NAMED[e.key] || (e.key.length === 1 ? e.key : null);
  if (!n) return;
  if (e.shiftKey && e.key === 'Tab') { send('backtab'); e.preventDefault(); return; }
  send(n);
  e.preventDefault();
});

function fit() {
  const [c, r] = grid();
  AndroidWatchdog.resize(c, r);
}
// Auto-refresh, the frame's own `a` loop. 2s is the sampler's interval; asking
// faster would redraw the same numbers.
setInterval(() => AndroidWatchdog.tick(), 2000);
let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(fit, 250); });

document.getElementById('retry').onclick = () => {
  document.getElementById('retry').hidden = true;
  document.getElementById('age').textContent = 'connecting…';
  skeleton();
  const [c, r] = grid();
  AndroidWatchdog.start(c, r);
};

skeleton();
const [c0, r0] = grid();
AndroidWatchdog.start(c0, r0);
</script>
