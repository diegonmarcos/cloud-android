// Settings — the gradle module graph, data-driven from build.json::modules
// (FIRE rule 6: never hardcode lists). The only non-app module is
// libs:watchdog, shared BY REFERENCE from ab_cloud-libs-shared via its app  build.json  settings.gradle,
// so the ssh bridge is one implementation and not a copy per app.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "cloud-watchdog"

def buildJson = new groovy.json.JsonSlurper().parse(file('build.json'))
buildJson.modules.each { name, _spec ->
    if (name.startsWith('_')) return  // skip _doc keys
    include ":${name}"
    // Map gradle path :libs:foo -> libs/foo/  (vs. :app -> app/), unless the
    // module declares a `dir` in build.json. `dir` is how a module is SHARED by
    // reference instead of copy-pasted: the module lives once in
    // aa_cloud-superapp/libs/ and every app points at that one directory, so a
    // fix lands in all of them at build time and copies cannot drift.
    def path = _spec?.dir ?: name.replace(':', '/')
    project(":${name}").projectDir = file(path)
}
