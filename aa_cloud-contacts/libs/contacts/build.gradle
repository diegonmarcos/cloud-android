plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// The channel registry is baked into THIS module now, not only the app's
// BuildConfig: ContactsEngine ships inside Cloud-Lib-Contacts.apk and cannot
// see the app's. '../../build.json' resolves against this module's own
// directory, so it stays ea_cloud-contacts/build.json whether the module is
// built by the app or shared by reference into ea_cloud-libs.
def buildJson   = new groovy.json.JsonSlurper().parse(file('../../build.json'))
def channelsB64 = groovy.json.JsonOutput.toJson(buildJson.channels?.registry ?: [])
                        .bytes.encodeBase64().toString()

android {
    namespace 'com.diegonmarcos.superapp.contacts'
    compileSdk 36

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
        buildConfigField "String", "CHANNELS_B64", "\"${channelsB64}\""
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // api: ContactsBackendService extends core's DataBackendService.
    api project(':libs:core')

    implementation 'androidx.core:core-ktx:1.13.1'
}
