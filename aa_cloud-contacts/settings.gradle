// Settings — gradle module graph.
// Data-driven from build.json::modules (FIRE RULE #6: never hardcode lists).
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "cloud-contacts"

def buildJson = new groovy.json.JsonSlurper().parse(file('build.json'))
buildJson.modules.each { name, _spec ->
    if (name.startsWith('_')) return
    include ":${name}"
    // Map gradle path :libs:foo → libs/foo/, unless the module declares a `dir`
    // in build.json. `dir` is how a module is SHARED by reference instead of
    // copy-pasted: libs:core and libs:updater live once in ea_cloud-superapp/
    // libs/ and every app points at that one directory, so a fix lands in all
    // of them at build time and copies cannot drift.
    def path = _spec?.dir ?: name.replace(':', '/')
    project(":${name}").projectDir = file(path)
}
