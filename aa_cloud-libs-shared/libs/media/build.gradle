// libs:media — Sticker + GIF panel for the vendored keyboard's emoji surface.
// Self-contained, lives OUTSIDE libs/keyboard/src/main so `build.sh
// sync-heliboard` (rsync --delete mirror of upstream HeliBoard) never
// clobbers it — same rule as libs:translate / libs:voice.
//
// libs:keyboard depends on this module; patch 0007 hosts MediaPanelView
// inside EmojiPalettesView and routes picks through the existing
// RichInputConnection.commitContent path. GIF search is data-driven
// (Tenor OR Giphy, chosen in build.json::keyboard_media; API keys via
// vault/sops → BuildConfig, pushed in at runtime by App → MediaRuntime).
// Stickers come from installed WhatsApp-compatible packs (content provider).

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.diegonmarcos.superapp.media'
    compileSdk 36
    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig false }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Image loading — Coil handles remote thumbnails AND animated GIF/WebP
    // frames (the reason we can't hand-roll it: minSdk 26 predates
    // ImageDecoder's animated support at 28). coil-gif adds the decoders.
    implementation 'io.coil-kt:coil:2.7.0'
    implementation 'io.coil-kt:coil-gif:2.7.0'
    // ponytail: GIF providers use HttpURLConnection + org.json (both in the
    // Android SDK) instead of pulling OkHttp/Retrofit for two GET calls.
}
