// libs:voice — light VOICE-INPUT module: VoiceBarView UI + AudioRecord capture +
// VoiceEngineClient/VoiceEngines interface + VoiceModelManager (model download).
// NO Vosk / libvosk.so dependency here — the heavy engine lives in libs:voice-vosk
// (companion APK only). cloud-keyboard includes ONLY this module, keeping libvosk.so
// out of the keyboard APK (~33 MB saved across the 4 ABI slices in the AAR).
//
// libs:keyboard depends on this module; LatinIME's VOICE_INPUT key calls VoiceBarView.
// VoiceBarView delegates recognition to VoiceEngines.client (set at Application.onCreate).
// Model download registry (build.json::voice.models) is baked into BuildConfig here so
// VoiceModelManager can resolve and download models regardless of which APK calls it.

import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// Data-driven model registry from build.json::voice.
// rootDir is the CONSUMING app's build.json - this module is shared by
// reference into cloud-keyboard-libs as well as superapp, and a
// module-relative path would hand every consumer superapp's registry.
// Consumers that declare no `voice` block fall back to this module's own
// repo, which owns the constellation-wide default set.
def appJson = new JsonSlurper().parse(file("${rootDir}/build.json"))
def voice = appJson.voice ?: new JsonSlurper().parse(file('../../build.json')).voice
def voiceModelsJson = JsonOutput.toJson(voice.models)
def voiceModelsB64 = voiceModelsJson.bytes.encodeBase64().toString()
def voiceDefaultLang = voice.default_language
def voiceTranslateTo = voice.translate_to
def voiceTranslateTargets = voice.translate_targets.join(',')

android {
    namespace 'com.diegonmarcos.superapp.voice'
    compileSdk 36
    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
        // Baked from build.json::voice — VoiceModelManager reads these at runtime.
        buildConfigField "String", "VOICE_MODELS_B64", "\"${voiceModelsB64}\""
        buildConfigField "String", "VOICE_DEFAULT_LANGUAGE", "\"${voiceDefaultLang}\""
        buildConfigField "String", "VOICE_TRANSLATE_TO", "\"${voiceTranslateTo}\""
        buildConfigField "String", "VOICE_TRANSLATE_TARGETS", "\"${voiceTranslateTargets}\""
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'

    // Translate button in the dictation box (VoiceBarView) reuses the engine
    // from libs:translate — same as before the split.
    implementation project(':libs:translate')

    // NO Vosk here. libvosk.so lives ONLY in libs:voice-vosk (companion APK).
}
