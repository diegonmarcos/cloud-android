# ╔═══════════════════════════════════════════════════════════════════════╗
# ║ Test → Cloud Nav (emulator UI render test)                             ║
# ║                                                                        ║
# ║ Runs the instrumented suite (engine: ./build.sh instrument) on a REAL  ║
# ║ x86_64 API-34 emulator. Exists because the Explored tab shipped broken ║
# ║ four times on static review alone — ExploredRenderTest seeds the demo  ║
# ║ trip, launches the app, opens Timeline → Explored, and asserts the     ║
# ║ city pins are both plumbed into the map source AND actually rendered   ║
# ║ by the GL layer, then screenshots the screen for human inspection      ║
# ║ (uploaded as the `explored-render` artifact alongside full logcat).    ║
# ╚═══════════════════════════════════════════════════════════════════════╝
name: "Test → Cloud Nav (emulator UI render test)"

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      # MANAGED by cloud-android-ship-repo-workflow-engine.sh: every dir
      # ac_cloud-nav/build.json::modules declares is added automatically, dead
      # entries are dropped, and cloud-android-source-identity.sh hashes
      # exactly this list — so nothing can trigger a build the publish
      # gate does not weigh. Extra entries no module map can express
      # (settings.gradle.kts references, scan roots) are kept: add them
      # here and they stay.
      - "1_cicd/src/cicd/test-cloud-nav.yml"
      - "ab_cloud-libs-shared/libs/analytics/**"
      - "ab_cloud-libs-shared/libs/core/**"
      - "ab_cloud-libs-shared/libs/devtools/**"
      - "ab_cloud-libs-shared/libs/maps/**"
      - "ab_cloud-libs-shared/libs/updater/**"
      - "ac_cloud-nav/**"
permissions:
  contents: read

concurrency:
  group: test-cloud-nav-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Hardware acceleration for the emulator (ubuntu-latest exposes KVM).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Mirrors ship-cloud-nav.yml — the emulator system image itself is
          # installed by the emulator-runner action below.
          packages: "platforms;android-35 platforms;android-34 platforms;android-26 build-tools;35.0.0 build-tools;34.0.0 platform-tools"

      - name: Set up Gradle 8.10.2 (cached)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.10.2"

      # Same shared Cloud-constellation signing key as ship-cloud-nav.yml —
      # connectedAndroidTest builds the debug APK, and the signing config has
      # deliberately NO fallback keystore (see app/build.gradle).
      - name: Checkout vault (shared Android signing key)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault

      - name: Install sops
        run: |
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64 \
            | sudo tee /usr/local/bin/sops >/dev/null
          sudo chmod +x /usr/local/bin/sops
          sops --version

      - name: Boot emulator + run instrumented suite (engine)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BYPASS_NIX: "1"
          CLOUDNAV_VARIANT: "x86_64"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          # app/build.gradle shells out to `gh run list` at config phase (soft-fails without).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # Explored now draws pins with a plain-View Canvas OVERLAY (not
          # MapLibre GeoJSON), which the test captures via View.draw() — works
          # under the fast headless indirect GPU regardless of GL tiling.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: ac_cloud-nav
          script: |
            rc=0
            ./build.sh instrument || rc=$?
            # Collect evidence into a WORKSPACE-relative dir — upload-artifact v4
            # only reliably uploads paths under the workspace (an absolute
            # /tmp/... path is silently dropped). The test copied the screenshot
            # to /data/local/tmp (survives the post-test uninstall).
            mkdir -p test-out
            adb pull /data/local/tmp/explored.png test-out/ || true
            adb logcat -d > test-out/logcat.txt || true
            adb logcat -d -s ExploredRenderTest:* > test-out/probe.txt || true
            exit $rc

      - name: Upload render evidence (screenshot + logcat + reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explored-render
          path: |
            ac_cloud-nav/test-out/
            ac_cloud-nav/app/build/reports/androidTests/
          if-no-files-found: warn

      # gradle connectedAndroidTest exited 0 despite a FAILING instrumented
      # test (emulator-runner masked it) — a false green that let the empty-map
      # bug ship as "verified". Gate explicitly on the JUnit XML: any
      # failure/error fails the job.
      - name: Gate on instrumented test results
        if: always()
        run: |
          shopt -s globstar nullglob
          xmls=(ac_cloud-nav/app/build/outputs/androidTest-results/**/*.xml)
          if [ ${#xmls[@]} -eq 0 ]; then echo "NO test result XML found — treating as failure"; exit 1; fi
          fails=$(grep -hoE '(failures|errors)="[0-9]+"' "${xmls[@]}" | grep -oE '[0-9]+' | awk '{s+=$1} END{print s+0}')
          echo "instrumented failures+errors = $fails across ${#xmls[@]} result file(s)"
          [ "$fails" = "0" ] || { echo "::error::instrumented tests FAILED ($fails)"; exit 1; }
