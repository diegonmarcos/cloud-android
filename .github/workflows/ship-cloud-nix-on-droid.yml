name: "Ship → Cloud Nix-on-Droid (build + attach to GH Release)"

# Independent per-app workflow for Cloud Nix-on-Droid — our fork of nix-on-droid-app.
# Engine: 1_cicd/src/scripts/cloud-nix-on-droid-fork-engine.sh (copied as ac_cloud-nix-on-droid/build.sh).
# Per-app build.json at ac_cloud-nix-on-droid/build.json.
#
# NO GHCR STEP, unlike the comms forks. A GHCR package is owned by the account
# rather than the repository and is created private whatever it was pushed
# from, so publishing here would put a private APK in a public repo. The GH
# Release asset IS the repo, so it is public by construction.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "ac_cloud-nix-on-droid/**"
      - "1_cicd/src/scripts/cloud-nix-on-droid-fork-engine.sh"
      - "1_cicd/src/cicd/ship-cloud-nix-on-droid.yml"

permissions:
  contents: write   # gh release upload

env:
  WORK_DIR: ac_cloud-nix-on-droid
  FORK: nixdroid

jobs:
  build_and_publish:
    name: "Build + publish (${{ matrix.abi }})"
    strategy:
      fail-fast: false
      matrix:
        # One job per release.variants[] entry, like every other per-ABI app
        # here. Without this the fork's own build emits ONE universal APK
        # carrying all four ABIs.
        abi: [arm64, x86_64]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Selects the release.variants[] entry: the engine exports its .abis as
      # CLOUDNAV_ABIS for gradle and names the artifact from its .gh_asset.
      CLOUDNAV_VARIANT: ${{ matrix.abi }}
      COMMS_BUNDLE_ABI: ${{ matrix.abi == 'arm64' && 'arm64-v8a' || 'x86_64' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Upstream pins its own Gradle and AGP; the wrapper in the vendored tree
      # is used, never a toolchain from here.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Checkout vault (shared Android signing key)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault

      - name: Install sops + jq
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64 \
            | sudo tee /usr/local/bin/sops >/dev/null
          sudo chmod +x /usr/local/bin/sops
          sops --version

      # Vendored in-repo: the tree is committed and has no .git, so the engine
      # reads it straight from here and never clones.
      - name: Materialize fork (vendored in-repo tree)
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
        run: |
          chmod +x build.sh
          ./build.sh materialize-fork "$FORK"

      - name: Generate build stamp
        run: echo "COMMS_BUILD_TIMESTAMP=$(date -u '+%Y%m%d.%H%M%S')" >> "$GITHUB_ENV"

      # Signed with the ONE shared constellation key. That is not cosmetic:
      # CLOUD_EXEC is a signature-level permission, so an APK signed with
      # anything else is refused the bind by every app in the fleet.
      - name: Build fork APK (upstream wrapper + constellation signing)
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          COMMS_BUILD_TIMESTAMP: ${{ env.COMMS_BUILD_TIMESTAMP }}
        run: |
          ./build.sh build-fork "$FORK"
          ls -la dist/

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloud-nixdroid-${{ matrix.abi }}-${{ github.sha }}
          path: ${{ env.WORK_DIR }}/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # Rolling 'latest': /releases/latest/download/cloud-nixdroid.apk is the
      # stable install URL the constellation points at.
      - name: Publish APK to rolling 'latest' release (stable install URL)
        if: ${{ success() }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./build.sh gh-release-fork "$FORK"
