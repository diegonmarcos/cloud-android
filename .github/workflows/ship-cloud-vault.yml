name: "Ship → Cloud Vault APK (build + push to GHCR via ORAS + attach to GH Release)"

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        required: false
        type: choice
        default: "debug"
        options: [debug, release]
      push_oras:
        description: "Push APK to GHCR via ORAS"
        required: false
        type: boolean
        default: true
      create_release:
        description: "Create GitHub Release"
        required: false
        type: boolean
        default: false
      build_fork:
        description: "Build + publish the Bitwarden-fork (build.json::forks.vault) — the shipping Cloud-Vault.apk, ~14 min"
        required: false
        type: boolean
        default: true
      build_webview:
        description: "ALSO build the legacy WebView wrapper (pre-fork app) — manual fallback only, no longer published on push"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    tags:
      - "ac_cloud-vault-v*"
    paths:
      - "ac_cloud-vault/**"
      # Shared BY REFERENCE from aa_cloud-superapp/libs/ (settings.gradle
      # re-points projectDir there), so these compile into this APK without
      # living in this directory. Without them a shared-lib change ships no
      # new APK here and the installed build silently goes stale.
      - "ab_cloud-libs-shared/libs/browser/**"
      - "ab_cloud-libs-shared/libs/core/**"
      - "ab_cloud-libs-shared/libs/devtools/**"
      - "ab_cloud-libs-shared/libs/updater/**"
      - "1_cicd/src/cicd/ship-cloud-vault.yml"

permissions:
  contents: write
  packages: write

env:
  WORK_DIR: ac_cloud-vault

jobs:
  # ── Legacy WebView wrapper — manual fallback only ──────────────────────
  # This was the shipping app until the Bitwarden fork below was proven in CI
  # (run 31602029574, 2026-08-12). The fork job is now the push-triggered
  # publisher of Cloud-Vault.apk; run this with build_webview=true only to
  # resurrect the wrapper (note: push_oras/create_release here would overwrite
  # the fork's published latest with the WebView APK again).
  build_and_publish:
    name: "Build legacy WebView APK (${{ matrix.abi }}) — manual"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_webview }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64, x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 platforms;android-35 platforms;android-26 build-tools;35.0.0 build-tools;34.0.0 platform-tools"

      - name: Set up Gradle 8.10.2 (cached)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.10.2"

      - name: Checkout vault (shared Android signing key)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault

      - name: Install ORAS + sops + jq
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq
          curl -fsSL https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz \
            | sudo tar -C /usr/local/bin -xzf - oras
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64 \
            | sudo tee /usr/local/bin/sops >/dev/null && sudo chmod +x /usr/local/bin/sops

      - name: Determine variant
        id: variant
        run: |
          if   [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "variant=${{ inputs.variant }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK (engine)
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          CLOUDVAULT_VARIANT: ${{ matrix.abi }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x build.sh
          if [ "${{ steps.variant.outputs.variant }}" = "release" ]; then
            ./build.sh release
          else
            ./build.sh build
          fi
          ls -la dist/

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cloud-Vault-${{ matrix.abi }}-${{ steps.variant.outputs.variant }}-${{ github.sha }}
          path: ${{ env.WORK_DIR }}/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Login to GHCR
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_oras }}
        run: echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push APK to GHCR via ORAS
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_oras }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          CLOUDVAULT_VARIANT: ${{ matrix.abi }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./build.sh oras-push

      - name: Publish to GitHub Releases
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.create_release }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          CLOUDVAULT_VARIANT: ${{ matrix.abi }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: ./build.sh gh-release

  # ── Bitwarden-fork build (build.json::forks.vault) — THE shipping app ──
  # Promoted 2026-08-18: this job now publishes Cloud-Vault.apk (GHCR :latest
  # + GH release rolling tag "latest"), replacing the WebView wrapper above.
  # Runs on every push touching this app (~14 min, path-filtered so rare).
  # The fork APK stages as dist/Cloud-Vault.apk so build.sh's oras-push /
  # gh-release pick it up under the constellation asset name unchanged —
  # aa_cloud-superapp's constellation-fleet.json release_url keeps working.
  # The x86_64 variant (Cloud-Vault-x86_64.apk / GHCR :latest-x86_64) is
  # published from the SAME universal APK — see the staging step below.
  #
  # First green run: 31602029574 (2026-08-12) — assembleFdroidRelease, signed,
  # 36 MB fdroid/release APK.
  #
  # com.bitwarden:sdk-android resolves from
  # https://maven.pkg.github.com/bitwarden/sdk, which 401s anonymously. Upstream's
  # settings.gradle.kts reads the credential as:
  #   password = userProperties["gitHubToken"] ?: System.getenv("GITHUB_TOKEN")
  #   (username is hardcoded to "")
  # The auto-minted per-run GITHUB_TOKEN was assumed too repo-scoped to read
  # another owner's Packages. It is not — it resolved the SDK with no 401, so no
  # BITWARDEN_PACKAGES_TOKEN secret exists or is needed. The env below still
  # prefers that secret if anyone ever sets one.
  build_fork_vault:
    name: "Build + publish Bitwarden fork (build-fork vault)"
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WORK_DIR: ac_cloud-vault
      FORK: vault

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Upstream pins compileSdk/targetSdk = 37 (gradle/libs.versions.toml
          # at v2026.7.1-bwpm), so API 37 is required — but Google publishes it
          # under minor-versioned paths. "platforms;android-37" does not exist
          # and sdkmanager fails the whole step with "Failed to find package";
          # the real stable packages are android-37.0 and android-37.1. Both are
          # installed because the compileSdk -> minor-platform mapping depends on
          # the AGP version the fork ships.
          packages: "platforms;android-37.0 platforms;android-37.1 build-tools;37.0.0 platform-tools"

      - name: Checkout vault (shared Android signing key)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault

      # The fork signs with the same sops-encrypted shared key as the WebView
      # job — sops must be on PATH before build-fork's signing step (an early
      # run died at "FATAL signing: sops not on PATH"). ORAS + jq because this
      # job now publishes to GHCR + the GH release.
      - name: Install ORAS + sops + jq
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq
          curl -fsSL https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz \
            | sudo tar -C /usr/local/bin -xzf - oras
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64 \
            | sudo tee /usr/local/bin/sops >/dev/null && sudo chmod +x /usr/local/bin/sops

      - name: Materialize fork (clone @ pin + patch series)
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
        run: |
          chmod +x build.sh
          ./build.sh materialize-fork "$FORK"

      - name: Build fork APK (fork's own gradle wrapper + constellation signing)
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          # Read by upstream settings.gradle.kts (GitHubPackages/bitwarden/sdk
          # repository credentials) as System.getenv("GITHUB_TOKEN") — NOT a
          # gradle -P property.
          #
          # Falls back to the auto-minted GITHUB_TOKEN when the PAT secret is
          # unset. maven.pkg.github.com refuses anonymous reads (401) but serves
          # com.bitwarden:sdk-android to an ordinary authenticated token (200,
          # verified 2026-08-12), so the fallback is worth attempting before
          # anyone mints a PAT. If the fork build 401s on dependency resolution,
          # that is the signal the auto-minted token is repo-scoped after all —
          # set BITWARDEN_PACKAGES_TOKEN to a PAT with read:packages and re-run.
          GITHUB_TOKEN: ${{ secrets.BITWARDEN_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          ./build.sh build-fork "$FORK"
          ls -la dist/

      - name: Upload fork APK as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-vault-bitwarden-fork-${{ github.sha }}
          path: ${{ env.WORK_DIR }}/dist/cloud-vault-vault.apk
          if-no-files-found: warn
          retention-days: 14

      # Rename to the constellation asset names so build.sh's oras-push /
      # gh-release stage the fork APK per variant. The fdroid release APK is
      # UNIVERSAL (full lib/ sets for arm64-v8a, armeabi-v7a, x86, x86_64 —
      # verified on the 2026-08-18 release), so the SAME file serves both the
      # arm64 asset (Cloud-Vault.apk, CLOUDVAULT_VARIANT unset → matches
      # release.artifact.debug) and the x86_64 asset (Cloud-Vault-x86_64.apk,
      # CLOUDVAULT_VARIANT=x86_64 → suffixed GHCR tags + gh_asset).
      - name: Stage fork APK as constellation assets
        working-directory: ${{ env.WORK_DIR }}
        run: |
          cp dist/cloud-vault-vault.apk dist/Cloud-Vault.apk
          cp dist/cloud-vault-vault.apk dist/Cloud-Vault-x86_64.apk

      - name: Login to GHCR
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_oras }}
        run: echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push APK to GHCR via ORAS (arm64 + x86_64 tags)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_oras }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          GITHUB_SHA: ${{ github.sha }}
        run: |
          ./build.sh oras-push
          CLOUDVAULT_VARIANT=x86_64 ./build.sh oras-push

      - name: Publish to GitHub Releases (both assets)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.create_release }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          ./build.sh gh-release
          CLOUDVAULT_VARIANT=x86_64 ./build.sh gh-release
