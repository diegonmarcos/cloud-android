apply plugin: 'com.android.application'

// Every value below comes from build.json, like every other constellation repo:
// the SDK levels used to live in gradle.properties and the host package was a
// findProperty default buried here, so three files each held part of the truth.
def buildJson = new groovy.json.JsonSlurper().parse(file('../build.json'))
def cfg       = buildJson.android

// Package name is NOT com.termux.boot and NOT a Termux plugin in the usual
// sense. See BootReceiver.java for why this app cannot use sharedUserId and
// therefore cannot be a fork of termux-boot.
// A -PNOD_PACKAGE_NAME still wins, so a differently-packaged host can be built
// without editing data.
def hostPackage = project.findProperty("NOD_PACKAGE_NAME") ?: cfg.host_package

android {
    namespace "com.termux.nix.boot"
    compileSdk buildJson.toolchain.compile_sdk

    defaultConfig {
        applicationId cfg.application_id
        minSdk    cfg.min_sdk
        targetSdk cfg.target_sdk
        versionCode cfg.version_code
        versionName cfg.version_name

        // The host package is compiled in: every intent action, extra key and
        // permission below is namespaced by it (TermuxConstants derives them
        // all from TERMUX_PACKAGE_NAME), so it must match the installed app.
        manifestPlaceholders.NOD_PACKAGE_NAME = hostPackage
        buildConfigField "String", "NOD_PACKAGE_NAME", "\"${hostPackage}\""
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        // ONE shared Cloud-constellation signing key, resolved by build.sh from
        // the vault. Without it the fleet updater cannot update this APK: an
        // update must carry the same signature as the install it replaces.
        release {
            storeFile     = System.getenv("ANDROID_KEYSTORE_FILE") ? file(System.getenv("ANDROID_KEYSTORE_FILE")) : null
            storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: ""
            keyAlias      = System.getenv("ANDROID_KEY_ALIAS")         ?: ""
            keyPassword   = System.getenv("ANDROID_KEY_PASSWORD")      ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            def sc = signingConfigs.release
            signingConfig = (sc.storeFile != null) ? sc : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = new File("cloud-unix-termux-boot_v" + variant.versionName + "+" + variant.buildType.name + ".apk")
        }
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.7.0"
}
