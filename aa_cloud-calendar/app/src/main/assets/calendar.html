<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar & Time App UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
    // Calendar category data layer.
    // Each top-level category maps to one arc color in the UI.
    // Sub-categories are the task layers within that color track.
    const CALENDAR_CATEGORIES = [
        {
            id: "work",
            label: "Work",
            color: "#60B0FF",       // blue arcs
            colorClass: "color-blue",
            subs: [
                { id: "meetings",   label: "Meetings",        color: "#4A9FEF" },
                { id: "deadlines",  label: "Deadlines",       color: "#3A8FDE" },
                { id: "reviews",    label: "Reviews",         color: "#6ABFFF" },
                { id: "planning",   label: "Planning",        color: "#80CFFF" }
            ]
        },
        {
            id: "personal",
            label: "Personal",
            color: "#F5B0ED",       // pink arcs
            colorClass: "color-pink",
            subs: [
                { id: "social",         label: "Social",       color: "#F090DD" },
                { id: "appointments",   label: "Appointments", color: "#E080CD" },
                { id: "birthdays",      label: "Birthdays",    color: "#F5C0EE" },
                { id: "self_care",      label: "Self-care",    color: "#FFD0F8" }
            ]
        },
        {
            id: "health",
            label: "Health",
            color: "#60E0E0",       // cyan arcs
            colorClass: "color-cyan",
            subs: [
                { id: "gym",        label: "Gym",             color: "#40D0D0" },
                { id: "doctor",     label: "Doctor",          color: "#50C8C8" },
                { id: "nutrition",  label: "Nutrition",       color: "#70E8E8" },
                { id: "sleep",      label: "Sleep",           color: "#90F0F0" }
            ]
        },
        {
            id: "projects",
            label: "Projects",
            color: "#FDE060",       // yellow arcs
            colorClass: "color-yellow",
            subs: [
                { id: "sprints",    label: "Sprints",         color: "#EDD050" },
                { id: "milestones", label: "Milestones",      color: "#FDE870" },
                { id: "demos",      label: "Demos",           color: "#FDF080" },
                { id: "research",   label: "Research",        color: "#FEC840" }
            ]
        },
        {
            id: "family",
            label: "Family",
            color: "#F9AD6A",       // orange arcs
            colorClass: "color-orange",
            subs: [
                { id: "events",     label: "Events",          color: "#F09D5A" },
                { id: "school",     label: "School",          color: "#F8BD7A" },
                { id: "travel",     label: "Travel",          color: "#FACD8A" },
                { id: "chores",     label: "Chores",          color: "#E88D4A" }
            ]
        }
    ];

    // State: which categories are visible (all on by default).
    const activeCategories = new Set(CALENDAR_CATEGORIES.map(c => c.id));
    const activeSubs = new Set(
        CALENDAR_CATEGORIES.flatMap(c => c.subs.map(s => s.id))
    );

    function toggleCategory(id) {
        const cat = CALENDAR_CATEGORIES.find(c => c.id === id);
        if (activeCategories.has(id)) {
            activeCategories.delete(id);
            cat.subs.forEach(s => activeSubs.delete(s.id));
        } else {
            activeCategories.add(id);
            cat.subs.forEach(s => activeSubs.add(s.id));
        }
        applyVisibility();
    }

    function toggleSub(catId, subId) {
        if (activeSubs.has(subId)) {
            activeSubs.delete(subId);
        } else {
            activeSubs.add(subId);
            activeCategories.add(catId);
        }
        applyVisibility();
    }

    function applyVisibility() {
        CALENDAR_CATEGORIES.forEach(cat => {
            const arcs = document.querySelectorAll(`.${cat.colorClass}`);
            const visible = activeCategories.has(cat.id);
            arcs.forEach(el => el.closest('svg').style.display = visible ? '' : 'none');
        });
        // Re-render legend dot states.
        document.querySelectorAll('[data-cat]').forEach(el => {
            const id = el.dataset.cat;
            el.style.opacity = activeCategories.has(id) ? '1' : '0.35';
        });
        document.querySelectorAll('[data-sub]').forEach(el => {
            const id = el.dataset.sub;
            el.style.opacity = activeSubs.has(id) ? '1' : '0.35';
        });
    }

    // Build category pills in a horizontal scroll row.
    // Tap a category pill → expand sub-category row below it.
    let expandedCat = null;

    function buildLegend() {
        const panel = document.getElementById('categories-panel');
        if (!panel) return;
        // Category pills
        panel.innerHTML = CALENDAR_CATEGORIES.map(cat => `
            <button data-cat="${cat.id}" onclick="tapCategory('${cat.id}')"
                class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[12px] font-medium whitespace-nowrap border border-gray-100 transition-all"
                style="border-color:${cat.color}22; background:${cat.color}18; color:#444;">
                <span class="w-2 h-2 rounded-full" style="background:${cat.color}"></span>
                ${cat.label}
            </button>
        `).join('');
        applyVisibility();
    }

    function tapCategory(id) {
        if (expandedCat === id) {
            // Second tap = toggle visibility
            toggleCategory(id);
        } else {
            // First tap = expand sub row
            expandedCat = id;
            renderSubRow(id);
        }
    }

    function renderSubRow(catId) {
        const existing = document.getElementById('sub-row');
        if (existing) existing.remove();
        const cat = CALENDAR_CATEGORIES.find(c => c.id === catId);
        const container = document.getElementById('categories-panel').closest('.px-6');
        const row = document.createElement('div');
        row.id = 'sub-row';
        row.className = 'flex overflow-x-auto hide-scrollbar gap-2 mt-2 transition-all';
        row.innerHTML = cat.subs.map(sub => `
            <button data-sub="${sub.id}" onclick="toggleSub('${catId}','${sub.id}')"
                class="flex items-center gap-1 px-2.5 py-1 rounded-full text-[10px] font-medium whitespace-nowrap"
                style="background:${sub.color}22; color:#555; border:1px solid ${sub.color}44;">
                <span class="w-1.5 h-1.5 rounded-full" style="background:${sub.color}"></span>
                ${sub.label}
            </button>
        `).join('');
        container.appendChild(row);
        applyVisibility();
    }

    document.addEventListener('DOMContentLoaded', buildLegend);
    </script>

        body {

            min-height: 100vh;
            margin: 0;

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .app-container {
            width: 100%;
            max-width: 390px;
            height: 844px;
            background-color: white;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            position: relative;
            border: 8px solid #111;
        }

        .arc-svg {
            position: absolute;
            inset: -4px;
            width: calc(100% + 8px);
            height: calc(100% + 8px);
            transform: rotate(-90deg);
            pointer-events: none;
        }
        .arc { fill: none; stroke-width: 2.5; stroke-linecap: round; }
        .arc-1 { stroke-dasharray: 20 100.5; stroke-dashoffset: 0; }
        .arc-2 { stroke-dasharray: 25 100.5; stroke-dashoffset: -30; }
        .arc-3 { stroke-dasharray: 15 100.5; stroke-dashoffset: -65; }
        .arc-4 { stroke-dasharray: 22 100.5; stroke-dashoffset: -75; }

        .color-cyan   { stroke: #60E0E0; }
        .color-pink   { stroke: #F5B0ED; }
        .color-yellow { stroke: #FDE060; }
        .color-orange { stroke: #F9AD6A; }
        .color-blue   { stroke: #60B0FF; }

        .clock-number {
            position: absolute;
            width: 30px; height: 30px;
            top: 50%; left: 50%;
            margin-top: -15px; margin-left: -15px;
            display: flex; justify-content: center; align-items: center;
            font-size: 15px; font-weight: 500; color: #111;
        }

        .clip-highlighter { clip-path: polygon(25% 0%, 75% 0%, 100% 100%, 0% 100%); }
    </style>
</head>

                <div class="absolute top-1/2 left-1/2 w-0 h-0 z-0">
                    <div class="absolute bg-[#F3BAEC] text-[#9A4698] font-medium text-[11px] px-3.5 py-1.5 rounded-[10px] whitespace-nowrap"
                         style="transform: translate(25px, -150px) rotate(12deg);">Lunch</div>
                    <div class="absolute bg-[#B7EBF5] text-[#3492A7] font-medium text-[9px] px-2.5 py-1 rounded-full whitespace-nowrap"

                    <div class="absolute bg-[#F3AEF3] text-[#9B369A] font-medium text-[11px] px-4 py-1.5 rounded-[10px] whitespace-nowrap"

                    <svg class="absolute pointer-events-none" style="width: 340px; height: 340px; left: -170px; top: -170px;">
                        <circle cx="170" cy="170" r="145" fill="none" stroke="#FEF08A" stroke-width="26" stroke-linecap="round"
                                stroke-dasharray="140 1000" style="transform-origin: center; transform: rotate(62deg);" />

                    <div class="absolute text-[#A59530] font-medium text-[12px]" style="transform: translate(-18px, 138px);">Beach</div>
                    <div class="absolute text-2xl drop-shadow-md" style="transform: translate(130px, 30px); filter: saturate(1.2);">&#10084;&#65039;</div>

        </div>

        <!-- Bottom Toolbar -->
        <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-white via-white to-white/0 pt-16 pb-6 px-8 flex justify-between items-end z-30">
            <div class="flex gap-5 items-end w-full justify-center pr-4">
                <div class="w-7 h-[55px] bg-gradient-to-b from-[#FDE87E] to-[#FCE15F] rounded-t-[6px] relative flex flex-col items-center shadow-sm">
                    <div class="w-5 h-2.5 bg-[#E6CD3F] rounded-t-sm absolute -top-2.5"></div>
                    <div class="w-full h-1.5 bg-[#F4D957] absolute top-2"></div>

                </div>
                <div class="w-7 h-[45px] bg-gradient-to-b from-[#94E6F6] to-[#7EDCF0] rounded-t-[6px] relative flex flex-col items-center shadow-sm">
                    <div class="w-5 h-2.5 bg-[#6BCBDE] rounded-t-sm absolute -top-2.5"></div>
                    <div class="w-full h-1.5 bg-[#75D2E5] absolute top-2"></div>

                <div class="w-7 h-[45px] bg-gradient-to-tr from-[#F2B0D6] via-[#B8D7F4] to-[#F4E38A] rounded-t-[6px] relative flex flex-col items-center shadow-sm">
                    <div class="w-5 h-2.5 bg-gradient-to-r from-[#DF94C0] to-[#9BC4E6] rounded-t-sm absolute -top-2.5"></div>
                    <div class="w-full h-1.5 bg-white/30 absolute top-2 backdrop-blur-sm"></div>
                    <div class="w-full h-[1px] bg-white/50 absolute top-4"></div>
                </div>
                <div class="text-[26px] pb-1 ml-2 drop-shadow-sm filter saturate-110">&#10084;&#65039;</div>
            </div>
            <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-gray-900 rounded-full opacity-80"></div>
        </div>

    </div>
